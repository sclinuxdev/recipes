schema_version = 1

[package]
name = "wheel"
version = "0.48.0"
release = "2"
description = "Python wheel packaging tool"
license = "MIT"
channel = "system"

[source]
url = "https://files.pythonhosted.org/packages/d0/20/50ed6bdf27dec98b568a8ae25dc599f35baa3d9709f9e83fd1edb56b9a90/wheel-0.48.0.tar.gz"
sha256 = "94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322"

dependencies = [
    "python >= 3.14.7",
]

build_dependencies = [
    "python >= 3.14.7",
    "flit-core >= 3.9.0"
]

provides = [
    "wheel"
]

prepare = []

build = [
    "python3 -m flit_core.wheel"
]

install = [
    "mkdir -p $DESTDIR/usr/lib/python3.14/site-packages",
    "python3 -c \"import sys, zipfile, glob; [zipfile.ZipFile(f).extractall(sys.argv[1]) for f in glob.glob('dist/*.whl')]\" $DESTDIR/usr/lib/python3.14/site-packages"
]
