# Linux Userspace API Headers (UAPI) for libc (glibc/musl) and userspace toolchains.
#
# These are the standard syscall ABI headers generated by `make headers_install`
# from vanilla upstream kernel sources. They are installed to /usr/include/{linux,asm,...}
# and are strictly backward-compatible.

schema_version = 2

[package]
name = "linux-api-headers"
version = "7.1.10"
release = "1"
arch = "amd64"
description = "Linux kernel userspace API headers (/usr/include)"
license = "GPL-2.0-only"
channel = "system"

dependencies = []

provides = [
    "linux-api-headers",
    "linux-headers",
    "virtual/linux-headers"
]

[upstream]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/"
version_regex = 'linux-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.10.tar.xz"
sha256 = "67d2f4697a02f3bec98e744b1bdc307e920c24bb4e88b5ee97dc9a34e9aa9999"

[build]
system = "make"
header_only = true
payload = "outputs"
build_targets = ["headers"]
install_targets = []

[[build.steps]]
name = "install-uapi-headers"
phase = "install"
cwd = "source"
command = '''set -e
mkdir -p "$DESTDIR/usr/include"
find usr/include -type f ! -name '*.h' -delete
cp -rv usr/include/* "$DESTDIR/usr/include/"
'''

[[build.outputs]]
name = "linux-api-headers"
description = "Linux kernel userspace API headers (/usr/include)"
license = "GPL-2.0-only"
dependencies = []
provides = [
    "linux-api-headers",
    "linux-headers",
    "virtual/linux-headers"
]
install_files = [
    "usr/include/**"
]
