schema_version = 2

[package]
name = "btrfs-progs"
version = "7.1"
release = "1"
description = "Btrfs filesystem utilities"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "e2fsprogs-libs >= 1.47.4",
    "zstd-libs >= 1.5.7",
    "lzo >= 2.10",
    "util-linux-libs >= 2.42.2",
    "systemd-libs >= 261.2",
    "zlib >= 1.3.2",
]
build_dependencies = [
    "e2fsprogs-dev >= 1.47.4",
    "zstd-dev >= 1.5.7",
    "lzo-dev >= 2.10",
    "util-linux-dev >= 2.42.2",
    "pkgconf >= 3.0.5",
    "python >= 3.14.7"
]
provides = [
    "btrfs-progs"
]

[upstream]
url = "https://mirrors.edge.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/"
version_regex = 'btrfs-progs-v?([0-9][0-9.]*)\.tar'

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v7.1.tar.xz"
sha256 = "d1f55cc2971398c9142eaa79d203e63d586a3b4b867f956664a1d68322cd4e34"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--disable-documentation",
    "--disable-static"
]
