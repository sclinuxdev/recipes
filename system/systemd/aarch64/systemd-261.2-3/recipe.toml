schema_version = 1

[package]
name = "systemd"
version = "261.2"
release = "3"
arch = "aarch64"
description = "systemd core manager, control tools and default unit graph (PID 1, journald, logind)"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"

dependencies = [
    "systemd-libs >= 261.2",
    "systemd-udev >= 261.2",
    "kmod-libs >= 34.2",
    "util-linux-libs >= 2.42.2",
    "libcap-libs >= 2.78",
    "zstd-libs >= 1.5.7",
    "lz4-libs >= 1.10.0",
    "xz-libs >= 5.8.3",
    "openssl-libs >= 4.0.1",
    "pcre2-libs >= 10.47",
    "libseccomp >= 2.6.0",
    "acl-libs >= 2.4.0",
    "libxcrypt >= 4.5.2"
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "python >= 3.14.7",
    "jinja2 >= 3.1.6",
    "markupsafe >= 3.0.3",
    "gperf >= 3.3",
    "gettext >= 1.0",
    "kmod-dev >= 34.2",
    "util-linux-dev >= 2.42.2",
    "openssl-dev >= 4.0.1",
    "pkgconf >= 3.0.5",
    "libcap-dev >= 2.78",
    "pcre2-dev >= 10.47",
    "libseccomp-dev >= 2.6.0",
    "acl-dev >= 2.4.0",
    "libxcrypt-dev >= 4.5.2",
    "python-pyelftools >= 0.33",
]

provides = [
    "systemd",
    "virtual/init"
]

# glibc and systemd are core system software: they are pinned to gcc and
# never fall back to the default clang toolchain (a failed pin fails the build).
[build]
cc = "gcc"
cxx = "g++"
prepare = [
    "sed -e 's/GROUP=\"render\"/GROUP=\"video\"/' -e 's/GROUP=\"sgx\", //' -i rules.d/50-udev-default.rules.in"
]

build = [
    "mkdir -p build",
    "cd build && meson setup .. --prefix=/usr --buildtype=release -D default-dnssec=no -D firstboot=false -D install-tests=false -D ldconfig=false -D sysusers=false -D rpmmacrosdir=no -D homed=disabled -D man=disabled -D mode=release -D pamconfdir=no -D dev-kvm-mode=0660 -D nobody-group=nogroup -D sysupdate=disabled -D ukify=disabled -D docdir=/usr/share/doc/systemd-261.2 -Dtranslations=false -Defi=true -Dbootloader=enabled -Dsbat-distro=sclinux -Dsbat-distro-summary='ShenChen Linux' -Dsbat-distro-pkgname=systemd -Dsbat-distro-version=261.2 -Dsbat-distro-url=https://github.com/sclinuxdev/recipes.aarch64",
    "cd build && ninja",
]

install = [
    "set -e; cd build && DESTDIR=$DESTDIR ninja install; rm -rf $DESTDIR/usr/lib/libsystemd.so.*; rm -rf $DESTDIR/usr/lib/libudev.so.*; rm -rf $DESTDIR/usr/lib/systemd/libsystemd-shared*; rm -rf $DESTDIR/usr/lib/systemd/libsystemd-core*; rm -rf $DESTDIR/usr/lib/libnss_systemd.so*; rm -rf $DESTDIR/usr/lib/libnss_myhostname.so*; rm -rf $DESTDIR/usr/lib/libnss_mymachines.so*; rm -rf $DESTDIR/usr/bin/udevadm; rm -rf $DESTDIR/usr/bin/systemd-hwdb; rm -rf $DESTDIR/usr/lib/systemd/systemd-udevd; rm -rf $DESTDIR/usr/lib/systemd/systemd-hwdb; rm -rf $DESTDIR/usr/lib/udev; rm -rf $DESTDIR/usr/lib/hwdb.d; rm -rf $DESTDIR/etc/udev; rm -rf $DESTDIR/usr/lib/modprobe.d; rm -rf $DESTDIR/usr/lib/systemd/network/*.link; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-udevd*; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-udev-*; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-hwdb*; rm -rf $DESTDIR/usr/lib/systemd/system/initrd-udevadm*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-udevd*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-udev-*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-hwdb*; rm -rf $DESTDIR/usr/bin/networkctl; rm -rf $DESTDIR/usr/lib/systemd/systemd-networkd; rm -rf $DESTDIR/usr/lib/systemd/systemd-networkd-wait-online; rm -rf $DESTDIR/usr/lib/systemd/systemd-network-generator; rm -rf $DESTDIR/usr/lib/systemd/network/*.network; rm -rf $DESTDIR/usr/lib/systemd/network/*.netdev; rm -rf $DESTDIR/etc/systemd/network; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-networkd*; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-network-generator*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-networkd*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-network-generator*; rm -rf $DESTDIR/usr/lib/systemd/system/dbus-org.freedesktop.network1.service; rm -rf $DESTDIR/usr/bin/resolvectl; rm -rf $DESTDIR/usr/bin/systemd-resolve; rm -rf $DESTDIR/usr/lib/systemd/systemd-resolved; rm -rf $DESTDIR/usr/lib/libnss_resolve.so*; rm -rf $DESTDIR/etc/systemd/resolved.conf; rm -rf $DESTDIR/etc/systemd/resolved.conf.d; rm -rf $DESTDIR/usr/lib/systemd/resolv.conf; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-resolved*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-resolved*; rm -rf $DESTDIR/usr/lib/systemd/system/dbus-org.freedesktop.resolve1.service; rm -rf $DESTDIR/usr/lib/systemd/systemd-timesyncd; rm -rf $DESTDIR/etc/systemd/timesyncd.conf; rm -rf $DESTDIR/etc/systemd/timesyncd.conf.d; rm -rf $DESTDIR/usr/lib/systemd/ntp-units.d; rm -rf $DESTDIR/usr/lib/systemd/system/systemd-timesyncd*; rm -rf $DESTDIR/usr/lib/systemd/system/*/systemd-timesyncd*; rm -rf $DESTDIR/usr/lib/systemd/system/dbus-org.freedesktop.timesync1.service; rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/share/pkgconfig $DESTDIR/usr/share/doc 2>/dev/null || true; rm -f $DESTDIR/usr/lib/libsystemd.so $DESTDIR/usr/lib/libudev.so; for p in usr/lib/systemd/systemd usr/bin/systemctl usr/bin/journalctl usr/lib/systemd/system/basic.target usr/lib/systemd/system/sysinit.target usr/lib/systemd/system/default.target; do [ -e \"$DESTDIR/$p\" ] || { echo \"ERROR: systemd core missing $p\" >&2; exit 1; }; done",
    "rm -rf $DESTDIR/usr/share/mime",
    "! find $DESTDIR -name 'share' -path '*usr/share/mime*' | grep -q . || { echo 'ERROR: mime payload must stay out of systemd' >&2; exit 1; }",
    "test -f $DESTDIR/usr/lib/systemd/systemd || { echo 'ERROR: PID1 binary missing' >&2; exit 1; }",
    "test -f $DESTDIR/usr/lib/systemd/boot/efi/systemd-bootaa64.efi || { echo 'ERROR: AArch64 systemd-boot EFI payload missing' >&2; exit 1; }",
]
