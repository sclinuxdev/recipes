schema_version = 1

[package]
name = "systemd"
version = "261.2"
release = 1
epoch = 0
description = "System and Service Manager (PID 1, journald, logind, systemctl)"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "systemd-libs >= 261.2-1",
    "systemd-udev >= 261.2-1",
    "util-linux-libs >= 2.42.2-1",
    "kmod-libs >= 34.2-1",
    "libcap-libs >= 2.78-1",
    "libseccomp-libs >= 2.6.0-1",
    "zstd-libs >= 1.5.7-1",
    "xz-libs >= 5.8.3-1",
    "shadow >= 4.20.2-1",
    "dbus-libs >= 1.16.2-1",
]

provides = ["virtual/init", "systemd", "init"]

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"

[build]
inherit = ["meson"]
dependencies = [
    "dbus-dev >= 1.16.2-1",
    "kmod-dev >= 34.2-1",
    "libcap-dev >= 2.78-1",
    "util-linux-dev >= 2.42.2-1",
    "xz-dev >= 5.8.3-1",
]

[build.args]
meson_args = "-Dmode=release -Dsplit-usr=false -Ddefault-hierarchy=unified -Dsysvinit-path= -Dsysvrcnd-path= -Dpam=disabled"

[build.payload]
default = "remaining"
excludes = ["usr/lib/systemd/system/*.service"]

[[subpackages]]
name = "systemd-libs"
description = "systemd runtime core shared libraries (libsystemd, libudev)"
license = "LGPL-2.1-or-later"
dependencies = [
    "virtual/libc",
    "libcap-libs >= 2.78-1",
    "zstd-libs >= 1.5.7-1",
    "xz-libs >= 5.8.3-1",
]
provides = [
    "systemd-libs",
    "so:libsystemd.so.0",
    "so:libudev.so.1",
]

[subpackages.payload]
files = [
    "usr/lib/libsystemd.so.*",
    "usr/lib/libudev.so.*",
]

[[subpackages]]
name = "systemd-dev"
description = "systemd development headers, pkgconfig and linker symbols"
license = "LGPL-2.1-or-later"
dependencies = [
    "systemd-libs >= 261.2-1",
]
provides = ["systemd-dev"]

[subpackages.payload]
files = [
    "usr/include/systemd/**",
    "usr/lib/libsystemd.so",
    "usr/lib/libudev.so",
    "usr/lib/pkgconfig/libsystemd.pc",
    "usr/lib/pkgconfig/libudev.pc",
]

[[subpackages]]
name = "systemd-udev"
description = "Rule-based device node and hardware manager (udevd, udevadm)"
license = "GPL-2.0-or-later"
dependencies = [
    "virtual/libc",
    "systemd-libs >= 261.2-1",
    "kmod-libs >= 34.2-1",
    "hwdata",
]
provides = ["virtual/udev", "systemd-udev", "udev"]

[subpackages.payload]
files = [
    "usr/bin/udevadm",
    "usr/lib/systemd/systemd-udevd",
    "usr/lib/udev/**",
]

[[subpackages]]
name = "systemd-boot"
description = "Simple UEFI boot manager (bootctl, systemd-boot EFI binaries)"
license = "LGPL-2.1-or-later"
dependencies = [
    "virtual/libc",
    "systemd-libs >= 261.2-1",
]
provides = ["systemd-boot", "virtual/bootloader"]

[subpackages.payload]
files = [
    "usr/bin/bootctl",
    "usr/lib/systemd/boot/efi/**",
    "usr/share/systemd/boot/**",
]

[[subpackages]]
name = "systemd-networkd"
description = "Declarative network management daemon (systemd-networkd, networkctl)"
license = "LGPL-2.1-or-later"
dependencies = [
    "virtual/libc",
    "systemd >= 261.2-1",
    "systemd-libs >= 261.2-1",
    "iproute2",
]
provides = ["systemd-networkd", "virtual/network-manager"]

[subpackages.payload]
files = [
    "usr/bin/networkctl",
    "usr/lib/systemd/systemd-networkd*",
    "usr/lib/systemd/network/**",
]

[[subpackages]]
name = "systemd-resolved"
description = "Network name resolution and caching DNS client (systemd-resolved, resolvectl)"
license = "LGPL-2.1-or-later"
dependencies = [
    "virtual/libc",
    "systemd >= 261.2-1",
    "systemd-libs >= 261.2-1",
    "openssl-libs >= 4.0.1-1",
]
provides = ["systemd-resolved", "virtual/dns-resolver"]

[subpackages.payload]
files = [
    "usr/bin/resolvectl",
    "usr/lib/systemd/systemd-resolved",
]

[[subpackages]]
name = "systemd-timesyncd"
description = "Lightweight NTP network time synchronization client (systemd-timesyncd, timedatectl)"
license = "LGPL-2.1-or-later"
dependencies = [
    "virtual/libc",
    "systemd >= 261.2-1",
    "systemd-libs >= 261.2-1",
]
provides = ["systemd-timesyncd", "virtual/ntp-client"]

[subpackages.payload]
files = [
    "usr/bin/timedatectl",
    "usr/lib/systemd/systemd-timesyncd",
]

[[sysusers]]
package = "systemd-networkd"
type = "user"
name = "systemd-network"
id = 997
description = "systemd Network Management"
home = "/"
shell = "/usr/bin/nologin"

[[sysusers]]
package = "systemd-resolved"
type = "user"
name = "systemd-resolve"
id = 998
description = "systemd Resolver"
home = "/"
shell = "/usr/bin/nologin"

[[sysusers]]
package = "systemd-timesyncd"
type = "user"
name = "systemd-timesync"
id = 999
description = "systemd Time Synchronization"
home = "/"
shell = "/usr/bin/nologin"

[features.zstd]
default = true
dependencies = ["zstd-libs >= 1.5.7-1"]
build_dependencies = ["zstd-dev >= 1.5.7-1"]
[features.zstd.args]
meson_args = "-Dzstd=enabled"

[features.openssl]
default = true
dependencies = ["openssl-libs >= 4.0.1-1"]
build_dependencies = ["openssl-dev >= 4.0.1-1"]
[features.openssl.args]
meson_args = "-Dopenssl=enabled"

[features.seccomp]
default = true
dependencies = ["libseccomp-libs >= 2.6.0-1"]
build_dependencies = ["libseccomp-dev >= 2.6.0-1"]
[features.seccomp.args]
meson_args = "-Dseccomp=enabled"
