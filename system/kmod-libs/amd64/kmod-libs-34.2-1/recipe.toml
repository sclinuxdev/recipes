schema_version = 2

[package]
name = "kmod-libs"
version = "34.2"
release = "1"
description = "libkmod shared runtime library"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "xz-libs >= 5.8.3",
    "zlib >= 1.3.2",
    "zstd-libs >= 1.5.7",
    "openssl-libs >= 4.0.1"
]
build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "pkgconf >= 3.0.5",
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "xz-dev >= 5.8.3",
    "zstd-dev >= 1.5.7"
]
provides = [
    "kmod-libs",
    "so:libkmod.so.2"
]

[upstream]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/"
version_regex = 'kmod-libs-v?([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz"
sha256 = "5a5d5073070cc7e0c7a7a3c6ec2a0e1780850c8b47b3e3892226b93ffcb9cb54"

[build]
system = "meson"
configure_options = [
    "-Dmanpages=false",
]
