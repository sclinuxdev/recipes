schema_version = 1

[package]
name = "systemd-resolved"
version = "261.2"
release = "1"
description = "systemd-resolved DNS resolver and nss-resolve"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"

dependencies = [
    "systemd-libs >= 261.2",
    "systemd >= 261.2",
    "openssl-libs >= 4.0.1"
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "python >= 3.14.7",
    "jinja2 >= 3.1.6",
    "markupsafe >= 3.0.3",
    "gperf >= 3.3",
    "gettext >= 1.0",
    "kmod-dev >= 34.2",
    "util-linux-dev >= 2.42.2",
    "openssl-dev >= 4.0.1",
    "pkgconf >= 3.0.5",
    "libcap-dev >= 2.78",
    "pcre2-dev >= 10.47",
    "libseccomp-dev >= 2.6.0",
    "acl-dev >= 2.4.0",
    "libxcrypt-dev >= 4.5.2"
]

provides = [
    "systemd-resolved"
]

prepare = [
    "sed -e 's/GROUP=\"render\"/GROUP=\"video\"/' -e 's/GROUP=\"sgx\", //' -i rules.d/50-udev-default.rules.in"
]

build = [
    "mkdir -p build",
    "cd build && meson setup .. --prefix=/usr --buildtype=release -D default-dnssec=no -D firstboot=false -D install-tests=false -D ldconfig=false -D sysusers=false -D rpmmacrosdir=no -D homed=disabled -D man=disabled -D mode=release -D pamconfdir=no -D dev-kvm-mode=0660 -D nobody-group=nogroup -D sysupdate=disabled -D ukify=disabled -D docdir=/usr/share/doc/systemd-261.2",
    "cd build && ninja -j$(nproc)"
]

install = [
    "set -e; cd build && DESTDIR=$DESTDIR ninja install; KEEP=$(mktemp -d); ( cd \"$DESTDIR\" && for g in 'usr/bin/resolvectl' 'usr/bin/systemd-resolve' 'usr/lib/systemd/systemd-resolved' 'usr/lib/libnss_resolve.so*' 'etc/systemd/resolved.conf' 'etc/systemd/resolved.conf.d' 'usr/lib/systemd/resolv.conf' 'usr/lib/systemd/system/systemd-resolved*' 'usr/lib/systemd/system/*/systemd-resolved*' 'usr/lib/systemd/system/dbus-org.freedesktop.resolve1.service'; do for p in $g; do [ -e \"$p\" ] || continue; tar -cf - \"$p\" | tar -C \"$KEEP\" -xf -; done; done ); find \"$DESTDIR\" -mindepth 1 -maxdepth 1 -exec rm -rf {} +; mkdir -p \"$DESTDIR\"; if [ -z \"$(ls -A \"$KEEP\" 2>/dev/null)\" ]; then echo 'ERROR: systemd split keep-set empty' >&2; rm -rf \"$KEEP\"; exit 1; fi; cp -a \"$KEEP\"/. \"$DESTDIR\"/; rm -rf \"$KEEP\""
]
