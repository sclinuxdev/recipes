schema_version = 1

[package]
name = "gptfdisk"
version = "1.0.10"
release = 1
epoch = 0
description = "GUID Partition Table (GPT) disk partitioning utilities (gdisk, sgdisk, cgdisk)"
license = "GPL-2.0-only"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "ncurses-libs >= 6.6-1",
    "popt-libs >= 1.19-1",
    "util-linux-libs >= 2.42.2-1",
]

provides = ["gptfdisk"]

[source]
url = "https://sourceforge.net/projects/gptfdisk/files/gptfdisk/1.0.10/gptfdisk-1.0.10.tar.gz"
sha256 = "2abed61bc6d2b9ec498973c0440b8b804b7a72d7144069b5a9209b2ad693a282"

[build]
inherit = ["autotools"]

[build.payload]
default = "remaining"
