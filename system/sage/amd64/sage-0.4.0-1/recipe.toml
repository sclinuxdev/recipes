schema_version = 1

[package]
name = "sage"
version = "0.4.0"
release = 1
epoch = 0
description = "Next-generation ultra-fast declarative package manager and system reconciliation suite"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "bubblewrap >= 0.11.2-1",
    "fakeroot >= 2.1.4-1",
    "zstd-libs >= 1.5.7-1",
    "lmdb-libs >= 0.9.35-1",
]

provides = ["sage", "virtual/package-manager"]

[source]
kind = "git"
url = "https://github.com/sclinuxdev/sage.git"
commit = "eee2b7b478cbf6b93ea93823a0a1d2a9d64c56e0"

[build]
inherit = ["cargo"]

[build.payload]
default = "remaining"

[[install.copies]]
source = "rclass"
path = "usr/share/sage/rclass"
recursive = true

[[install.copies]]
source = "triggers"
path = "usr/share/sage/triggers"
recursive = true
