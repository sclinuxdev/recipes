# Sage 0.2.4 amd64 v2 recipe. Sage owns the compiler, linker, flags and
# Xmake invocation; this file states only package requirements and payload.

schema_version = 2

[package]
name = "sage"
version = "0.2.4"
release = "2"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "lmdb >= 0.9.35",
    "zstd-libs >= 1.5.7",
    "curl-libs >= 8.21.0",
    "gcc-libs >= 15.3.0",
    "openssl-libs >= 4.0.1",
    "libarchive-libs >= 3.8.9",
    "zlib >= 1.3.2",
]

build_dependencies = [
    "fakeroot >= 2.1.4",
    "bubblewrap >= 0.11.0",
    "xmake >= 3.1.0",
    "lmdb-dev >= 0.9.35",
    "zstd-dev >= 1.5.7",
    "tomlplusplus-dev >= 3.4.0",
    "curl-dev >= 8.21.0",
    "openssl-dev >= 4.0.1",
    "libarchive-dev >= 3.8.9",
    "zlib-dev >= 1.3.2",
]

provides = ["sage"]
conffiles = ["/etc/sage/build.toml"]

[upstream]
url = "https://github.com/sclinuxdev/sage/tags"
version_regex = 'v(\d+\.\d+\.\d+)'

[source]
url = "https://codeload.github.com/sclinuxdev/sage/legacy.tar.gz/9f553c131b6f6160b362392f4a1d2134f1a540ab"
sha256 = "4376bee6ddf27e1f615b08337be4b0549d4a1bef9e9568a56209619a33eabc0d"

[build]
system = "xmake"
configure_options = ["-c", "-y"]
install_files = [
    "usr/bin/sage",
    "etc/sage/build.toml",
]
