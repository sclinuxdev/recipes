# Sage 0.2.4 v2 recipe for amd64.
#
# The v0.2.4 release tag identifies the public release. This source is pinned
# to the following 0.2.4 fixes, which make every managed Xmake step explicit
# under fakeroot, use the compiler driver for linking, install
# /etc/sage/build.toml, and preserve Sage's actual tool parameters in v2
# package manifests.
# Compiler, linker, flags and Xmake commands are selected and recorded by Sage;
# this recipe declares requirements only.

schema_version = 2

[package]
name = "sage"
version = "0.2.4"
release = "1"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "lmdb >= 0.9.35",
    "zstd-libs >= 1.5.7",
    "curl-libs >= 8.21.0",
    "gcc-libs >= 15.3.0",
    "openssl-libs >= 4.0.1",
    "libarchive-libs >= 3.8.9",
    "zlib >= 1.3.2",
]

build_dependencies = [
    "fakeroot >= 2.1.4",
    "xmake >= 3.1.0",
    "lmdb-dev >= 0.9.35",
    "zstd-dev >= 1.5.7",
    "tomlplusplus-dev >= 3.4.0",
    "curl-dev >= 8.21.0",
    "openssl-dev >= 4.0.1",
    "libarchive-dev >= 3.8.9",
    "zlib-dev >= 1.3.2",
]

provides = ["sage"]
conffiles = ["/etc/sage/build.toml"]

[upstream]
url = "https://github.com/sclinuxdev/sage/tags"
version_regex = 'v(\d+\.\d+\.\d+)'

[source]
url = "https://codeload.github.com/sclinuxdev/sage/tar.gz/b8057afe2a7572f4bb1b9d2e3fb13d19f8ec4a7f"
sha256 = "da380f14b14f5f70e785d52ed4e097a7a6c528f55bb5c35d3c389cdbaf6c3469"

[build]
system = "xmake"
configure_options = ["-c", "-y"]
install_files = [
    "usr/bin/sage",
    "etc/sage/build.toml",
]
