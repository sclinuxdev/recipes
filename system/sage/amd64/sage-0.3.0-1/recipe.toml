# Sage 0.3.0 amd64 v2 recipe, pinned to the released Sage commit.
#
# Compiler, linker and flags are intentionally absent: Sage selects and
# audits them from the target's build.toml. This recipe only declares package
# requirements, the verified source archive and the payload boundary.

schema_version = 2

[package]
name = "sage"
version = "0.3.0"
release = "1"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "lmdb >= 0.9.35",
    "zstd-libs >= 1.5.7",
    "curl-libs >= 8.21.0",
    "gcc-libs >= 15.3.0",
    "openssl-libs >= 4.0.1",
    "libarchive-libs >= 3.8.9",
    "zlib >= 1.3.2",
]

build_dependencies = [
    "fakeroot >= 2.1.4",
    "bubblewrap >= 0.11.0",
    "xmake >= 3.1.0",
    "lmdb-dev >= 0.9.35",
    "zstd-dev >= 1.5.7",
    "tomlplusplus-dev >= 3.4.0",
    "curl-dev >= 8.21.0",
    "openssl-dev >= 4.0.1",
    "libarchive-dev >= 3.8.9",
    "zlib-dev >= 1.3.2",
]

provides = ["sage"]
conffiles = ["/etc/sage/build.toml"]

[upstream]
url = "https://github.com/sclinuxdev/sage/releases"
version_regex = 'v([0-9]+\.[0-9]+\.[0-9]+)'

[source]
url = "https://codeload.github.com/sclinuxdev/sage/legacy.tar.gz/a7402fffba6c967a315147c52c20f1a725d5953b"
sha256 = "d71f6c9ae68e6237cf15335b7b4592cc51bcb0cfcbfa49ae676f16819a88397d"

[build]
system = "xmake"
install_files = [
    "usr/bin/sage",
    "etc/sage/build.toml",
]
