# Sage 0.3.1 amd64 v2 recipe, pinned to the published GitHub tag.
#
# Sage owns compiler selection, flags, sandboxing, and provenance.  This
# recipe declares only package metadata, verified source inputs, and the
# explicit payload boundary.

schema_version = 2

[package]
name = "sage"
version = "0.3.1"
release = "1"
description = "Universal Multi-Layer Linux Package Manager"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "lmdb >= 0.9.35",
    "zstd-libs >= 1.5.7",
    "tomlplusplus >= 3.4.0",
    "curl-libs >= 8.21.0",
    "gcc-libs >= 16.2.0",
    "openssl-libs >= 4.0.1",
    "libarchive-libs >= 3.8.9",
    "zlib >= 1.3.2",
]

build_dependencies = [
    "fakeroot >= 2.1.4",
    "bubblewrap >= 0.11.0",
    "xmake >= 3.1.0",
    "binutils >= 2.47",
    "lmdb-dev >= 0.9.35",
    "zstd-dev >= 1.5.7",
    "tomlplusplus >= 3.4.0",
    "curl-dev >= 8.21.0",
    "openssl-dev >= 4.0.1",
    "libarchive-dev >= 3.8.9",
    "zlib-dev >= 1.3.2",
]

provides = ["sage"]
conffiles = ["/etc/sage/build.toml"]

[upstream]
url = "https://github.com/sclinuxdev/sage/releases"
version_regex = 'v([0-9]+\\.[0-9]+\\.[0-9]+)'

[source]
url = "https://github.com/sclinuxdev/sage/archive/refs/tags/v0.3.1.tar.gz"
sha256 = "3c5d7980a30022612cac8cba056df0ff4a0f8f5f973bdfad30c3bb65afea3984"

[build]
system = "xmake"
payload = "allowlist"
install_files = [
    "usr/bin/sage",
    "etc/sage/build.toml",
]

[build.content]
strip = "unneeded"
