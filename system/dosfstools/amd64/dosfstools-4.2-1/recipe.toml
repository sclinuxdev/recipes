schema_version = 1

[package]
name = "dosfstools"
version = "4.2"
release = 1
epoch = 0
description = "DOS FAT32 and EFI filesystem manipulation tools (mkfs.fat, fsck.fat, fatlabel)"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "util-linux-libs >= 2.42.2-1",
]

provides = ["dosfstools"]

[source]
url = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
sha256 = "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--enable-compat-symlinks --disable-nls"

[build.payload]
default = "remaining"
