schema_version = 2

[package]
name = "dosfstools"
version = "4.2"
release = "1"
arch = "amd64"
description = "DOS FAT filesystem utilities (mkfs.fat, fsck.fat)"
license = "GPL-3.0-or-later"
channel = "system"
dependencies = [
]
provides = [
    "dosfstools"
]

[upstream]
url = "https://github.com/dosfstools/dosfstools/tags"
version_regex = 'v(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz"
sha256 = "64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--sbindir=/usr/bin",
    "--enable-compat-symlinks"
]
