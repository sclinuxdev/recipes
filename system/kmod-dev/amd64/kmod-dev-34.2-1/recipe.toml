schema_version = 2

[package]
name = "kmod-dev"
version = "34.2"
release = "1"
arch = "amd64"
description = "libkmod headers, pkg-config and linker symlink"
license = "LGPL-2.1-or-later"
channel = "system"

dependencies = [
    "kmod-libs >= 34.2"
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "pkgconf >= 3.0.5",
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "xz-dev >= 5.8.3",
    "zstd-dev >= 1.5.7"
]

provides = [
    "kmod-dev"
]

[upstream]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/"
version_regex = 'kmod-dev-v?([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz"
sha256 = "5a5d5073070cc7e0c7a7a3c6ec2a0e1780850c8b47b3e3892226b93ffcb9cb54"

[build]
system = "meson"
configure_options = [
    "-Dmanpages=false"
]
