schema_version = 2

[package]
name = "procps-ng-dev"
version = "4.0.7"
release = "1"
arch = "amd64"
description = "libproc2 headers, pkg-config and linker symlink"
license = "LGPL-2.1-or-later"
channel = "system"
dependencies = [
    "procps-ng-libs >= 4.0.7"
]
build_dependencies = [
    "pkgconf >= 3.0.5",
    "ncurses-dev >= 6.6"
]
provides = [
    "procps-ng-dev"
]

[upstream]
url = "https://sourceforge.net/projects/procps-ng/files/Production/"
version_regex = 'procps-ng-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-4.0.7.tar.xz"
sha256 = "9d2021f47a4501c667862c9942a92d1953694b21d11bcd1702e83eb594e3d67d"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--disable-kill",
    "--enable-watch8bit"
]
