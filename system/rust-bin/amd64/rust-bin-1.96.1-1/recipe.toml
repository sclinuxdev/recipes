schema_version = 2

[package]
name = "rust-bin"
version = "1.96.1"
release = "1"
description = "Rust compiler and Cargo binary distribution (toolchain channel)"
license = "Apache-2.0 OR MIT"
channel = "toolchain/rust:1.96.1"
arch = "amd64"

dependencies = [
    "gcc-libs >= 15.3.0",
    "glibc >= 2.44"
]

provides = [
    "rust",
    "rustc",
    "cargo"
]

[upstream]
url = "https://static.rust-lang.org/dist/"
version_regex = 'rust-([0-9][0-9.]*)-x86_64-unknown-linux-gnu'

[build]
# This is an upstream binary distribution, not a Sage compilation. Keep it a
# script recipe so no compiler/linker provenance is invented for the payload.
system = "script"
payload = "allowlist"
install_files = [
    "opt/channels/rust/1.96.1/**",
]

[[build.steps]]
name = "install-prebuilt-toolchain"
phase = "install"
cwd = "source"
command = '''set -e
./install.sh --prefix=/opt/channels/rust/1.96.1 --destdir="$DESTDIR" --disable-ldconfig
test -x "$DESTDIR/opt/channels/rust/1.96.1/bin/cargo"
test -x "$DESTDIR/opt/channels/rust/1.96.1/bin/rustc"
'''

[source]
url = "https://static.rust-lang.org/dist/rust-1.96.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "d29ccb1559a177c4e72291f6e5f629de7fe8885e7521ca47802627544b121e95"
