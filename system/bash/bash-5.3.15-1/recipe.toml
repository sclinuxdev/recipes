schema_version = 1

[package]
name = "bash"
version = "5.3.15"
release = "1"
description = "GNU Bourne Again SHell"
license = "GPL-3.0-or-later"
channel = "system"

dependencies = [
    "readline >= 8.3",
]

build_dependencies = [
    "readline-dev >= 8.3",
    "ncurses-dev >= 6.6"
]

provides = [
    "bash",
    "sh"
]

prepare = [
    # One official upstream patch level per file, applied fatally: a skipped
    # level would silently produce a misnumbered bash. Previously these were
    # concatenated into a hand-placed distfile.
    "for p in distfiles/bash53-*; do patch -Np0 < \"$p\" || exit 1; done"
]

build = [
    "./configure --prefix=/usr --without-bash-malloc --with-installed-readline",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "ln -sf bash $DESTDIR/usr/bin/sh"
]

# Sixteen sources, each downloaded and sha256-verified by sage ([[source]]
# multi-source support; the first entry is the primary archive): the bash-5.3
# tarball plus the fifteen official patch levels that make it 5.3.15. The
# extra patches land at src/distfiles/ for the prepare loop above.
#
# Layout note: every key below the [[source]] blocks belongs to its nearest
# such block, so all root-scoped declarations come first and the sources
# close the file.
