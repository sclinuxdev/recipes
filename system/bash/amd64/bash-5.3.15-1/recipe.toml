[build]
inherit = ["autotools"]
dependencies = ["ncurses-dev >= 6.6-1"]

[build.args]
configure_args = "--without-bash-malloc --disable-nls --enable-net-redirections"
source_patch_strip = "0"

[build.payload]
default = "remaining"

[[alternatives]]
link = "usr/bin/sh"
target = "bash"
priority = 50

[features.readline]
default = true
dependencies = ["readline-libs >= 8.3-1"]
build_dependencies = ["readline-dev >= 8.3-1"]

[features.readline.args]
configure_args = "--enable-readline --enable-bang-history --enable-history --with-installed-readline=."
