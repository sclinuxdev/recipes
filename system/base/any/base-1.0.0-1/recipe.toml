arch = "any"

dependencies = [
    "base-files >= 1.0.0-1",
    "os-release >= 1.0.0-1",
    "iana-etc >= 20260811-1",
    "tzdata >= 2026c-1",
    "virtual/libc",
    "virtual/init",
    "bash >= 5.3.15-1",
    "virtual/coreutils",
    "util-linux >= 2.42.2-1",
    "procps-ng >= 4.0.7-1",
    "shadow >= 4.20.2-1",
    "grep >= 3.12-1",
    "sed >= 4.10-1",
    "gawk >= 5.4.1-1",
    "diffutils >= 3.12-1",
    "findutils >= 4.11.0-1",
    "file >= 5.48-1",
    "less >= 704-1",
    "tar >= 1.35-1",
    "gzip >= 1.14-1",
    "xz >= 5.8.3-1",
    "zstd >= 1.5.7-1",
    "kmod >= 34.2-1",
    "dbus >= 1.16.2-1",
    "sage >= 0.4.0-1",
