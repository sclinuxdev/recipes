schema_version = 1

[package]
name = "util-linux"
version = "2.42.2"
release = 1
epoch = 0
description = "Essential miscellaneous Linux system utilities (mount, fdisk, agetty, dmesg, etc.)"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "util-linux-libs >= 2.42.2-1",
    "ncurses-libs >= 6.6-1",
    "readline-libs >= 8.3-1",
    "zlib-libs >= 1.3.2-1",
    "libcap-libs >= 2.78-1",
]

provides = ["util-linux", "virtual/getty"]

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
sha256 = "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"

[build]
inherit = ["meson"]

[build.args]
meson_args = "-Dbuild-libblkid=enabled -Dbuild-libuuid=enabled -Dbuild-libmount=enabled -Dbuild-libsmartcols=enabled -Dbuild-libfdisk=enabled -Dbuild-chfn-chsh=disabled -Dbuild-login=disabled -Dbuild-su=disabled -Dbuild-pylibmount=disabled"

[build.payload]
default = "remaining"

[[subpackages]]
name = "util-linux-libs"
description = "util-linux runtime shared libraries (libblkid, libuuid, libmount, libsmartcols, libfdisk)"
license = "LGPL-2.1-or-later AND BSD-3-Clause"
dependencies = [
    "virtual/libc",
]
provides = [
    "util-linux-libs",
    "so:libblkid.so.1",
    "so:libuuid.so.1",
    "so:libmount.so.1",
    "so:libsmartcols.so.1",
    "so:libfdisk.so.1",
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*",
]

[[subpackages]]
name = "util-linux-dev"
description = "util-linux development headers and pkgconfig metadata"
license = "LGPL-2.1-or-later AND BSD-3-Clause"
dependencies = [
    "util-linux-libs >= 2.42.2-1",
]
provides = ["util-linux-dev"]

[subpackages.payload]
files = [
    "usr/include/blkid/**",
    "usr/include/uuid/**",
    "usr/include/libmount/**",
    "usr/include/libsmartcols/**",
    "usr/include/libfdisk/**",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
]
