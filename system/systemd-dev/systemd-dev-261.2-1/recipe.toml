schema_version = 1

[package]
name = "systemd-dev"
version = "261.2"
release = "1"
description = "systemd/udev headers, pkg-config and linker symlink"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"

dependencies = [
    "systemd-libs >= 261.2"
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "python >= 3.14.7",
    "jinja2 >= 3.1.6",
    "markupsafe >= 3.0.3",
    "gperf >= 3.3",
    "gettext >= 1.0",
    "kmod-dev >= 34.2",
    "util-linux-dev >= 2.42.2",
    "openssl-dev >= 4.0.1",
    "pkgconf >= 3.0.5",
    "libcap-dev >= 2.78",
    "pcre2-dev >= 10.47",
    "libseccomp-dev >= 2.6.0",
    "acl-dev >= 2.4.0",
    "libxcrypt-dev >= 4.5.2"
]

provides = [
    "systemd-dev"
]

prepare = [
    "sed -e 's/GROUP=\"render\"/GROUP=\"video\"/' -e 's/GROUP=\"sgx\", //' -i rules.d/50-udev-default.rules.in"
]

build = [
    "mkdir -p build",
    "cd build && meson setup .. --prefix=/usr --buildtype=release -D default-dnssec=no -D firstboot=false -D install-tests=false -D ldconfig=false -D sysusers=false -D rpmmacrosdir=no -D homed=disabled -D man=disabled -D mode=release -D pamconfdir=no -D dev-kvm-mode=0660 -D nobody-group=nogroup -D sysupdate=disabled -D ukify=disabled -D docdir=/usr/share/doc/systemd-261.2",
    "cd build && ninja"
]

install = [
    "cd build && DESTDIR=$DESTDIR ninja install",
    "rm -rf $DESTDIR/usr/lib/systemd $DESTDIR/usr/lib/udev $DESTDIR/usr/lib/security $DESTDIR/usr/lib/sysctl.d $DESTDIR/usr/lib/tmpfiles.d $DESTDIR/usr/lib/modules-load.d $DESTDIR/usr/lib/sysusers.d $DESTDIR/usr/lib/kernel $DESTDIR/usr/lib/environment.d $DESTDIR/usr/lib/binfmt.d $DESTDIR/usr/lib/credstore $DESTDIR/usr/lib/hwdb.d $DESTDIR/etc 2>/dev/null || true",
    "rm -f $DESTDIR/usr/lib/libnss_*.so*",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
