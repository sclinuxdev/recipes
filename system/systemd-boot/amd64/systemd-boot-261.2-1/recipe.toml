schema_version = 2

[package]
name = "systemd-boot"
version = "261.2"
release = "1"
arch = "amd64"
description = "systemd-boot UEFI boot manager and unified kernel stub (EFI payloads only)"
license = "LGPL-2.1-or-later"
channel = "system"
provides = [
    "systemd-boot"
]
[upstream]
url = "https://github.com/systemd/systemd/tags"
version_regex = 'v?([0-9][0-9.]*)'

[source]
url = "https://github.com/systemd/systemd/archive/refs/tags/v261.2.tar.gz"
sha256 = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"

# core system software: pinned to gcc (v2 package default)
[build]
system = "meson"
configure_options = [
    "-Ddefault-dnssec=no",
    "-Dfirstboot=false",
    "-Dinstall-tests=false",
    "-Dldconfig=false",
    "-Dsysusers=false",
    "-Drpmmacrosdir=no",
    "-Dhomed=disabled",
    "-Dman=disabled",
    "-Dmode=release",
    "-Dpamconfdir=no",
    "-Ddev-kvm-mode=0660",
    "-Dnobody-group=nogroup",
    "-Dsysupdate=disabled",
    "-Dukify=disabled",
    "-Defi=true",
    "-Dbootloader=enabled",
    "-Dsbat-distro=sclinux",
    "-Dsbat-distro-summary=ShenChen Linux",
    "-Dsbat-distro-pkgname=systemd-boot",
    "-Dsbat-distro-version=261.2",
    "-Dsbat-distro-url=https://github.com/sclinuxdev/recipes.amd64"
]

[build.toolchain.compiler]
family = "gcc"
package = "gcc"
minimum_version = "15.1"

[build.toolchain.linker]
family = "ld"
package = "binutils"
minimum_version = "2.40"
