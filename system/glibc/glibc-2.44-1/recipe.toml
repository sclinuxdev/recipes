schema_version = 1

[package]
name = "glibc"
version = "2.44"
release = "1"
description = "GNU C Library runtime, loader and locale data"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"

dependencies = []

build_dependencies = []

provides = [
    "glibc",
    "virtual/libc",
    "so:libc.so.6",
    "so:ld-linux-x86-64.so.2"
]

# glibc and systemd are core system software: they are pinned to gcc and
# never fall back to the default clang toolchain (a failed pin fails the build).
[build]
cc = "gcc"
cxx = "g++"
prepare = [
    "mkdir -p build"
]

build = [
    "cd build && ../configure --prefix=/usr --disable-profile --enable-kernel=4.19 --enable-stack-protector=strong --disable-nscd libc_cv_slibdir=/usr/lib",
    "cd build && make"
]

install = [
    "cd build && make install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/lib/locale",
    "sed '/RTLDLIST/s@/usr@@g' -i $DESTDIR/usr/bin/ldd 2>/dev/null || true",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib/*.a $DESTDIR/usr/lib/pkgconfig 2>/dev/null || true",
    "rm -f $DESTDIR/usr/lib/libc.so $DESTDIR/usr/lib/libm.so $DESTDIR/usr/lib/libpthread.so $DESTDIR/usr/lib/librt.so $DESTDIR/usr/lib/libdl.so $DESTDIR/usr/lib/libutil.so $DESTDIR/usr/lib/libresolv.so"
]

