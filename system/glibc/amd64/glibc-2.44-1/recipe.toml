schema_version = 1

[package]
name = "glibc"
version = "2.44"
release = 1
epoch = 0
description = "GNU C Library core shared objects, dynamic linker, and runtime tools"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = []

provides = [
    "virtual/libc",
    "glibc",
    "so:libc.so.6",
    "so:libm.so.6",
    "so:ld-linux-x86-64.so.2",
    "so:libpthread.so.0",
    "so:libdl.so.2",
    "so:librt.so.1",
]

[source]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"

[build]
inherit = ["autotools"]
dependencies = [
    "gcc16/gcc:16",
    "system/linux-api-headers >= 7.1.11-1",
]
# glibc is a GCC-only compiler boundary; use the system GNU linker as well.
# The global default remains clang + mold for other packages.
compiler = "gcc"
linker = "ld"
cflags = "-march=x86-64-v3 -O2 -pipe"
cxxflags = "-march=x86-64-v3 -O2 -pipe"
ldflags = "-Wl,--as-needed"

[build.args]
configure_args = "--enable-kernel=5.4 --enable-stack-protector=strong --enable-bind-now --disable-werror"

[build.payload]
default = "remaining"

[[subpackages]]
name = "glibc-dev"
description = "GNU C Library development headers, static objects, and linker scripts"
license = "LGPL-2.1-or-later"
dependencies = [
    "glibc >= 2.44-1",
    "linux-api-headers >= 7.1.11-1",
]
provides = ["virtual/libc-dev", "glibc-dev"]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.o",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib64/*.o",
    "usr/lib64/*.a",
    "usr/lib64/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib64/pkgconfig/**",
]

[[subpackages]]
name = "glibc-locales"
description = "GNU C Library compiled internationalization and locale data"
license = "LGPL-2.1-or-later"
dependencies = [
    "glibc >= 2.44-1",
]
provides = ["glibc-locales", "virtual/locales"]

[subpackages.payload]
files = [
    "usr/lib/locale/**",
    "usr/share/locale/**",
    "usr/share/i18n/**",
]

[features.crypt]
default = false
dependencies = ["libxcrypt-libs >= 4.5.2-1"]
build_dependencies = ["libxcrypt-dev >= 4.5.2-1"]

[features.nscd]
default = false

[features.nscd.args]
configure_args = "--enable-nscd"
