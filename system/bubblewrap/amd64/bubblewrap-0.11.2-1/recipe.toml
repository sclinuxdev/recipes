schema_version = 1

[package]
name = "bubblewrap"
version = "0.11.2"
release = 1
epoch = 0
description = "Unprivileged sandboxing tool based on user namespaces (bwrap)"
license = "LGPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libcap-libs >= 2.78-1",
    "libseccomp-libs >= 2.6.0-1",
]

provides = ["bubblewrap", "bwrap"]

[source]
url = "https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz"
sha256 = "69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6"

[build]
inherit = ["meson"]

[build.args]
meson_args = "-Dselinux=disabled -Dman=disabled"

[build.payload]
default = "remaining"
