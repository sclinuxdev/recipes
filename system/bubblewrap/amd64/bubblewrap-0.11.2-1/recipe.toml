schema_version = 2

[package]
name = "bubblewrap"
version = "0.11.2"
release = "1"
description = "Unprivileged Linux sandboxing tool"
license = "LGPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "libcap-libs >= 2.78",
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "pkgconf >= 3.0.5",
    "python >= 3.14.7",
    "libcap-dev >= 2.78",
]

provides = [
    "bubblewrap",
]

[upstream]
url = "https://github.com/containers/bubblewrap/tags"
version_regex = 'v?(0\.11\.\d+)'

[source]
url = "https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz"
sha256 = "69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6"

[build]
system = "meson"
configure_options = [
    "-Dbash_completion=disabled",
    "-Dzsh_completion=disabled",
    "-Dman=disabled",
    "-Dselinux=disabled",
    "-Dsupport_setuid=false",
    "-Dtests=false",
]
install_files = [
    "usr/bin/bwrap",
]
