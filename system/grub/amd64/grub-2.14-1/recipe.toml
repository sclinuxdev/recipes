schema_version = 2

[package]
name = "grub"
version = "2.14"
release = "1"
arch = "amd64"
description = "GNU GRUB 2 bootloader (x86_64 UEFI)"
license = "GPL-3.0-or-later"
channel = "system"
dependencies = [
    "xz-libs >= 5.8.3"
]
build_dependencies = [
    "bison >= 3.8.2",
    "flex >= 2.6.4",
    "python >= 3.14.7",
    "gettext >= 1.0",
    "xz-dev >= 5.8.3"
]
provides = [
    "grub",
    "virtual/bootloader"
]

[upstream]
url = "https://ftp.gnu.org/gnu/grub/"
version_regex = 'grub-([0-9][0-9.]*)\.tar'

[source]
url = "https://ftp.gnu.org/gnu/grub/grub-2.14.tar.xz"
sha256 = "bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--bindir=/usr/bin",
    "--sbindir=/usr/bin",
    "--sysconfdir=/etc",
    "--disable-efiemu",
    "--disable-werror",
    "--with-platform=efi",
    "--target=x86_64"
]

[[capability_hooks]]
capability = "virtual/bootloader"
exec = "/usr/bin/grub-mkconfig"
args = ["-o", "/boot/grub/grub.cfg"]
