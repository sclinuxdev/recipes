# lvm2 -- LVM 用户态工具（lvm、vgchange、lvcreate ...）。
#
# 这是 system/device-mapper 那条注释里说的「另一半」：
#
#     Only the device-mapper half of LVM2 is built here. The LVM tools proper
#     (lvm, vgcreate, ...) are a separate concern and are not packaged yet.
#
# 两个包同源同版本。device-mapper 出 libdevmapper.so.1.02 与 dmsetup，本包出
# LVM 工具，装完后把前者的负载删掉再打包，两包之间没有文件重叠 ——
# 否则 Sage 的跨包文件归属检查会直接拦下。
#
# 从 sclinux 的 Stage1 迁入。Stage1 那份把两半打在一个包里并 provide
# device-mapper，在本树里会与既有的 device-mapper 冲突，所以这里不再 provide。
#
# 那一串 --with-cache-* / --with-thin-* 留空是有意的：thin-provisioning-tools
# 没有打包，留空可以让 LVM 不去推断一组并不存在的 /usr/bin/cache_* 路径。
# 根文件系统跑在 XFS on LVM thin 上，这些路径必须是空而不是错。

schema_version = 1

[package]
name = "lvm2"
version = "2.03.42"
release = "1"
arch = "aarch64"
description = "Logical Volume Manager userspace tools"
license = "GPL-2.0-only AND LGPL-2.1-only"
channel = "system"

[source]
url = "https://sourceware.org/ftp/lvm2/LVM2.2.03.42.tgz"
sha256 = "352703ef5b72ebb22d4f250284a29b89fe64d4049c6bf64c693f9af486c8081e"

dependencies = [
    "bash >= 5.3.15",
    "device-mapper >= 2.03.42",
    "libaio >= 0.3.113",
    "readline >= 8.3",
    "systemd >= 261.2",
    "util-linux-libs >= 2.42.2"
]

build_dependencies = [
    "libaio-dev >= 0.3.113",
    "readline-dev >= 8.3",
    "util-linux-dev >= 2.42.2",
    "glibc-dev >= 2.44",
    "pkgconf >= 3.0.5"
]

provides = [
    "lvm2"
]

prepare = []

build = [
    "CONFIG_SHELL=/bin/bash ./configure --prefix=/usr --sbindir=/usr/bin --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var --enable-cmdlib --enable-dmeventd --enable-lvmpolld --enable-pkgconfig --enable-readline --enable-udev_rules --enable-udev_sync --enable-write_install --with-cache=internal --with-cache-check= --with-cache-dump= --with-cache-repair= --with-cache-restore= --with-default-dm-run-dir=/run --with-default-locking-dir=/run/lock/lvm --with-default-pid-dir=/run --with-default-run-dir=/run/lvm --with-libexecdir=/usr/lib/lvm2 --with-systemdsystemunitdir=/usr/lib/systemd/system --with-udev-prefix=/usr --with-udevdir=/usr/lib/udev/rules.d --with-thin=internal --with-thin-check= --with-thin-dump= --with-thin-repair= --with-thin-restore=",
    "make"
]

install = [
    "make DESTDIR=$DESTDIR install",
    "mkdir -p $DESTDIR/etc/lvm/archive $DESTDIR/etc/lvm/backup",
    "rm -f $DESTDIR/usr/bin/dmsetup $DESTDIR/usr/bin/dmstats $DESTDIR/usr/bin/dmeventd $DESTDIR/usr/bin/dmvdostats $DESTDIR/usr/bin/blkdeactivate",
    "rm -f $DESTDIR/usr/include/libdevmapper.h $DESTDIR/usr/include/libdevmapper-event.h",
    "rm -f $DESTDIR/usr/lib/pkgconfig/devmapper.pc $DESTDIR/usr/lib/pkgconfig/devmapper-event.pc",
    "find $DESTDIR/usr/lib -name 'libdevmapper.so*' -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib -name 'libdevmapper-event.so*' -delete 2>/dev/null || true",
    "rm -f $DESTDIR/usr/share/man/man8/dmsetup.8 $DESTDIR/usr/share/man/man8/dmstats.8 $DESTDIR/usr/share/man/man8/dmeventd.8 $DESTDIR/usr/share/man/man8/dmvdostats.8 $DESTDIR/usr/share/man/man8/blkdeactivate.8",
    "find $DESTDIR/usr/lib -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "[ -x $DESTDIR/usr/bin/lvm ] || { echo 'ERROR: lvm missing from payload' >&2; exit 1; }",
    "! find $DESTDIR/usr \\( -name 'libdevmapper.so*' -o -name 'libdevmapper-event.so*' -o -name 'dmsetup' -o -name 'dmeventd' \\) 2>/dev/null | grep -q . || { echo 'ERROR: payload overlaps device-mapper' >&2; exit 1; }"
]
