schema_version = 1

[package]
name = "util-linux-libs"
version = "2.42.2"
release = "1"
description = "libuuid/libblkid/libmount/libsmartcols runtime libraries"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
sha256 = "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"

dependencies = [
]

provides = [
    "util-linux-libs",
    "so:libuuid.so.1",
    "so:libblkid.so.1",
    "so:libmount.so.1",
    "so:libsmartcols.so.1"
]

prepare = []

build = [
    "./configure --prefix=/usr --libdir=/usr/lib --disable-static --without-python --without-systemd --disable-all-programs --enable-libmount --enable-libuuid --enable-libblkid --enable-libsmartcols",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    # Top-level bin/sbin/lib are merge points: this split's configure does
    # not pin the dirs, so the raw make tree drops entities there too.
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/bin $DESTDIR/sbin $DESTDIR/lib $DESTDIR/lib64 $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib/cmake 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 \\( -type l -o -type f \\) -name '*.so' ! -name '*.so.*' -delete 2>/dev/null || true"
]
