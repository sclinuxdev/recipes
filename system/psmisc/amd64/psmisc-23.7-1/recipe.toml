schema_version = 1

[package]
name = "psmisc"
version = "23.7"
release = 1
epoch = 0
description = "Small utilities that use the /proc filesystem (fuser, killall, pstree, peekfd)"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "ncurses-libs >= 6.6-1",
]

provides = ["psmisc"]

[source]
url = "https://downloads.sourceforge.net/project/psmisc/psmisc/psmisc-23.7.tar.xz"
sha256 = "58c55d9c1402474065adae669511c191de374b0871eec781239ab400b907c327"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--disable-nls"

[build.payload]
default = "remaining"
