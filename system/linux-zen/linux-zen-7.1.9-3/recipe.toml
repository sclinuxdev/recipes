# Linux ZEN kernel with CJK VT console support.
#
# Supersedes Stage2/recipes/linux-zen (release 2). Depends on
# virtual/initramfs-generator: installing a kernel pulls in a builder for the
# initramfs it cannot boot without, and sage's capability trigger regenerates
# the image once the kernel lands. WHICH generator stays a system choice, so
# dracut can satisfy this without touching the recipe.
#
# Four sources, each downloaded and sha256-verified by sage ([[source]]
# multi-source support; the first entry is the primary archive):
#
#   1. The vanilla 7.1.9 tarball.
#   2. The ZEN patchset for v7.1.9-zen1.
#   3. bigshans' cjktty UTF-8 VT console patch, 7.2 series.
#   4. Arch Linux's pinned default config for this exact kernel version
#      (config.x86_64), fetched at build time from the packaging repo commit.
#
# Why the 7.2 cjktty patch on a 7.1.9 kernel: v7.x/cjktty-7.1.patch was
# generated before upstream added the charcount clamp to bit_cursor, and its
# final hunk no longer matches 7.1.9 (one FAILED hunk). Every hunk of
# cjktty-7.2.patch applies to this tree cleanly, and all touched files build.
# The FONT_CJK_* options default to y, so olddefconfig enables them.
#
# Both patches are applied with fatal failure semantics: a silently skipped
# patch yields a kernel that builds fine but lacks the feature. The zen patch
# is decompressed to a file first because a plain `zstd | patch` pipeline
# reports only patch's exit status -- an empty stream from a failed zstd
# would "succeed" while applying nothing.
#
# Layout note: every key below the [[source]] blocks belongs to its nearest
# such block, so all root-scoped declarations come first and the two extra
# sources close the file.

schema_version = 1

[package]
name = "linux-zen"
version = "7.1.9"
release = "3"
description = "Linux ZEN kernel with performance optimizations and CJK console support"
license = "GPL-2.0-only"
channel = "system"

# virtual/initramfs-generator, not "mkinitcpio": a kernel is unbootable
# without an initramfs, so the generator is a hard runtime dependency -- but
# WHICH generator is a system choice.
dependencies = [
    "kmod >= 34.2",
    "virtual/initramfs-generator",
]

build_dependencies = [
    "bc >= 7.0.3",
    "bison >= 3.8.2",
    "flex >= 2.6.4",
    "libelf-dev >= 0.196",
    "openssl-dev >= 4.0.1",
    "perl >= 5.44.0",
    "python >= 3.14.7",
    "tar >= 1.35",
    "xz >= 5.8.3",
    "zlib-dev >= 1.3.2",
    "zstd >= 1.5.7"
]

provides = [
    "linux-zen",
    "linux",
    "virtual/linux",
    "virtual/kernel"
]

# Patch steps stamp themselves (.stamp-*): `patch` exits non-zero even when
# it skips already-applied hunks, which would kill every --reuse-src resume
# on a patched tree. Stamped, fresh trees stay strict and resumed ones no-op.
prepare = [
    "[ -e .stamp-zen ] || { zstd -dc distfiles/linux-v7.1.9-zen1.patch.zst > zen-patch.diff && patch -p1 --batch < zen-patch.diff && touch .stamp-zen; }",
    "[ -e .stamp-cjktty ] || { patch -p1 --batch < distfiles/cjktty-7.2.patch && touch .stamp-cjktty; }",
    # The config block is stamped too: rewriting .config flips its mtime and
    # kbuild answers with a from-scratch rebuild, which is exactly what a
    # resume must not pay for. Fresh trees run it; resumed ones skip it.
    # LLVM=1 in olddefconfig as well: config-time tool identity is recorded
    # into .config (CONFIG_CC_IS_CLANG, CONFIG_LD_IS_LLD); configuring with
    # GNU ld and building with lld would leave those lies behind.
    "[ -e .stamp-config ] || { cp distfiles/config.x86_64 .config && echo '-1' > localversion.10-pkgrel && echo '-zen' > localversion.20-pkgname && ./scripts/config --disable DEBUG_INFO --enable DEBUG_INFO_NONE --disable DEBUG_INFO_DWARF5 --disable DEBUG_INFO_DWARF4 --disable DEBUG_INFO_BTF --disable DEBUG_INFO_BTF_MODULES --disable RUST && make LLVM=1 olddefconfig && touch .stamp-config; }"
]

# LLVM=1 drives the whole toolchain from the llvm:22 channel -- clang for
# the kernel and host tools, ld.lld linking, llvm-ar/nm/objcopy/strip, and
# the integrated assembler. The kernel ignores the global CFLAGS by design
# (KBUILD_CFLAGS governs its own optimization), so nothing leaks in there.
#
# HOSTCFLAGS/HOSTLDFLAGS feed objtool: it links -lopcodes/-lbfd from the
# binutils that rides along with the active gcc slot, and its DISAS code
# paths #include <bfd.h> from that prefix's include/. `ld` on the profile
# PATH is a symlink-farm entry, so readlink -f must pierce it before taking
# dirname; and the whole thing is a shell-prefixed assignment because make's
# immediate command-line expansion would eat $(dirname ...) as an unknown
# make function. CPATH covers the one probe that invokes a bare $(HOSTCC)
# with no flags at all (the dis-asm.h styled-API check): without it the
# kernel's old-binutils compat shim collides with real binutils >= 2.39
# headers. Kernel proper compiles with -nostdinc, so CPATH never leaks into
# the kernel build itself; host tools just gain one extra search dir.
build = [
    "P=\"$(dirname $(readlink -f \"$(command -v ld)\"))\"; export P; HOSTCFLAGS=\"-I$P/../include\" HOSTLDFLAGS=\"-L$P/../lib\" CPATH=\"$P/../include\" make LLVM=1 -k KCFLAGS=\"-Wno-error\" all || HOSTCFLAGS=\"-I$P/../include\" HOSTLDFLAGS=\"-L$P/../lib\" CPATH=\"$P/../include\" make LLVM=1 KCFLAGS=\"-Wno-error\" all"
]

install = [
    "set -e; KVER=$(make -s kernelrelease); echo \"Installing kernel release: ${KVER}\"; mkdir -p $DESTDIR/boot $DESTDIR/usr/lib/modules; make INSTALL_MOD_PATH=$DESTDIR modules_install; if [ -d $DESTDIR/lib/modules ] && [ ! -L $DESTDIR/lib ]; then cp -a $DESTDIR/lib/modules $DESTDIR/usr/lib/ && rm -rf $DESTDIR/lib; fi; rm -f $DESTDIR/usr/lib/modules/$KVER/build $DESTDIR/usr/lib/modules/$KVER/source; install -Dm644 arch/x86/boot/bzImage $DESTDIR/boot/vmlinuz-${KVER}; install -Dm644 System.map $DESTDIR/boot/System.map-${KVER}; install -Dm644 .config $DESTDIR/boot/config-${KVER}; install -Dm644 arch/x86/boot/bzImage $DESTDIR/usr/lib/modules/$KVER/vmlinuz"
]

# The primary archive unpacks to src/; the extra downloads land verbatim at
# src/distfiles/, which the prepare commands above consume relative to that
# work directory.
[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.9.tar.xz"
sha256 = "3271a4ae3897b38352980f2b0975bae61bca81c644d186221c5ae928bcc072b0"

[[source]]
url = "https://github.com/zen-kernel/zen-kernel/releases/download/v7.1.9-zen1/linux-v7.1.9-zen1.patch.zst"
sha256 = "bdd01b28231ae1e2b5804c28d0917af44e5f72ee35ff8bdd1406b8c40126d009"

[[source]]
