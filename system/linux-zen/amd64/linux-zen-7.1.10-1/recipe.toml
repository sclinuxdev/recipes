# Linux ZEN kernel with CJK VT console support and unified module build headers.
#
# Builds the kernel, modules, and the kernel headers build scaffolding for DKMS
# in a single pass, outputting both `linux-zen` and `linux-zen-headers`.
#
# Four sources, each downloaded and sha256-verified by sage:
#   1. The vanilla 7.1.10 tarball.
#   2. The ZEN patchset for v7.1.10-zen1.
#   3. bigshans' cjktty UTF-8 VT console patch, 7.2 series.
#   4. Arch Linux's pinned default config (config.x86_64).

schema_version = 2

[package]
name = "linux-zen"
version = "7.1.10"
release = "1"
arch = "amd64"
description = "Linux ZEN kernel with performance optimizations and CJK console support"
license = "GPL-2.0-only"
channel = "system"

dependencies = [
    "kmod >= 34.2",
    "virtual/initramfs-generator",
]

build_dependencies = [
    "bc >= 7.0.3",
    "bison >= 3.8.2",
    "flex >= 2.6.4",
    "libelf-dev >= 0.196",
    "openssl-dev >= 4.0.1",
    "patch >= 2.8",
    "perl >= 5.44.0",
    "python >= 3.14.7",
    "tar >= 1.35",
    "xz >= 5.8.3",
    "zlib-dev >= 1.3.2",
    "zstd >= 1.5.7"
]

provides = [
    "linux-zen",
    "linux",
    "virtual/linux",
    "virtual/kernel"
]

[upstream]
url = "https://github.com/zen-kernel/zen-kernel/releases"
version_regex = 'v([0-9]+\.[0-9]+\.[0-9]+)-zen'

[build]
system = "make"
payload = "outputs"
kernel = true
build_targets = ["all"]
install_targets = ["modules_install"]

[build.variables]
INSTALL_MOD_PATH = "{destdir}"

[[build.steps]]
name = "apply-kernel-patches"
phase = "prepare"
cwd = "source"
command = '''set -e
[ -e .stamp-zen ] || { zstd -dc distfiles/linux-v7.1.10-zen1.patch.zst > zen-patch.diff && patch -p1 --batch < zen-patch.diff && touch .stamp-zen; }
[ -e .stamp-cjktty ] || { patch -p1 --batch < distfiles/cjktty-7.2.patch && touch .stamp-cjktty; }
'''

[[build.steps]]
name = "configure-kernel"
phase = "prepare"
cwd = "source"
command = '''set -e
CONFIG_STAMP=$(sha256sum "$RECIPE_DIR/recipe.toml" | cut -d' ' -f1)
[ "$(cat .stamp-config 2>/dev/null)" = "$CONFIG_STAMP" ] || {
    cp distfiles/config.x86_64 .config
    ./scripts/config --set-str DEFAULT_HOSTNAME sclinux
    ./scripts/config --disable LTO --disable LTO_CLANG --disable LTO_CLANG_THIN --enable LTO_NONE
    echo '-1' > localversion.10-pkgrel
    echo '-zen' > localversion.20-pkgname
    ./scripts/config --disable DEBUG_INFO --enable DEBUG_INFO_NONE --disable DEBUG_INFO_DWARF5 --disable DEBUG_INFO_DWARF4 --disable DEBUG_INFO_BTF --disable DEBUG_INFO_BTF_MODULES --disable RUST
    make olddefconfig
    printf '%s\n' "$CONFIG_STAMP" > .stamp-config
}
'''

[[build.steps]]
name = "install-kernel-and-headers"
phase = "install"
cwd = "source"
command = '''set -e
KVER=$(make -s kernelrelease)
echo "Installing kernel release: ${KVER}"
mkdir -p "$DESTDIR/boot" "$DESTDIR/usr/lib/modules/$KVER"

if [ -d "$DESTDIR/lib/modules" ] && [ ! -L "$DESTDIR/lib" ]; then
    cp -a "$DESTDIR/lib/modules" "$DESTDIR/usr/lib/"
    rm -rf "$DESTDIR/lib"
fi

# 1. Install kernel binary and boot configurations
install -Dm644 arch/x86/boot/bzImage "$DESTDIR/boot/vmlinuz-${KVER}"
install -Dm644 System.map "$DESTDIR/boot/System.map-${KVER}"
install -Dm644 .config "$DESTDIR/boot/config-${KVER}"
install -Dm644 arch/x86/boot/bzImage "$DESTDIR/usr/lib/modules/$KVER/vmlinuz"

install -d "$DESTDIR/etc/mkinitcpio.d"
PRESET="$DESTDIR/etc/mkinitcpio.d/linux-zen-$KVER.preset"
printf '%s\n' '# mkinitcpio preset for linux-zen' 'ALL_config="/etc/mkinitcpio.conf"' "ALL_kver=/boot/vmlinuz-$KVER" "PRESETS=('default' 'fallback')" "default_image=/boot/initramfs-$KVER.img" "fallback_image=/boot/initramfs-$KVER-fallback.img" 'fallback_options="-S autodetect"' > "$PRESET"
grep -q ALL_kver "$PRESET"

# 2. Build and stage DKMS / kernel module build tree at /usr/lib/modules/$KVER/build
BUILD_DIR="$DESTDIR/usr/lib/modules/$KVER/build"
mkdir -p "$BUILD_DIR"

install -Dm644 Makefile "$BUILD_DIR/Makefile"
install -Dm644 .config "$BUILD_DIR/.config"
install -Dm644 System.map "$BUILD_DIR/System.map"
[ -e Module.symvers ] && install -Dm644 Module.symvers "$BUILD_DIR/Module.symvers"

mkdir -p "$BUILD_DIR/arch/x86"
cp -a arch/x86/include "$BUILD_DIR/arch/x86/"
install -Dm644 arch/x86/Makefile "$BUILD_DIR/arch/x86/Makefile"
[ -d arch/x86/entry ] && cp -a arch/x86/entry "$BUILD_DIR/arch/x86/"

cp -a include "$BUILD_DIR/"
cp -a scripts "$BUILD_DIR/"
[ -d tools/objtool ] && { mkdir -p "$BUILD_DIR/tools/objtool"; [ -f tools/objtool/objtool ] && install -Dm755 tools/objtool/objtool "$BUILD_DIR/tools/objtool/objtool"; }
[ -f Kconfig ] && install -Dm644 Kconfig "$BUILD_DIR/Kconfig"
[ -f Kbuild ] && install -Dm644 Kbuild "$BUILD_DIR/Kbuild"
'''

[[build.outputs]]
name = "linux-zen"
description = "Linux ZEN kernel with performance optimizations and CJK console support"
license = "GPL-2.0-only"
dependencies = [
    "kmod >= 34.2",
    "virtual/initramfs-generator",
]
provides = [
    "linux-zen",
    "linux",
    "virtual/linux",
    "virtual/kernel"
]
install_files = [
    "boot/**",
    "etc/**",
    "usr/lib/modules/*/vmlinuz",
    "usr/lib/modules/*/modules.*",
    "usr/lib/modules/*/kernel/**",
    "usr/lib/modules/*/misc/**",
]
optional_excludes = [
    "usr/lib/modules/*/misc/**",
]

[[build.outputs]]
name = "linux-zen-headers"
description = "Header files and build tools for Linux ZEN kernel modules (DKMS)"
license = "GPL-2.0-only"
dependencies = [
    "linux-zen = 7.1.10-1"
]
provides = [
    "linux-zen-headers"
]
install_files = [
    "usr/lib/modules/*/build/**"
]

[[source]]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.10.tar.xz"
sha256 = "67d2f4697a02f3bec98e744b1bdc307e920c24bb4e88b5ee97dc9a34e9aa9999"

[[source]]
url = "https://github.com/zen-kernel/zen-kernel/releases/download/v7.1.10-zen1/linux-v7.1.10-zen1.patch.zst"
sha256 = "37c44d77c8b3dd56665188157366257089458aaa89c0e99a31128c86d2c7297b"

[[source]]
url = "https://raw.githubusercontent.com/bigshans/cjktty-patches/master/v7.x/cjktty-7.2.patch"
sha256 = "252c69ec48019660dce565c45e287626793f84939cec249d62644a11ea9842a8"

[[source]]
url = "https://gitlab.archlinux.org/archlinux/packaging/packages/linux-zen/-/raw/39cac79101020d87973b9cbbd6405c009a28c197/config.x86_64?inline=false"
sha256 = "1cb633af33ae2bd1352ca806b35a0873d61dd2aaa349c05c7abf571a2edd10cd"
