schema_version = 1

[package]
name = "mkinitcpio"
version = "41.1"
release = 1
epoch = 0
description = "Modular initramfs image creation utility"
license = "GPL-2.0-only"
channel = "system"
arch = "any"

dependencies = [
    "bash >= 5.3.15-1",
    "coreutils >= 9.11-1",
    "util-linux >= 2.42.2-1",
    "kmod >= 34.2-1",
    "virtual/udev",
    "zstd >= 1.5.7-1",
    "findutils >= 4.11.0-1",
    "grep >= 3.12-1",
    "sed >= 4.10-1",
    "gawk >= 5.4.1-1",
]

provides = ["mkinitcpio", "virtual/initramfs-generator"]

[[alternatives]]
link = "usr/bin/initramfs-generator"
target = "mkinitcpio"
priority = 50

[source]
url = "https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v41.1/mkinitcpio-v41.1.tar.gz"
sha256 = "202ffca349ceb6b62513cc65a67d6fc0c0c15cacc72710ce5228b444cf1317e6"

[build]
inherit = ["meson"]
dependencies = ["virtual/udev"]

[build.args]
meson_args = "-Dsystemd=disabled -Dsystemd_hooks=false -Dkernel_install=false -Dalpm=false -Ddocs=false -Dpresets=false"

[build.payload]
default = "remaining"
