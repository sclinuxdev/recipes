schema_version = 2

[package]
name = "e2fsprogs-dev"
version = "1.47.4"
release = "1"
arch = "amd64"
description = "e2fsprogs library headers, pkg-config and linker symlink"
license = "LGPL-2.1-or-later"
channel = "system"

dependencies = [
    "e2fsprogs-libs >= 1.47.4",
]

build_dependencies = [
    "pkgconf >= 3.0.5"
]

provides = [
    "e2fsprogs-dev"
]

[upstream]
url = "https://mirrors.edge.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.4/"
version_regex = 'e2fsprogs-dev-v?([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.4/e2fsprogs-1.47.4.tar.xz"
sha256 = "fd5bf388cbdbe006a3d3b318d983b2948382440acc85a87f1e7d108653e8db0b"

[build]
system = "autotools"
configure_options = [
    "--sysconfdir=/etc",
    "--enable-elf-shlibs",
    "--disable-libblkid",
    "--disable-libuuid",
    "--disable-fsck"
]
install_targets = ["install-libs"]
