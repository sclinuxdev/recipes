schema_version = 1

[package]
name = "dbus"
version = "1.16.2"
release = "1"
description = "D-Bus message bus system"
license = "GPL-2.0-or-later OR AFL-2.1"
channel = "system"

[source]
url = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"

dependencies = [
    "dbus-libs >= 1.16.2",
    "expat-libs >= 2.8.3",
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "pkgconf >= 3.0.5",
    "expat-dev >= 2.8.3"
]

provides = [
    "dbus"
]

prepare = []

build = [
    "mkdir build",
    "cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback ..",
    "cd build && ninja"
]

install = [
    "cd build && DESTDIR=$DESTDIR ninja install",
    "ln -sfv /etc/machine-id $DESTDIR/var/lib/dbus",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib $DESTDIR/usr/lib64 2>/dev/null || true"
]
