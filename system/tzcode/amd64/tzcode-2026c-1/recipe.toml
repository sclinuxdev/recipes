# tzcode -- the IANA time zone compiler (zic) and dumper (zdump).
#
# IANA ships the code and the data as two separate tarballs, and since
# 2026c even building zic demands the data files: make's `version` target
# walks VERSION_DEPS, which lists africa, europe and friends. Both
# archives ride along as verified [[source]] entries; the primary unpacks
# flat into src/, the data one is untarred over it in prepare.

schema_version = 2

[package]
name = "tzcode"
version = "2026c"
release = "1"
arch = "amd64"
description = "IANA time zone database compiler and dumper"
license = "BSD-3-Clause"
channel = "system"

dependencies = [
]

build_dependencies = [
    "glibc-dev >= 2.44"
]

provides = [
    "tzcode"
]

[upstream]
url = "https://data.iana.org/time-zones/releases/"
version_regex = 'tzcode([0-9]{4}[a-z])\.tar'

# The code tarball has no top-level directory: it unpacks straight into
# src/. The data tarball is just as flat and lands on top of it.
[build]
system = "make"
payload = "allowlist"
build_targets = ["zic", "zdump"]
# tzcode has no package-oriented install target; rebuilding the two tools is
# idempotent and leaves the actual payload copy to the managed install step.
install_targets = ["zic", "zdump"]
install_files = [
    "usr/bin/zic",
    "usr/bin/zdump",
]

[[build.steps]]
name = "stage-timezone-data"
phase = "prepare"
cwd = "source"
command = "tar -xf distfiles/tzdata2026c.tar.gz"

[[build.steps]]
name = "install-tools"
phase = "install"
cwd = "source"
command = '''set -e
mkdir -p "$DESTDIR/usr/bin"
install -m755 zic "$DESTDIR/usr/bin/zic"
install -m755 zdump "$DESTDIR/usr/bin/zdump"
'''

[[source]]
url = "https://data.iana.org/time-zones/releases/tzcode2026c.tar.gz"
sha256 = "b1cffc3ace4c4c7cd0efba2f7add86ec3d0b79da48bcf03582671fd3c8feace8"

[[source]]
url = "https://data.iana.org/time-zones/releases/tzdata2026c.tar.gz"
sha256 = "e4a178a4477f3d0ea77cc31828ff72aa38feff8d61aa13e7e99e142e9d902be4"
