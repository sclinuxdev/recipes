# Loom -- Linux init and service manager, packaged from the released source.
#
# The [source] pins the exact commit the v0.1.0 tag points at. Rust comes from
# the versioned toolchain channel; the build discovers the installed Cargo
# path so a toolchain slot upgrade cannot strand a hard-coded version.

schema_version = 2

[package]
name = "loom"
version = "0.1.0"
release = "1"
description = "Linux init and service manager"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "glibc >= 2.44",
    "gcc-libs >= 15.3.0"
]

build_dependencies = [
    "rust-bin >= 1.96.1",
    "python >= 3.14.7",
    "patch >= 2.8"
]

provides = [
    "loom",
    "virtual/init"
]

[upstream]
url = "https://github.com/antinomie1/loom/tags"
version_regex = 'v([0-9]+\.[0-9]+\.[0-9]+)'

[build]
system = "cargo"
install_targets = ["--bin", "loom", "--bin", "loomctl"]
install_files = [
    "usr/lib/loom/loom",
    "usr/bin/loomctl",
    "usr/bin/init",
]
install_symlinks = [
    { path = "usr/bin/init", target = "../lib/loom/loom" },
]
allowed_linkers = ["mold", "lld", "ld"]

[[build.steps]]
name = "vendor-crates"
phase = "pre-build"
cwd = "source"
command = "python3 \"$RECIPE_DIR/vendor-crates.py\""

[[build.steps]]
name = "arrange-payload"
phase = "install"
cwd = "source"
command = '''set -e
mkdir -p "$DESTDIR/usr/lib/loom"
mv "$DESTDIR/usr/bin/loom" "$DESTDIR/usr/lib/loom/loom"
test -x "$DESTDIR/usr/lib/loom/loom"
test -x "$DESTDIR/usr/bin/loomctl"
'''

[build.toolchain.rust]
family = "rustc"
package = "rust-bin"
minimum_version = "1.96.1"

