schema_version = 1

[package]
name = "tzdata"
version = "2026c"
release = 1
epoch = 0
description = "Time Zone and Daylight Saving Time Data"
license = "LicenseRef-Public-Domain"
channel = "system"
arch = "any"

dependencies = []

provides = ["tzdata"]

[[sources]]
kind = "archive"
url = "https://data.iana.org/time-zones/releases/tzdata2026c.tar.gz"
sha256 = "e4a178a4477f3d0ea77cc31828ff72aa38feff8d61aa13e7e99e142e9d902be4"
strip_components = 0
destination = "."

[[sources]]
kind = "archive"
url = "https://data.iana.org/time-zones/releases/tzcode2026c.tar.gz"
sha256 = "b1cffc3ace4c4c7cd0efba2f7add86ec3d0b79da48bcf03582671fd3c8feace8"
strip_components = 0
destination = "."

[build]
inherit = ["custom"]
dependencies = ["system/make"]

[build.args]
install_cmd = """
ZONEINFO="${DESTDIR}/usr/share/zoneinfo"
mkdir -p "${ZONEINFO}"
make -C "${SRC_DIR}" zic CC="${CC}" CFLAGS="${CFLAGS}"
for zone in africa antarctica asia australasia europe northamerica southamerica etcetera backward factory; do
    if [ -f "${SRC_DIR}/${zone}" ]; then
        "${SRC_DIR}/zic" -d "${ZONEINFO}" "${SRC_DIR}/${zone}"
    fi
done
"""

[build.payload]
default = "remaining"
