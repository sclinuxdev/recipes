schema_version = 1
name = "autotools"
description = "Autoconf-compatible Make build class"

implicit_build_dependencies = [
    "system/make",
    "system/pkgconf",
]
allowed_compilers = ["clang", "gcc"]
allowed_linkers = ["lld", "mold", "ld"]

[defaults]
"args.configure_args" = ""
"args.make_args" = ""
"args.install_args" = ""
"args.test" = "0"
"args.configure_triples" = ""
"args.source_patch_strip" = "1"
"args.autoreconf" = "0"

[phases]
src_unpack = """
tab=$(printf '\t')
while IFS="$tab" read -r source kind strip destination; do
    input="${SRC_DIR}/.distfiles/$source"
    target="${SRC_DIR}/$destination"
    case "$kind" in
        archive)
            mkdir -p "$target"
            tar -xf "$input" --strip-components="$strip" -C "$target"
            ;;
        tree)
            mkdir -p "$target"
            cp -a "$input"/. "$target"/
            ;;
        file)
            mkdir -p "$(dirname "$target")"
            cp -a "$input" "$target"
            ;;
        *)
            echo "unsupported source manifest kind: $kind" >&2
            exit 1
            ;;
    esac
done < "${SRC_DIR}/.distfiles/manifest"
"""
src_prepare = """
if [ -d "${SRC_DIR}/.patches" ]; then
    for patch_file in "${SRC_DIR}"/.patches/*; do
        [ -f "$patch_file" ] || continue
        patch -d "${SRC_DIR}" -p1 < "$patch_file"
    done
fi
if [ -d "${SRC_DIR}/.source-patches" ]; then
    for patch_file in "${SRC_DIR}"/.source-patches/*; do
        [ -f "$patch_file" ] || continue
        patch -d "${SRC_DIR}" -p "${args.source_patch_strip}" < "$patch_file"
    done
fi
if [ "${args.autoreconf}" = 1 ]; then autoreconf -fi "${SRC_DIR}"; fi
"""
src_configure = """
mkdir -p "${BUILD_DIR}"
cd "${BUILD_DIR}"
if ! "${SRC_DIR}/configure" --prefix=/usr ${args.configure_triples} ${args.configure_args}; then
    if [ -f config.log ]; then
        cat config.log >&2
    fi
    exit 1
fi
"""
src_compile = "make -C \"${BUILD_DIR}\" -j \"${JOBS}\" ${args.make_args}"
src_test = "if [ \"${args.test}\" = 1 ]; then make -C \"${BUILD_DIR}\" check; fi"
src_install = """
make -C "${BUILD_DIR}" DESTDIR="${DESTDIR}" install ${args.install_args}
find "${DESTDIR}" -type f -name '*.la' -delete
"""
