schema_version = 1

[package]
name = "e2fsprogs-dev"
version = "1.47.4"
release = "1"
description = "e2fsprogs library headers, pkg-config and linker symlink"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://mirrors.edge.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.4/e2fsprogs-1.47.4.tar.xz"
sha256 = "fd5bf388cbdbe006a3d3b318d983b2948382440acc85a87f1e7d108653e8db0b"

dependencies = [
    "e2fsprogs-libs >= 1.47.4",
]

build_dependencies = [
    "pkgconf >= 3.0.5"
]

provides = [
    "e2fsprogs-dev"
]

prepare = [
    "rm -rf build && mkdir -p build"
]

build = [
    "cd build && ../configure --prefix=/usr --sysconfdir=/etc --enable-elf-shlibs --disable-libblkid --disable-libuuid --disable-fsck",
    "cd build && make -j$(nproc)"
]

install = [
    "cd build && make install-libs DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
