schema_version = 1

[package]
name = "rust-bin"
version = "1.98.0"
release = 1
epoch = 0
description = "Official Rust compiler binary distribution"
license = "Apache-2.0 OR MIT"
channel = "rust1.98"
arch = "amd64"
slot = "1.98.0"

dependencies = [
    "virtual/libc",
    "system/curl",
    "system/gcc-libs",
    "system/libstdc++",
    "system/openssl-libs",
]

provides = ["rust-bin", "rustc"]

[[sources]]
url = "https://static.rust-lang.org/dist/2026-08-20/rust-1.98.0-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "ed8ee2df70909c88cbaf87a6cfa3920dac00b537de12a6abe6906641e0f5952f"
strip_components = 1
destination = "rust-bin"

[[sources]]
url = "https://static.rust-lang.org/dist/2026-08-20/rust-src-1.98.0.tar.xz"
sha256 = "0e977492aed5ff137815bf9b4b796e8a85b80fb2367ed64e82d5c5839870f2bf"
strip_components = 2
destination = "rust-src"

[build]
inherit = ["rust-bin"]
private_library_dirs = ["lib"]

[build.payload]
default = "remaining"

[[subpackages]]
name = "cargo"
description = "Rust package manager and build tool"
license = "Apache-2.0 OR MIT"
dependencies = ["rust-bin:1.98.0 >= 1.98.0-1"]
provides = ["cargo"]

[subpackages.payload]
files = [
    "usr/bin/cargo",
    "usr/bin/cargo-*",
    "usr/share/bash-completion/completions/cargo",
    "usr/share/man/man1/cargo*",
    "usr/share/zsh/site-functions/_cargo",
]

[[subpackages]]
name = "rust-src"
description = "Rust standard library source"
license = "Apache-2.0 OR MIT"
provides = ["rust-src"]

[subpackages.payload]
files = ["usr/lib/rustlib/src/rust/**"]
