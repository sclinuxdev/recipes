schema_version = 2

[package]
name = "bison"
version = "3.8.2"
release = "1"
description = "GNU parser generator"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "m4 >= 1.4.21"
]
build_dependencies = [
    "gettext >= 1.0",
    "m4 >= 1.4.21"
]
provides = [
    "bison"
]

[upstream]
url = "https://ftp.gnu.org/gnu/bison/"
version_regex = 'bison-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[build]
system = "autotools"
install_targets = ["install"]
configure_options = [
    "--docdir=/usr/share/doc/bison-3.8.2"
]
