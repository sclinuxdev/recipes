schema_version = 1

[package]
name = "python-dev"
version = "3.14.7"
release = "1"
description = "Python headers, pkg-config and libpython.so symlink"
license = "PSF-2.0"
channel = "system"

[source]
url = "https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz"
sha256 = "3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"

dependencies = [
    "python-libs >= 3.14.7"
]

build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "libffi-dev >= 3.8.0",
    "sqlite-dev >= 3.53.4",
    "expat-dev >= 2.8.3",
    "bzip2-dev >= 1.0.8",
    "xz-dev >= 5.8.3",
    "zstd-dev >= 1.5.7",
    "ncurses-dev >= 6.6",
    "readline-dev >= 8.3",
    "mpdecimal-dev >= 4.0.1",
    "pkgconf >= 3.0.5"
]

provides = [
    "python-dev"
]

prepare = []

build = [
    "CFLAGS=\"$CFLAGS -DOPENSSL_NO_SSL3 -DOPENSSL_NO_SSL3_METHOD -DOPENSSL_NO_TLS1 -DOPENSSL_NO_TLS1_METHOD -DOPENSSL_NO_TLS1_1 -DOPENSSL_NO_TLS1_1_METHOD -DOPENSSL_NO_TLS1_2 -DOPENSSL_NO_TLS1_2_METHOD\" ./configure --prefix=/usr/lib/runtimes/python/3.14 --enable-shared --with-system-expat --with-system-libmpdec --without-ensurepip --without-static-libpython",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/include $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib",
    "if [ -d $DESTDIR/usr/lib/runtimes/python/3.14/include/python3.14 ]; then cp -a $DESTDIR/usr/lib/runtimes/python/3.14/include/python3.14 $DESTDIR/usr/include/; elif [ -d $DESTDIR/usr/lib/runtimes/python/3.14/include ]; then cp -a $DESTDIR/usr/lib/runtimes/python/3.14/include/. $DESTDIR/usr/include/; fi",
    "if [ -d $DESTDIR/usr/lib/runtimes/python/3.14/lib/pkgconfig ]; then cp -a $DESTDIR/usr/lib/runtimes/python/3.14/lib/pkgconfig/. $DESTDIR/usr/lib/pkgconfig/; fi",
    "ln -sfn libpython3.14.so.1.0 $DESTDIR/usr/lib/libpython3.14.so",
    "ln -sfn libpython3.14.so.1.0 $DESTDIR/usr/lib/libpython3.so",
    "rm -rf $DESTDIR/usr/lib/runtimes/python/3.14 $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
