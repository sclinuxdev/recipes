schema_version = 1

[package]
name = "libnsl"
version = "2.0.1"
release = 1
epoch = 0
description = "Public client interface for NIS services"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
slot = "2"

dependencies = [
    "virtual/libc",
    "libtirpc-libs >= 1.3.7-1",
]
provides = ["libnsl", "libnsl-libs", "so:libnsl.so.3"]

[[sources]]
url = "https://github.com/thkukuk/libnsl/releases/download/v2.0.1/libnsl-2.0.1.tar.xz"
sha256 = "5c9e470b232a7acd3433491ac5221b4832f0c71318618dc6aa04dd05ffcd8fd9"
strip_components = 1
destination = "."

[build]
inherit = ["autotools"]
dependencies = ["libtirpc-dev >= 1.3.7-1"]
cppflags = "-I/toolchain/usr/include/tirpc"

[build.args]
configure_args = "--disable-static"

[build.payload]
default = "remaining"

[[subpackages]]
name = "libnsl-dev"
description = "NIS client development headers and linker metadata"
license = "LGPL-2.1-or-later"
dependencies = ["libnsl:2 >= 2.0.1-1"]
provides = ["libnsl-dev"]

[subpackages.payload]
files = ["usr/include/**", "usr/lib/*.so", "usr/lib/pkgconfig/**"]
