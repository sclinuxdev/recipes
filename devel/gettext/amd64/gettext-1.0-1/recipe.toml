schema_version = 2

[package]
name = "gettext"
version = "1.0"
release = "1"
description = "GNU i18n tools (gettext, msgfmt, xgettext, ...)"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "gettext-libs >= 1.0",
    "ncurses-libs >= 6.6",
    "acl-libs >= 2.4.0",
]
provides = [
    "gettext"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gettext/"
version_regex = 'gettext-([0-9][0-9.]*)\.tar'

[source]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--docdir=/usr/share/doc/gettext-1.0",
]
