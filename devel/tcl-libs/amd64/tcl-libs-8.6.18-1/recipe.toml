schema_version = 2

[package]
name = "tcl-libs"
version = "8.6.18"
release = "1"
description = "Tcl shared runtime library"
license = "TCL"
channel = "system"
arch = "amd64"
dependencies = [
    "zlib >= 1.3.2"
]
build_dependencies = [
    "zlib-dev >= 1.3.2"
]
provides = [
    "tcl-libs",
    "so:libtcl8.6.so"
]

[upstream]
url = "https://sourceforge.net/projects/tcl/files/Tcl/"
version_regex = '([0-9]+\.[0-9]+\.[0-9]+)/'

[source]
url = "https://downloads.sourceforge.net/project/tcl/Tcl/8.6.18/tcl8.6.18-src.tar.gz"
sha256 = "14f9af32b1767ff718477a8f974ad03c34341097e6b43f4ce54644ee974e268e"

[build]
system = "autotools"
source_subdir = "unix"
configure_options = [
    "--mandir=/usr/share/man"
]
