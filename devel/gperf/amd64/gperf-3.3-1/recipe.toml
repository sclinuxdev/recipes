schema_version = 2

[package]
name = "gperf"
version = "3.3"
release = "1"
description = "Perfect hash function generator"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "gcc-libs >= 15.3.0",
]
build_dependencies = []
provides = [
    "gperf"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gperf/"
version_regex = 'gperf-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/gperf/gperf-3.3.tar.gz"
sha256 = "fd87e0aba7e43ae054837afd6cd4db03a3f2693deb3619085e6ed9d8d9604ad8"

[build]
system = "autotools"
install_targets = ["install"]
configure_options = [
    "--docdir=/usr/share/doc/gperf-3.3"
]
