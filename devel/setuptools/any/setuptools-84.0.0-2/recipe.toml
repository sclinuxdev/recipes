schema_version = 1

[package]
name = "setuptools"
version = "84.0.0"
release = "2"
description = "Python setuptools"
license = "MIT"
channel = "system"
arch = "any"

[source]
url = "https://files.pythonhosted.org/packages/6d/44/f5da03a8ef95d369145c5bb53050e7877c9f3d312e128605fd9504829143/setuptools-84.0.0.tar.gz"
sha256 = "f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73"

dependencies = [
    "python >= 3.14.7",
    "packaging >= 26.3"
]

build_dependencies = [
    "python >= 3.14.7",
    "flit-core >= 3.9.0",
    "wheel >= 0.40.0"
]

provides = [
    "setuptools"
]

prepare = []

build = [
    "python3 -c \"import setuptools.build_meta as b; b.build_wheel('dist')\""
]

install = [
    "mkdir -p $DESTDIR/usr/lib/python3.14/site-packages",
    "python3 -c \"import sys, zipfile, glob; [zipfile.ZipFile(f).extractall(sys.argv[1]) for f in glob.glob('dist/*.whl')]\" $DESTDIR/usr/lib/python3.14/site-packages"
]
