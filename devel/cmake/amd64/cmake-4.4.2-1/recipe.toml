schema_version = 1

[package]
name = "cmake"
version = "4.4.2"
release = "1"
description = "Cross-platform build system"
license = "BSD-3-Clause"
channel = "system"
arch = "amd64"

[source]
url = "https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2.tar.gz"
sha256 = "1db9e61e60b6e0874c86386340b910382f3c5e75b9fbfb44d122063129a2789d"

dependencies = [
    "gcc-libs >= 15.3.0",
    "openssl-libs >= 4.0.1",
    "zlib >= 1.3.2",
    "bzip2-libs >= 1.0.8",
    "xz-libs >= 5.8.3",
    "zstd-libs >= 1.5.7",
    "curl-libs >= 8.21.0",
    "expat-libs >= 2.8.3",
    "libarchive-libs >= 3.8.9",
    "ncurses-libs >= 6.6"
]

build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "curl-dev >= 8.21.0",
    "expat-dev >= 2.8.3",
    "libarchive-dev >= 3.8.9",
    "ncurses-dev >= 6.6",
    "pkgconf >= 3.0.5"
]

provides = [
    "cmake"
]

prepare = []

build = [
    "CFLAGS=\"$CFLAGS -fpermissive\" CXXFLAGS=\"$CXXFLAGS -fpermissive\" ./bootstrap --prefix=/usr --system-curl --system-zlib --system-bzip2 --system-zstd --system-liblzma --system-libarchive --system-expat --no-system-jsoncpp --no-system-librhash --no-system-cppdap",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
