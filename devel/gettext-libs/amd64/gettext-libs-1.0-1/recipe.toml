schema_version = 2

[package]
name = "gettext-libs"
version = "1.0"
release = "1"
description = "libintl/libasprintf shared runtime libraries"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "gcc-libs >= 15.3.0"
]

provides = [
    "gettext-libs",
    "so:libintl.so.8",
    "so:libasprintf.so.1"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gettext/"
version_regex = 'gettext-([0-9][0-9.]*)\.tar'

[source]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/lib/*.so.*",
]
configure_options = [
    "--disable-static",
    "--docdir=/usr/share/doc/gettext-1.0"
]
