schema_version = 1

[package]
name = "gettext-libs"
version = "1.0"
release = "1"
description = "libintl/libasprintf shared runtime libraries"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

dependencies = [
    "gcc-libs >= 15.3.0"
]

provides = [
    "gettext-libs",
    "so:libintl.so.8",
    "so:libasprintf.so.1"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/gettext-1.0",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib/cmake 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 \\( -type l -o -type f \\) -name '*.so' ! -name '*.so.*' -delete 2>/dev/null || true"
]
