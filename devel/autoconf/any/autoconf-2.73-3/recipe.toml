schema_version = 1

[package]
name = "autoconf"
version = "2.73"
release = "3"
description = "GNU autoconf"
license = "GPL-3.0-or-later"
channel = "system"
arch = "any"

[source]
url = "https://mirrors.kernel.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"

dependencies = [
    "perl >= 5.44.0",
    "m4 >= 1.4.21"
]

build_dependencies = [
    "perl >= 5.44.0",
    "m4 >= 1.4.21"
]

provides = [
    "autoconf"
]

prepare = []

build = [
    "./configure --prefix=/usr",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -f $DESTDIR/usr/share/info/dir"
]
