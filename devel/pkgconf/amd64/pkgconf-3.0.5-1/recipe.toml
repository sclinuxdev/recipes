schema_version = 2

[package]
name = "pkgconf"
version = "3.0.5"
release = "1"
description = "pkg-config compatible compiler/linker helper"
license = "ISC"
channel = "system"
arch = "amd64"
dependencies = [
]
provides = [
    "pkgconf"
]

[upstream]
url = "https://github.com/pkgconf/pkgconf/tags"
version_regex = 'pkgconf-([0-9]+\.[0-9.]+)'

[source]
url = "https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.5/pkgconf-3.0.5.tar.xz"
sha256 = "3acd3a8a3cce65a8d620321855d92fb602e026cbe8e13ee36bdec58483b59ace"

[build]
system = "autotools"
install_targets = ["install"]
configure_options = [
    "--disable-static"
]
