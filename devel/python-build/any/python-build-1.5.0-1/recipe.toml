schema_version = 1

[package]
name = "python-build"
version = "1.5.0"
release = 1
epoch = 0
description = "PEP 517 build frontend for Python packages"
license = "MIT"
channel = "python3.14"
arch = "any"

dependencies = [
    "python:3.14 >= 3.14.7-1",
    "python-packaging",
    "python-pyproject-hooks",
]
provides = ["python-build"]

[[sources]]
kind = "file"
url = "https://files.pythonhosted.org/packages/0d/fe/6bea5c9162869c5beba5d9c8abbed835ec85bf1ec1fba05a3822325c45f3/build-1.5.0-py3-none-any.whl"
sha256 = "13f3eecb844759ab66efec90ca17639bbf14dc06cb2fdf37a9010322d9c50a6f"
destination = "build.whl"

[build]
inherit = ["custom"]
dependencies = ["python:3.14 >= 3.14.7-1"]

[build.args]
install_cmd = "wheel=\"${SRC_DIR}/build.whl\"; out=\"${BUILD_DIR}/wheel\"; python3 -m zipfile -e \"$wheel\" \"$out\"; install -dm755 \"${DESTDIR}/usr/lib/python3.14/site-packages\"; cp -a \"$out/build\" \"${DESTDIR}/usr/lib/python3.14/site-packages/\"; cp -a \"$out\"/*.dist-info \"${DESTDIR}/usr/lib/python3.14/site-packages/\"; for script in \"$out\"/*.data/scripts/*; do [ -f \"$script\" ] || continue; install -Dm755 \"$script\" \"${DESTDIR}/usr/bin/$(basename \"$script\")\"; done"

[build.payload]
default = "remaining"
