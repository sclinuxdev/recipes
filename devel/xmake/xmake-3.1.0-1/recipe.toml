schema_version = 1

[package]
name = "xmake"
version = "3.1.0"
release = "1"
description = "xmake C/C++ build utility in toolchain/xmake:3"
license = "Apache-2.0"
channel = "toolchain/xmake:3"

[source]
url = "https://github.com/xmake-io/xmake/releases/download/v3.1.0/xmake-v3.1.0.tar.gz"
sha256 = "84aae0926d293f486297dfb63fc4cd802218124c9c91b141f2004dcc4d509fdd"

dependencies = [
    "gcc-libs >= 15.3.0"
]

provides = [
    "xmake"
]

prepare = []

build = [
    "./configure --runtime=lua --prefix=/opt/channels/xmake/3",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR PREFIX=/opt/channels/xmake/3",
    "if [ -e \"$DESTDIR/usr/bin/xmake\" ] && [ ! -e \"$DESTDIR/opt/channels/xmake/3/bin/xmake\" ]; then mkdir -p \"$DESTDIR/opt/channels/xmake/3\"; mv \"$DESTDIR/usr/bin\" \"$DESTDIR/opt/channels/xmake/3/bin\"; mkdir -p \"$DESTDIR/opt/channels/xmake/3/share\"; mv \"$DESTDIR/usr/share/xmake\" \"$DESTDIR/opt/channels/xmake/3/share/xmake\" 2>/dev/null || true; rmdir \"$DESTDIR/usr/share\" \"$DESTDIR/usr/bin\" 2>/dev/null || true; fi",
    "[ -x \"$DESTDIR/opt/channels/xmake/3/bin/xmake\" ] || { echo 'ERROR: xmake not installed at /opt/channels/xmake/3/bin/xmake' >&2; exit 1; }"
]
