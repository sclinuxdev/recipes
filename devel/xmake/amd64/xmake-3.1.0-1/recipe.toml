schema_version = 2

[package]
name = "xmake"
version = "3.1.0"
release = "1"
description = "xmake C/C++ build utility"
license = "Apache-2.0"
channel = "system"
arch = "amd64"
dependencies = [
    "gcc-libs >= 15.3.0"
]

provides = [
    "xmake"
]

[upstream]
url = "https://github.com/xmake-io/xmake/tags"
version_regex = 'v([0-9]+\.[0-9.]+)'

[source]
url = "https://github.com/xmake-io/xmake/releases/download/v3.1.0/xmake-v3.1.0.tar.gz"
sha256 = "84aae0926d293f486297dfb63fc4cd802218124c9c91b141f2004dcc4d509fdd"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--runtime=lua"
]
