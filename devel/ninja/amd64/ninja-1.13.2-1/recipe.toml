schema_version = 2

[package]
name = "ninja"
version = "1.13.2"
release = "1"
description = "Small build system with a focus on speed"
license = "Apache-2.0"
channel = "system"
arch = "amd64"

dependencies = ["gcc-libs >= 15.3.0"]
build_dependencies = ["python >= 3.14.7"]
provides = ["ninja"]

[source]
url = "https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"

[upstream]
url = "https://github.com/ninja-build/ninja/releases"
version_regex = 'v([0-9][0-9.]*)'

[build]
# configure.py performs the native C++ bootstrap. The generated Makefile is a
# no-op adapter so Sage still owns the build and install phase boundaries.
system = "make"
payload = "allowlist"
build_targets = ["all"]
install_targets = ["install"]
install_files = [
    "usr/bin/ninja",
    "usr/share/bash-completion/completions/ninja",
    "usr/share/zsh/site-functions/_ninja",
]

[[build.steps]]
name = "bootstrap"
phase = "pre-build"
cwd = "source"
command = '''set -e
python3 configure.py --bootstrap --verbose
printf '%s\n' 'all:' 'install:' > Makefile
'''

[[build.steps]]
name = "install-files"
phase = "install"
cwd = "source"
command = '''set -e
install -vDm755 ninja "$DESTDIR/usr/bin/ninja"
install -vDm644 misc/bash-completion "$DESTDIR/usr/share/bash-completion/completions/ninja"
install -vDm644 misc/zsh-completion "$DESTDIR/usr/share/zsh/site-functions/_ninja"
'''
