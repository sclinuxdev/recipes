schema_version = 1

[package]
name = "binutils"
version = "2.47"
release = "3"
description = "GNU binary utilities in gcc toolchain slot"
license = "GPL-3.0-or-later"
channel = "toolchain/gcc:16"

[source]
url = "https://mirrors.kernel.org/gnu/binutils/binutils-2.47.tar.xz"
sha256 = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"

dependencies = [
    "zlib >= 1.3.2",
    "zstd-libs >= 1.5.7",
]

build_dependencies = [
    "zlib-dev >= 1.3.2",
    "zstd-dev >= 1.5.7"
]

provides = [
    "binutils",
    "so:libbfd-2.47.so",
    "so:libctf.so.0"
]

prepare = [
    "mkdir -p build"
]

build = [
    # gold was removed from the binutils tree (no gold/ in the 2.47 release
    # tarball); --enable-gold was inert and gmp was never linked.
    "cd build && ../configure --prefix=/opt/channels/gcc/16 --sysconfdir=/etc --enable-plugins --enable-shared --disable-werror --enable-64-bit-bfd --with-system-zlib --enable-default-hash-style=gnu --without-debuginfod --disable-gprofng",
    "cd build && make tooldir=/opt/channels/gcc/16/x86_64-pc-linux-gnu"
]

install = [
    "cd build && make tooldir=/opt/channels/gcc/16/x86_64-pc-linux-gnu install DESTDIR=$DESTDIR",
    "rm -fv $DESTDIR/opt/channels/gcc/16/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a 2>/dev/null || true"
]
