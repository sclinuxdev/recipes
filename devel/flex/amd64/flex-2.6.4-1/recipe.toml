schema_version = 2

[package]
name = "flex"
version = "2.6.4"
release = "1"
description = "Lexical analyzer generator"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"
dependencies = [
    "m4 >= 1.4.21"
]
build_dependencies = [
    "m4 >= 1.4.21",
    "bison >= 3.8.2"
]
provides = [
    "flex"
]

[upstream]
url = "https://github.com/westes/flex/tags"
version_regex = 'v([0-9]+\.[0-9.]+)'

[source]
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--disable-static"
]
