schema_version = 2

[package]
name = "markupsafe"
version = "3.0.3"
release = "1"
description = "Python HTML/XML string escape library"
license = "BSD-3-Clause"
channel = "system"
arch = "amd64"

dependencies = ["python >= 3.14.7"]
build_dependencies = [
    "python >= 3.14.7",
    "setuptools >= 68.0"
]
provides = ["markupsafe"]

[source]
url = "https://files.pythonhosted.org/packages/7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7/markupsafe-3.0.3.tar.gz"
sha256 = "722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"

[upstream]
url = "https://pypi.org/project/MarkupSafe/"
version_regex = 'markupsafe-([0-9][0-9.]*)\.tar'

[build]
# The wheel build may compile MarkupSafe's optional C speedups. Running it as
# a managed Make recipe keeps that compiler invocation inside Sage's normal
# compiler/linker audit while the generated Makefile remains a no-op adapter.
system = "make"
payload = "allowlist"
build_targets = ["all"]
install_targets = ["install"]
install_files = [
    "usr/lib/python3.14/site-packages/**",
]

[[build.steps]]
name = "build-wheel"
phase = "pre-build"
cwd = "source"
command = '''set -e
python3 -c 'import setuptools.build_meta as b; b.build_wheel("dist")'
printf '%s\n' 'all:' 'install:' > Makefile
'''

[[build.steps]]
name = "install-wheel"
phase = "install"
cwd = "source"
command = '''set -e
mkdir -p "$DESTDIR/usr/lib/python3.14/site-packages"
python3 -c 'import sys, zipfile, glob; [zipfile.ZipFile(f).extractall(sys.argv[1]) for f in glob.glob("dist/*.whl")]' "$DESTDIR/usr/lib/python3.14/site-packages"
'''
