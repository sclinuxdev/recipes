schema_version = 1

[package]
name = "python"
version = "3.14.7"
release = "1"
description = "Python isolated runtime slot"
license = "PSF-2.0"
channel = "runtime/python:3.14"
arch = "aarch64"

[source]
url = "https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz"
sha256 = "3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"

dependencies = [
    "python-libs >= 3.14.7",
]

build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "libffi-dev >= 3.8.0",
    "sqlite-dev >= 3.53.4",
    "expat-dev >= 2.8.3",
    "bzip2-dev >= 1.0.8",
    "xz-dev >= 5.8.3",
    "zstd-dev >= 1.5.7",
    "ncurses-dev >= 6.6",
    "readline-dev >= 8.3",
    "mpdecimal-dev >= 4.0.1",
    "pkgconf >= 3.0.5"
]

provides = [
    "python"
]

prepare = []

build = [
    "CFLAGS=\"$CFLAGS -DOPENSSL_NO_SSL3 -DOPENSSL_NO_SSL3_METHOD -DOPENSSL_NO_TLS1 -DOPENSSL_NO_TLS1_METHOD -DOPENSSL_NO_TLS1_1 -DOPENSSL_NO_TLS1_1_METHOD -DOPENSSL_NO_TLS1_2 -DOPENSSL_NO_TLS1_2_METHOD\" ./configure --prefix=/usr/lib/runtimes/python/3.14 --enable-shared --with-system-expat --with-system-libmpdec --without-ensurepip --without-static-libpython",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "find $DESTDIR/usr/lib/runtimes/python/3.14 -name 'libpython3.14.so*' -delete",
    "ln -sf python3 $DESTDIR/usr/lib/runtimes/python/3.14/bin/python",
    "mkdir -p $DESTDIR/usr/bin $DESTDIR/etc",
    "printf '#!/bin/sh\\nexport PYTHONPATH=/usr/lib/python3.14/site-packages${PYTHONPATH:+:$PYTHONPATH}\\nexec /usr/lib/runtimes/python/3.14/bin/python3 \"$@\"\\n' > $DESTDIR/usr/bin/python3",
    "chmod 755 $DESTDIR/usr/bin/python3",
    "ln -sfn python3 $DESTDIR/usr/bin/python",
    "printf '[global]\\nroot-user-action = ignore\\ndisable-pip-version-check = true\\n' > $DESTDIR/etc/pip.conf"
]
