schema_version = 1

[package]
name = "python-packaging"
version = "26.3"
release = 1
epoch = 0
description = "Core packaging metadata and version utilities for Python"
license = "Apache-2.0 OR BSD-2-Clause"
channel = "python3.14"
arch = "any"

dependencies = ["python:3.14 >= 3.14.7-1"]
provides = ["python-packaging"]

[[sources]]
kind = "file"
url = "https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl"
sha256 = "d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"
destination = "packaging.whl"

[build]
inherit = ["custom"]
dependencies = ["python:3.14 >= 3.14.7-1"]

[build.args]
install_cmd = "out=\"${BUILD_DIR}/wheel\"; python3 -m zipfile -e \"${SRC_DIR}/packaging.whl\" \"$out\"; install -dm755 \"${DESTDIR}/usr/lib/python3.14/site-packages\"; cp -a \"$out/packaging\" \"${DESTDIR}/usr/lib/python3.14/site-packages/\"; cp -a \"$out\"/*.dist-info \"${DESTDIR}/usr/lib/python3.14/site-packages/\""

[build.payload]
default = "remaining"
