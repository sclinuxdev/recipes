schema_version = 1

[package]
name = "automake"
version = "1.18.1"
release = 1
epoch = 0
description = "GNU Makefile generator"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"

dependencies = ["virtual/libc", "autoconf", "perl"]
provides = ["automake"]

[[sources]]
url = "https://ftp.gnu.org/gnu/automake/automake-1.18.1.tar.xz"
sha256 = "168aa363278351b89af56684448f525a5bce5079d0b6842bd910fdd3f1646887"
strip_components = 1
destination = "."

[build]
inherit = ["autotools"]

[build.payload]
default = "remaining"
