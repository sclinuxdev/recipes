schema_version = 2

[package]
name = "gcc"
version = "16.2.0"
release = "1"
description = "GNU Compiler Collection (C, C++)"
license = "GPL-3.0-or-later"
channel = "toolchain/gcc:16"
arch = "amd64"
dependencies = [
    "binutils >= 2.47",
    "gmp >= 6.3.0",
    "mpfr >= 4.2.2",
    "mpc >= 1.4.1",
    "isl >= 0.27",
    "zstd-libs >= 1.5.7",
    "zlib >= 1.3.2"
]
build_dependencies = [
    "gmp-dev >= 6.3.0",
    "mpfr-dev >= 4.2.2",
    "mpc-dev >= 1.4.1",
    "isl-dev >= 0.27",
    "zstd-dev >= 1.5.7",
    "zlib-dev >= 1.3.2"
]
provides = [
    "gcc",
    "cc",
    "c++"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gcc/"
version_regex = 'gcc-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"

# core system software: pinned to gcc (v2 package default)
[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--enable-languages=c,c++",
    "--enable-default-pie",
    "--enable-default-ssp",
    "--disable-multilib",
    "--disable-bootstrap",
    "--disable-fixincludes",
    "--disable-nls",
    "--with-system-zlib",
    "--with-isl=/usr"
]

[build.toolchain.compiler]
family = "gcc"
package = "gcc"
minimum_version = "15.1"

[build.toolchain.linker]
family = "ld"
package = "binutils"
minimum_version = "2.40"
