schema_version = 1

[package]
name = "gettext-dev"
version = "1.0"
release = "1"
description = "gettext/libintl headers, pkg-config and linker symlink"
license = "LGPL-2.1-or-later"
channel = "system"

[source]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"
sha256 = "71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7"

dependencies = [
    "gettext-libs >= 1.0"
]

provides = [
    "gettext-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/gettext-1.0",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
