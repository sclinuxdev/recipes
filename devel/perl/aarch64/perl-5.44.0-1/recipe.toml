schema_version = 1

[package]
name = "perl"
version = "5.44.0"
release = "1"
description = "Perl isolated language toolchain"
license = "GPL-1.0-or-later OR Artistic-1.0-Perl"
channel = "toolchain/perl:5.44"
arch = "aarch64"

[source]
url = "https://www.cpan.org/src/5.0/perl-5.44.0.tar.xz"
sha256 = "505cf43912e9480495c344c70260452e32aa2a73c546a026b3f100053b23ce91"

# The perl binary links libcrypt (Configure's libswanted probes -lcrypt), and
# the XS extensions installed under the channel prefix link their own
# libraries: GDBM_File -> libgdbm, Compress::Raw::Zlib (BUILD_ZLIB=False) ->
# libz, Compress::Raw::Bzip2 (BUILD_BZIP2=0) -> libbz2.
dependencies = [
    "perl-libs >= 5.44.0",
    "libxcrypt >= 4.5.2",
    "gdbm-libs >= 1.26",
    "zlib >= 1.3.2",
    "bzip2-libs >= 1.0.8"
]

build_dependencies = [
    "gdbm-dev >= 1.26",
    "bzip2-dev >= 1.0.8",
    "zlib-dev >= 1.3.2"
]

provides = [
    "perl"
]

prepare = []

build = [
    "BUILD_ZLIB=False BUILD_BZIP2=0 sh Configure -de -D prefix=/opt/channels/perl/5.44 -D vendorprefix=/opt/channels/perl/5.44 -D privlib=/opt/channels/perl/5.44/lib/perl5/5.44/core_perl -D archlib=/opt/channels/perl/5.44/lib/perl5/5.44/core_perl -D sitelib=/opt/channels/perl/5.44/lib/perl5/5.44/site_perl -D sitearch=/opt/channels/perl/5.44/lib/perl5/5.44/site_perl -D vendorlib=/opt/channels/perl/5.44/lib/perl5/5.44/vendor_perl -D vendorarch=/opt/channels/perl/5.44/lib/perl5/5.44/vendor_perl -D man1dir=/opt/channels/perl/5.44/share/man/man1 -D man3dir=/opt/channels/perl/5.44/share/man/man3 -D pager=\"/usr/bin/cat\" -D useshrplib -D usethreads -D BUILD_ZLIB=0 -D BUILD_BZIP2=0",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -f $DESTDIR/usr/lib/libperl.so $DESTDIR/usr/lib/libperl.so.*",
    "mkdir -p $DESTDIR/usr/bin",
    "ln -sfn /opt/channels/perl/5.44/bin/perl $DESTDIR/usr/bin/perl"
]
