schema_version = 2

[package]
name = "less"
version = "704"
release = "1"
arch = "amd64"
description = "Terminal pager"
license = "GPL-3.0-or-later OR BSD-2-Clause"
channel = "system"
dependencies = [
    "ncurses-libs >= 6.6",
    "pcre2-libs >= 10.47"
]
build_dependencies = [
    "ncurses-dev >= 6.6",
    "pcre2-dev >= 10.47"
]
provides = [
    "less"
]

[upstream]
url = "https://ftp.gnu.org/gnu/less/"
version_regex = 'less-([0-9][0-9.]*)\.tar'

[source]
url = "https://ftpmirror.gnu.org/less/less-704.tar.gz"
sha256 = "20a0b0a2bb2525fa53c7eee9beb854b4c9cf172eabb209af7020743547bfe9fb"

[build]
system = "autotools"
install_targets = ["install"]
configure_options = [
    "--sysconfdir=/etc",
    "--with-regex=pcre2",
]
