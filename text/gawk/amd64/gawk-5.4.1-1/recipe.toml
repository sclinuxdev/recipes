schema_version = 2

[package]
name = "gawk"
version = "5.4.1"
release = "1"
arch = "amd64"
description = "GNU awk"
license = "GPL-3.0-or-later"
channel = "system"
dependencies = [
    "gmp >= 6.3.0",
    "mpfr >= 4.2.2",
    "readline >= 8.3",
]
build_dependencies = []
provides = [
    "gawk",
    "awk"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gawk/"
version_regex = 'gawk-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/gawk/gawk-5.4.1.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[build]
system = "autotools"
configure_options = [
    "--disable-nls"
]
