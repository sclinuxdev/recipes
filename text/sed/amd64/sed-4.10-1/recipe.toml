schema_version = 1

[package]
name = "sed"
version = "4.10"
release = 1
epoch = 0
description = "GNU stream editor for filtering and transforming text"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
]

provides = ["sed"]

[source]
url = "https://ftp.gnu.org/gnu/sed/sed-4.10.tar.xz"
sha256 = "b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--without-selinux --disable-nls"

[build.payload]
default = "remaining"
