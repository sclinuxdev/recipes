# Linux ZEN kernel.
#
# Supersedes Stage2/recipes/linux-zen (release 2). Two changes:
#
#   1. Depends on virtual/initramfs-generator. Installing a kernel now pulls in
#      a builder for the initramfs it cannot boot without, and sage's
#      capability trigger regenerates the image once the kernel lands.
#   2. The empty sha256 is filled in.
#
# Note the second distfile: prepare applies ../distfiles/linux-v7.1.9-zen1.patch.zst,
# which sage does not fetch or verify -- one [source] url is all it supports.
# That file has to be placed in the recipe's distfiles/ directory by hand.
# Its sha256 is bdd01b28231ae1e2b5804c28d0917af44e5f72ee35ff8bdd1406b8c40126d009.

schema_version = 1

[package]
name = "linux-zen"
version = "7.1.9"
release = "3"
description = "Linux ZEN kernel with performance optimizations"
license = "GPL-2.0-only"
channel = "system"

[source]
url = "https://mirrors.tuna.tsinghua.edu.cn/kernel/v7.x/linux-7.1.9.tar.xz"
sha256 = "3271a4ae3897b38352980f2b0975bae61bca81c644d186221c5ae928bcc072b0"

# virtual/initramfs-generator, not "mkinitcpio": a kernel is unbootable
# without an initramfs, so the generator is a hard runtime dependency -- but
# WHICH generator is a system choice. Depending on the capability lets dracut
# satisfy this without touching the recipe, and it is what makes sage's
# post-transaction trigger able to find a builder after this package lands.
dependencies = [
    "kmod >= 34.2",
    "virtual/initramfs-generator",
]

build_dependencies = [
    "bc >= 7.0.3",
    "bison >= 3.8.2",
    "flex >= 2.6.4",
    "libelf-dev >= 0.196",
    "openssl-dev >= 4.0.1",
    "perl >= 5.44.0",
    "python >= 3.14.7",
    "tar >= 1.35",
    "xz >= 5.8.3",
    "zlib-dev >= 1.3.2",
    "zstd >= 1.5.7"
]

provides = [
    "linux-zen",
    "linux",
    "virtual/linux",
    "virtual/kernel"
]

prepare = [
    "[ -f .prepared ] || zstd -dc ../distfiles/linux-v7.1.9-zen1.patch.zst | patch -p1 --forward --batch || true",
    "[ -f .prepared ] || cp -v ../config.x86_64 .config",
    "[ -f .prepared ] || echo '-1' > localversion.10-pkgrel",
    "[ -f .prepared ] || echo '-zen' > localversion.20-pkgname",
    "[ -f .prepared ] || ./scripts/config --disable DEBUG_INFO --enable DEBUG_INFO_NONE --disable DEBUG_INFO_DWARF5 --disable DEBUG_INFO_DWARF4 --disable DEBUG_INFO_BTF --disable DEBUG_INFO_BTF_MODULES --disable RUST",
    "[ -f .prepared ] || make olddefconfig",
    "[ -f .prepared ] || touch .prepared"
]

build = [
    "make -j$(nproc) -k KCFLAGS=\"-Wno-error\" all || make -j$(nproc) KCFLAGS=\"-Wno-error\" all"
]

install = [
    "set -e; KVER=$(make -s kernelrelease); echo \"Installing kernel release: ${KVER}\"; mkdir -p $DESTDIR/boot $DESTDIR/usr/lib/modules; make INSTALL_MOD_PATH=$DESTDIR modules_install; if [ -d $DESTDIR/lib/modules ] && [ ! -L $DESTDIR/lib ]; then cp -a $DESTDIR/lib/modules $DESTDIR/usr/lib/ && rm -rf $DESTDIR/lib; fi; rm -f $DESTDIR/usr/lib/modules/$KVER/build $DESTDIR/usr/lib/modules/$KVER/source; install -Dm644 arch/x86/boot/bzImage $DESTDIR/boot/vmlinuz-${KVER}; install -Dm644 System.map $DESTDIR/boot/System.map-${KVER}; install -Dm644 .config $DESTDIR/boot/config-${KVER}; install -Dm644 arch/x86/boot/bzImage $DESTDIR/usr/lib/modules/$KVER/vmlinuz"
]
