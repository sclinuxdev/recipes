# tzcode -- the IANA time zone compiler (zic) and dumper (zdump).
#
# New package, and split from tzdata for a mechanical reason: sage supports
# exactly one [source] url per recipe, while IANA ships the code and the data
# as two separate tarballs. Building tzdata needs zic, so zic becomes a real
# build dependency with its own recipe rather than a second unverified
# download smuggled into a prepare step.

schema_version = 1

[package]
name = "tzcode"
version = "2026c"
release = "1"
description = "IANA time zone database compiler and dumper"
license = "BSD-3-Clause"
channel = "system"

[source]
url = "https://data.iana.org/time-zones/releases/tzcode2026c.tar.gz"
sha256 = "b1cffc3ace4c4c7cd0efba2f7add86ec3d0b79da48bcf03582671fd3c8feace8"

dependencies = [
]

build_dependencies = [
    "glibc-dev >= 2.44"
]

provides = [
    "tzcode"
]

# The tarball has no top-level directory: it unpacks straight into the cwd.
prepare = []

build = [
    "make CFLAGS=\"$CFLAGS -DHAVE_GETTEXT=0\" zic zdump"
]

install = [
    "mkdir -p $DESTDIR/usr/bin",
    "install -m755 zic $DESTDIR/usr/bin/zic",
    "install -m755 zdump $DESTDIR/usr/bin/zdump"
]
