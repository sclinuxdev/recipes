schema_version = 2

[package]
name = "curl-dev"
version = "8.21.0"
release = "1"
description = "libcurl headers, pkg-config and linker symlink"
license = "curl"
channel = "system"
arch = "amd64"

dependencies = [
    "curl-libs >= 8.21.0",
]

build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "zstd-dev >= 1.5.7",
    "pkgconf >= 3.0.5"
]

provides = [
    "curl-dev"
]

[upstream]
url = "https://curl.se/download/"
version_regex = 'curl-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://curl.se/download/curl-8.21.0.tar.xz"
sha256 = "aa1b66a70eace83dc624508745646c08ae561de512ab403adffb93ac87fc72e6"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--with-openssl",
    "--with-zlib",
    "--with-zstd",
    "--without-brotli",
    "--without-nghttp2",
    "--without-libpsl",
    "--without-libidn2"
]
