schema_version = 1

[package]
name = "curl"
version = "8.21.0"
release = "1"
description = "curl command-line URL transfer tool"
license = "curl"
channel = "system"
arch = "aarch64"

[source]
url = "https://curl.se/download/curl-8.21.0.tar.xz"
sha256 = "aa1b66a70eace83dc624508745646c08ae561de512ab403adffb93ac87fc72e6"

dependencies = [
    "curl-libs >= 8.21.0"
]

build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "zstd-dev >= 1.5.7",
    "pkgconf >= 3.0.5"
]

provides = [
    "curl"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --with-openssl --with-zlib --with-zstd --without-brotli --without-nghttp2 --without-libpsl --without-libidn2",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib $DESTDIR/usr/lib64 2>/dev/null || true"
]
