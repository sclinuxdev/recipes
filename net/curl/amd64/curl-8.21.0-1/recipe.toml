schema_version = 2

[package]
name = "curl"
version = "8.21.0"
release = "1"
description = "curl command-line URL transfer tool"
license = "curl"
channel = "system"
arch = "amd64"
dependencies = [
    "curl-libs >= 8.21.0"
]
build_dependencies = [
    "openssl-dev >= 4.0.1",
    "zlib-dev >= 1.3.2",
    "zstd-dev >= 1.5.7",
    "pkgconf >= 3.0.5"
]
provides = [
    "curl"
]

[upstream]
url = "https://curl.se/download/"
version_regex = 'curl-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://curl.se/download/curl-8.21.0.tar.xz"
sha256 = "aa1b66a70eace83dc624508745646c08ae561de512ab403adffb93ac87fc72e6"

[build]
system = "autotools"
payload = "outputs"
install_targets = ["install"]
configure_options = [
    "--disable-static",
    "--with-openssl",
    "--with-zlib",
    "--with-zstd",
    "--without-brotli",
    "--without-nghttp2",
    "--without-libpsl",
    "--without-libidn2",
]

[[build.outputs]]
name = "curl"
description = "curl command-line URL transfer tool"
license = "curl"
dependencies = [
    "curl-libs >= 8.21.0"
]
provides = [
    "curl"
]
install_files = [
    "usr/bin/**",
    "usr/share/doc/**",
    "usr/share/man/man1/**",
]
optional_excludes = [
    "usr/share/doc/**",
]

[[build.outputs]]
name = "curl-libs"
description = "libcurl shared runtime library"
license = "curl"
dependencies = [
    "openssl-libs >= 4.0.1",
    "zlib >= 1.3.2",
    "zstd-libs >= 1.5.7"
]
provides = [
    "curl-libs",
    "so:libcurl.so.4"
]
install_files = [
    "usr/lib/*.so.*",
]

[[build.outputs]]
name = "curl-dev"
description = "libcurl headers, pkg-config and linker symlink"
license = "curl"
dependencies = [
    "curl-libs >= 8.21.0"
]
provides = [
    "curl-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
