schema_version = 2

[package]
name = "inetutils"
version = "2.8"
release = "1"
description = "Basic networking utilities (ping, ifconfig, ftp, ...)"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "readline >= 8.3",
    "libxcrypt >= 4.5.2",
]
build_dependencies = [
    "ncurses-dev >= 6.6",
    "readline-dev >= 8.3",
    "libxcrypt-dev >= 4.5.2"
]
provides = [
    "inetutils"
]

[upstream]
url = "https://ftp.gnu.org/gnu/inetutils/"
version_regex = 'inetutils-([0-9][0-9.]*)\.tar'

[source]
url = "https://ftpmirror.gnu.org/inetutils/inetutils-2.8.tar.gz"
sha256 = "57b3cf4f77555992881e5ba2a09a63b05aa2c56342a60ed4305b5f45938390b5"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--bindir=/usr/bin",
    "--sbindir=/usr/bin",
    "--localstatedir=/var",
    "--disable-hostname",
    "--disable-logger",
    "--disable-whois",
    "--disable-rcp",
    "--disable-rexec",
    "--disable-rlogin",
    "--disable-rsh",
    "--disable-servers",
    "--disable-telnet"
]
