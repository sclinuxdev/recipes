schema_version = 1

[package]
name = "inetutils"
version = "2.8"
release = 1
epoch = 0
description = "Collection of common network programs (ping, traceroute, hostname, ifconfig)"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libcap-libs >= 2.78-1",
    "ncurses-libs >= 6.6-1",
]

provides = ["inetutils"]

[source]
url = "https://ftpmirror.gnu.org/inetutils/inetutils-2.8.tar.gz"
sha256 = "57b3cf4f77555992881e5ba2a09a63b05aa2c56342a60ed4305b5f45938390b5"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--disable-servers --disable-rsh --disable-rlogin --disable-rcp --disable-rexec --disable-nls"

[build.payload]
default = "remaining"
