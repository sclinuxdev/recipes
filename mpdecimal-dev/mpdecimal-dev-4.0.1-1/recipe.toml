schema_version = 1

[package]
name = "mpdecimal-dev"
version = "4.0.1"
release = "1"
description = "mpdecimal headers, pkg-config and linker symlink"
license = "BSD-2-Clause"
channel = "system"

[source]
url = "https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.1.tar.gz"
sha256 = "96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8"

dependencies = [
    "mpdecimal >= 4.0.1"
]

provides = [
    "mpdecimal-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
