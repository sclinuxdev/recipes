schema_version = 1

[package]
name = "gzip"
version = "1.14"
release = "2"
description = "GNU gzip compression utilities"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/gzip/gzip-1.14.tar.xz"
sha256 = "01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6"

dependencies = [
    "glibc >= 2.44",
]

build_dependencies = []

provides = [
    "gzip"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-nls",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
