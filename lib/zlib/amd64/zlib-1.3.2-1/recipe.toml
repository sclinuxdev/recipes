schema_version = 2

[package]
name = "zlib"
version = "1.3.2"
release = "1"
description = "zlib compression runtime library"
license = "Zlib"
channel = "system"
arch = "amd64"
dependencies = []
provides = [
    "zlib",
    "so:libz.so.1"
]

[upstream]
url = "https://zlib.net/"
version_regex = 'zlib-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://zlib.net/zlib-1.3.2.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

[build]
system = "autotools"
payload = "outputs"
install_targets = ["install"]

[[build.outputs]]
name = "zlib"
description = "zlib compression runtime library"
license = "Zlib"
dependencies = []
provides = [
    "zlib",
    "so:libz.so.1"
]
install_files = [
    "usr/lib/*.so.*",
    "usr/share/man/man3/**",
]
optional_excludes = [
    "usr/share/man/man3/**",
]

[[build.outputs]]
name = "zlib-dev"
description = "zlib headers, pkg-config and linker symlink"
license = "Zlib"
dependencies = [
    "zlib >= 1.3.2"
]
provides = [
    "zlib-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
