schema_version = 2

[package]
name = "xz-libs"
version = "5.8.3"
release = "1"
description = "liblzma shared runtime library"
license = "0BSD AND LGPL-2.1-or-later AND GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
]
provides = [
    "xz-libs",
    "so:liblzma.so.5"
]

[upstream]
url = "https://github.com/tukaani-project/xz/tags"
version_regex = 'v([0-9]+\.[0-9.]+)'

[source]
url = "https://tukaani.org/xz/xz-5.8.3.tar.xz"
sha256 = "fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/lib/*.so.*",
]
configure_options = [
    "--disable-static",
    "--disable-xz",
    "--disable-xzdec",
    "--disable-lzmadec",
    "--disable-lzmainfo",
    "--disable-lzma-links",
    "--disable-scripts",
    "--disable-doc"
]
