schema_version = 2

[package]
name = "libaio"
version = "0.3.113"
release = "1"
description = "Linux native asynchronous I/O library"
license = "LGPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
]
build_dependencies = [
    "glibc-dev >= 2.44"
]
provides = [
    "libaio",
    "so:libaio.so.1"
]

[upstream]
url = "https://pagure.io/libaio/tags"
version_regex = 'libaio-([0-9]+\.[0-9.]+)'

[source]
url = "https://sources.buildroot.net/libaio/libaio-0.3.113.tar.gz"
sha256 = "2c44d1c5fd0d43752287c9ae1eb9c023f04ef848ea8d4aafa46e9aedb678200b"

[build]
system = "make"
payload = "allowlist"
install_files = ["**"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
build_targets = ["all"]
install_targets = ["install"]
