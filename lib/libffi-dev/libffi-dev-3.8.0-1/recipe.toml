schema_version = 1

[package]
name = "libffi-dev"
version = "3.8.0"
release = "1"
description = "libffi headers, pkg-config and linker symlink"
license = "MIT"
channel = "system"

[source]
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"

dependencies = [
    "libffi >= 3.8.0"
]

provides = [
    "libffi-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --with-gcc-arch=native",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
