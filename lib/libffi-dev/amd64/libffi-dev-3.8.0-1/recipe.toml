schema_version = 2

[package]
name = "libffi-dev"
version = "3.8.0"
release = "1"
description = "libffi headers, pkg-config and linker symlink"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "libffi >= 3.8.0"
]
provides = [
    "libffi-dev"
]

[upstream]
url = "https://github.com/libffi/libffi/tags"
version_regex = 'v(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"
sha256 = "7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
]
