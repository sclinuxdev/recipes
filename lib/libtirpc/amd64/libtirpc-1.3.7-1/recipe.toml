schema_version = 1

[package]
name = "libtirpc"
version = "1.3.7"
release = 1
epoch = 0
description = "Transport-independent RPC library"
license = "BSD-3-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libtirpc-libs >= 1.3.7-1",
]

provides = [
    "libtirpc",
]

[source]
url = "https://sourceforge.net/projects/libtirpc/files/libtirpc/1.3.7/libtirpc-1.3.7.tar.bz2/download"
sha256 = "b47d3ac19d3549e54a05d0019a6c400674da716123858cfdb6d3bdd70a66c702"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--disable-static --disable-gssapi"

[build.payload]
default = "remaining"

[[subpackages]]
name = "libtirpc-libs"
description = "Transport-independent RPC runtime shared library"
license = "BSD-3-Clause"
dependencies = [
    "virtual/libc",
]
provides = [
    "libtirpc-libs",
    "so:libtirpc.so.3",
]

[subpackages.payload]
files = [
    "usr/lib/*.so.*",
    "usr/lib64/*.so.*",
]

[[subpackages]]
name = "libtirpc-dev"
description = "Transport-independent RPC headers and linker metadata"
license = "BSD-3-Clause"
dependencies = [
    "libtirpc-libs >= 1.3.7-1",
]
provides = [
    "libtirpc-dev",
]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib64/*.a",
    "usr/lib64/*.so",
    "usr/lib64/pkgconfig/**",
]
