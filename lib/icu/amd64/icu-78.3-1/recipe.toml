# icu: tarball unpacks to icu/source, hence source_subdir.
schema_version = 2

[package]
name = "icu"
version = "78.3"
release = "1"
description = "International Components for Unicode command line tools"
license = "ICU"
channel = "system"
arch = "amd64"
dependencies = [
    "icu-libs = 78.3-4"
]
build_dependencies = [
    "gcc >= 15",
    "glibc-dev >= 2.44",
    "python >= 3.14.7"
]
provides = [
    "icu"
]

[upstream]
url = "https://github.com/unicode-org/icu/tags"
version_regex = 'release-([0-9.]+)'

[source]
url = "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz"
sha256 = "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0"

[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
source_subdir = "source"
configure_options = [
    "--bindir=/usr/bin",
    "--sbindir=/usr/bin",
    "--sysconfdir=/etc",
    "--disable-samples",
    "--disable-tests",
    "--enable-static=no"
]
