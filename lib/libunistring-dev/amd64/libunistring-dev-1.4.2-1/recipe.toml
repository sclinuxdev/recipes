schema_version = 2

[package]
name = "libunistring-dev"
version = "1.4.2"
release = "1"
description = "libunistring headers and linker symlink"
license = "LGPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "libunistring >= 1.4.2"
]
build_dependencies = [
    "glibc-dev >= 2.44"
]
provides = [
    "libunistring-dev"
]

[upstream]
url = "https://ftp.gnu.org/gnu/libunistring/"
version_regex = 'libunistring-([0-9][0-9.]*)\.tar'

[source]
url = "https://ftp.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz"
sha256 = "5b46e74377ed7409c5b75e7a96f95377b095623b689d8522620927964a41499c"

[build]
system = "autotools"
configure_options = [
    "--libdir=/usr/lib",
    "--disable-static"
]
