schema_version = 1

[package]
name = "libarchive"
version = "3.8.9"
release = 1
epoch = 0
description = "Multi-format archive and compression library tools (bsdtar, bsdcpio)"
license = "BSD-2-Clause AND BSD-3-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libarchive-libs >= 3.8.9-1",
]

provides = ["libarchive"]

[source]
url = "https://github.com/libarchive/libarchive/releases/download/v3.8.9/libarchive-3.8.9.tar.xz"
sha256 = "888c934f9d95648ecb9163dc8e23ab80a476ecb81a8f1154704a227b5b676dde"

[build]
inherit = ["cmake"]

[build.args]
cmake_args = "-DENABLE_TEST=OFF -DENABLE_TAR=ON -DENABLE_CPIO=ON -DENABLE_ZLIB=ON -DENABLE_ZSTD=ON -DENABLE_LZMA=ON -DENABLE_BZip2=ON -DENABLE_OPENSSL=ON"

[build.payload]
default = "remaining"

[[subpackages]]
name = "libarchive-libs"
description = "libarchive runtime shared library (libarchive.so.*)"
license = "BSD-2-Clause"
dependencies = [
    "virtual/libc",
    "zlib-libs >= 1.3.2-1",
    "zstd-libs >= 1.5.7-1",
    "xz-libs >= 5.8.3-1",
    "bzip2-libs >= 1.0.8-1",
    "openssl-libs >= 4.0.1-1",
]
provides = ["libarchive-libs", "so:libarchive.so.13"]

[subpackages.payload]
files = [
    "usr/lib/*.so.*",
]

[[subpackages]]
name = "libarchive-dev"
description = "libarchive headers, pkgconfig and linker symbols"
license = "BSD-2-Clause"
dependencies = [
    "libarchive-libs >= 3.8.9-1",
    "zlib-dev >= 1.3.2-1",
    "zstd-dev >= 1.5.7-1",
]
provides = ["libarchive-dev"]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/man/man3/**",
]
