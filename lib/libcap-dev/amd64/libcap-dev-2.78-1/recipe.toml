schema_version = 2

[package]
name = "libcap-dev"
version = "2.78"
release = "1"
description = "libcap headers, pkg-config and linker symlink"
license = "BSD-3-Clause"
channel = "system"
arch = "amd64"
dependencies = [
    "libcap-libs >= 2.78"
]
provides = [
    "libcap-dev"
]

[upstream]
url = "https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/"
version_regex = 'libcap-dev-v?([0-9][0-9.]*)\.tar'

[source]
url = "https://cdn.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.78.tar.xz"
sha256 = "0d621e562fd932ccf67b9660fb018e468a683d7b827541df27813228c996bb11"

[build]
system = "make"
build_targets = ["all"]
install_targets = ["install"]

[build.variables]
lib = "lib"
PAM_CAP = "no"
GOLANG = "no"
RAISE_SETFCAP = "no"
