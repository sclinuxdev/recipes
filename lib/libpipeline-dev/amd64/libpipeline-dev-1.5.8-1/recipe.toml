schema_version = 2

[package]
name = "libpipeline-dev"
version = "1.5.8"
release = "1"
description = "libpipeline headers, pkg-config and linker symlink"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "libpipeline >= 1.5.8"
]

provides = [
    "libpipeline-dev"
]

[upstream]
url = "https://download.savannah.gnu.org/releases/libpipeline/"
version_regex = 'libpipeline-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://deb.debian.org/debian/pool/main/libp/libpipeline/libpipeline_1.5.8.orig.tar.gz"
sha256 = "1b1203ca152ccd63983c3f2112f7fe6fa5afd453218ede5153d1b31e11bb8405"

[build]
system = "autotools"
configure_options = [
    "--disable-static"
]
