# libunistring -- Unicode 字符串库。
#
# 从 sclinux 的 Stage1 迁入。当初补进 Stage1 是因为 gettext-dev 误链了宿主的
# libunistring —— 仓库里缺一个提供 so:libunistring.so.5 的包。
#
# install 删掉 usr/share/info/dir：那是所有 info 包共写的索引，留着会与其他包
# 争夺同一个文件的归属。

schema_version = 1

[package]
name = "libunistring"
version = "1.4.2"
release = "1"
description = "Unicode string library"
license = "LGPL-3.0-or-later"
channel = "system"
arch = "aarch64"

[source]
url = "https://ftp.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz"
sha256 = "5b46e74377ed7409c5b75e7a96f95377b095623b689d8522620927964a41499c"

dependencies = [
]

build_dependencies = [
    "glibc-dev >= 2.44"
]

provides = [
    "libunistring",
    "so:libunistring.so.5"
]

prepare = []

build = [
    "./configure --prefix=/usr --libdir=/usr/lib --disable-static",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -f $DESTDIR/usr/share/info/dir",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/share $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib/cmake 2>/dev/null || true",
    "find $DESTDIR/usr/lib -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib \\( -type l -o -type f \\) -name '*.so' ! -name '*.so.*' -delete 2>/dev/null || true"
]
