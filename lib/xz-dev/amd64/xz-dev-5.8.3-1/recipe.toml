schema_version = 2

[package]
name = "xz-dev"
version = "5.8.3"
release = "1"
description = "liblzma headers, pkg-config and linker symlink"
license = "0BSD AND LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "xz-libs >= 5.8.3"
]
provides = [
    "xz-dev"
]

[upstream]
url = "https://github.com/tukaani-project/xz/tags"
version_regex = 'v([0-9]+\.[0-9.]+)'

[source]
url = "https://tukaani.org/xz/xz-5.8.3.tar.xz"
sha256 = "fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6"

[build]
system = "autotools"
payload = "allowlist"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
]
