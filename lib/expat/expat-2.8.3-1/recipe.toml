schema_version = 1

[package]
name = "expat"
version = "2.8.3"
release = "1"
description = "xmlwf XML well-formedness checker"
license = "MIT"
channel = "system"

[source]
url = "https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.xz"
sha256 = "f6256df90c906773d344da084402b7d3e4f22ed41b1a59c989098a83d3ea0c85"

dependencies = [
    "expat-libs >= 2.8.3"
]

provides = [
    "expat"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib $DESTDIR/usr/lib64 2>/dev/null || true"
]
