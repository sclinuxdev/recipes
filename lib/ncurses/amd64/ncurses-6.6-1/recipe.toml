schema_version = 2

[package]
name = "ncurses"
version = "6.6"
release = "1"
description = "ncurses terminal programs (clear, tic, infocmp, tput, toe, tabs)"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "ncurses-libs >= 6.6"
]
provides = [
    "ncurses"
]

[upstream]
url = "https://invisible-island.net/archives/ncurses/"
version_regex = 'ncurses-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://invisible-island.net/archives/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[build]
system = "autotools"
payload = "outputs"
install_targets = ["install"]
configure_options = [
    "--mandir=/usr/share/man",
    "--with-shared",
    "--without-debug",
    "--without-ada",
    "--enable-widec",
    "--enable-pc-files",
    "--with-pkg-config-libdir=/usr/lib/pkgconfig",
]

[[build.outputs]]
name = "ncurses"
description = "ncurses terminal programs (clear, tic, infocmp, tput, toe, tabs)"
license = "MIT"
dependencies = [
    "ncurses-libs >= 6.6"
]
provides = [
    "ncurses"
]
install_files = [
    "usr/bin/**",
    "usr/share/doc/**",
    "usr/share/man/man1/**",
    "usr/share/man/man5/**",
    "usr/share/man/man7/**",
    "usr/share/tabset/**",
]
optional_excludes = [
    "usr/share/doc/**",
    "usr/share/man/man5/**",
    "usr/share/man/man7/**",
    "usr/share/tabset/**",
]

[[build.outputs]]
name = "ncurses-libs"
description = "ncurses widechar shared runtime libraries"
license = "MIT"
dependencies = []
provides = [
    "ncurses-libs",
    "so:libncursesw.so.6",
    "so:libncurses.so.6",
    "so:libtinfo.so.6",
    "so:libtinfow.so.6",
    "so:libformw.so.6",
    "so:libmenuw.so.6",
    "so:libpanelw.so.6"
]
install_files = [
    "usr/lib/*.so.*",
    "usr/share/terminfo/**",
]
optional_excludes = [
    "usr/share/terminfo/**",
]

[[build.outputs]]
name = "ncurses-dev"
description = "ncurses headers, pkg-config, linker scripts and unversioned .so"
license = "MIT"
dependencies = [
    "ncurses-libs >= 6.6"
]
provides = [
    "ncurses-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
