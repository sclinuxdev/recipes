schema_version = 2

[package]
name = "userspace-rcu"
version = "0.15.6"
release = "1"
description = "Userspace RCU runtime libraries"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
dependencies = []
provides = [
    "userspace-rcu",
    "so:liburcu.so.8"
]

[upstream]
url = "https://lttng.org/files/urcu/"
version_regex = 'userspace-rcu-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://lttng.org/files/urcu/userspace-rcu-0.15.6.tar.bz2"
sha256 = "850b192096eb11ebf2c70e8f97bc7da7479ee41da1bebeb44e3986908bac414f"

[build]
system = "autotools"
payload = "allowlist"
install_files = ["**"]
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
]
