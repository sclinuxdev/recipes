schema_version = 2

[package]
name = "ncurses-dev"
version = "6.6"
release = "1"
description = "ncurses headers, pkg-config, linker scripts and unversioned .so"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "ncurses-libs >= 6.6"
]
provides = [
    "ncurses-dev"
]

[upstream]
url = "https://invisible-island.net/archives/ncurses/"
version_regex = 'ncurses-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://invisible-island.net/archives/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[build]
system = "autotools"
payload = "allowlist"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--mandir=/usr/share/man",
    "--with-shared",
    "--without-debug",
    "--without-ada",
    "--enable-widec",
    "--enable-pc-files",
    "--with-pkg-config-libdir=/usr/lib/pkgconfig",
    "--with-progs",
    "--without-tests",
    "--without-manpages",
]
