schema_version = 2

[package]
name = "libelf-dev"
version = "0.196"
release = "1"
description = "libelf headers, pkg-config and linker symlink"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "libelf >= 0.196",
]

build_dependencies = [
    "zlib-dev >= 1.3.2",
    "pkgconf >= 3.0.5"
]

provides = [
    "libelf-dev"
]

[upstream]
url = "https://sourceware.org/elfutils/ftp/"
version_regex = '([0-9]+\.[0-9]+)/'

[source]
url = "https://sourceware.org/elfutils/ftp/0.196/elfutils-0.196.tar.bz2"
sha256 = "fd5cc6b77ad6773cac93cb3f415f9318ac3b3455eecf801f6b4a742c4f6c7209"

[build]
system = "autotools"
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-debuginfod",
    "--enable-libdebuginfod=dummy",
    "--disable-static"
]
install_targets = ["install-libs"]
