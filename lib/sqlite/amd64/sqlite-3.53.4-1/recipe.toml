schema_version = 2

[package]
name = "sqlite"
version = "3.53.4"
release = "1"
description = "SQLite command-line shell"
license = "blessing"
channel = "system"
arch = "amd64"
dependencies = [
    "sqlite-libs >= 3.53.4",
    "readline >= 8.3",
]
build_dependencies = [
    "zlib-dev >= 1.3.2",
    "readline-dev >= 8.3",
]
provides = [
    "sqlite"
]

[upstream]
url = "https://www.sqlite.org/download.html"
version_regex = 'sqlite-autoconf-(\d{7})\.tar'

[source]
url = "https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"

[build]
system = "autotools"
payload = "outputs"
install_targets = ["install"]
configure_options = [
    "--disable-static",
    "--enable-fts5",
]

[[build.outputs]]
name = "sqlite"
description = "SQLite command-line shell"
license = "blessing"
dependencies = [
    "sqlite-libs >= 3.53.4",
    "readline >= 8.3",
]
provides = [
    "sqlite"
]
install_files = [
    "usr/bin/**",
    "usr/share/man/man1/**",
    "usr/share/doc/**",
]
optional_excludes = [
    "usr/share/doc/**",
]

[[build.outputs]]
name = "sqlite-libs"
description = "libsqlite3 shared runtime library"
license = "blessing"
dependencies = [
    "zlib >= 1.3.2",
]
provides = [
    "sqlite-libs",
    "so:libsqlite3.so.0",
]
install_files = [
    "usr/lib/*.so.*",
]

[[build.outputs]]
name = "sqlite-dev"
description = "SQLite headers, pkg-config and linker symlink"
license = "blessing"
dependencies = [
    "sqlite-libs >= 3.53.4",
]
provides = [
    "sqlite-dev",
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
