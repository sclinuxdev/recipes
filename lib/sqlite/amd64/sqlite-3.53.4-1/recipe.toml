schema_version = 2

[package]
name = "sqlite"
version = "3.53.4"
release = "1"
description = "SQLite command-line shell"
license = "blessing"
channel = "system"
arch = "amd64"
dependencies = [
    "sqlite-libs >= 3.53.4",
    "readline >= 8.3",
]
provides = [
    "sqlite"
]

[upstream]
url = "https://www.sqlite.org/download.html"
version_regex = 'sqlite-autoconf-(\d{7})\.tar'

[source]
url = "https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"

[build]
system = "autotools"
configure_options = [
    "--disable-static",
    "--enable-fts5",
]
