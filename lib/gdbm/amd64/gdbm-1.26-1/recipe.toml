schema_version = 2

[package]
name = "gdbm"
version = "1.26"
release = "1"
description = "GNU dbm tools (gdbmtool, gdbm_dump, gdbm_load)"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "gdbm-libs >= 1.26",
    "readline >= 8.3",
]
provides = [
    "gdbm"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gdbm/"
version_regex = 'gdbm-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/gdbm/gdbm-1.26.tar.gz"
sha256 = "6a24504a14de4a744103dcb936be976df6fbe88ccff26065e54c1c47946f4a5e"

[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--enable-libgdbm-compat"
]
