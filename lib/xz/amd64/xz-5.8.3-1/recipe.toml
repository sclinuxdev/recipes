schema_version = 2

[package]
name = "xz"
version = "5.8.3"
release = "1"
description = "XZ-format compression utilities"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "xz-libs >= 5.8.3"
]
provides = [
    "xz"
]

[upstream]
url = "https://github.com/tukaani-project/xz/tags"
version_regex = 'v([0-9]+\.[0-9.]+)'

[source]
url = "https://tukaani.org/xz/xz-5.8.3.tar.xz"
sha256 = "fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6"

[build]
system = "autotools"
payload = "outputs"
install_targets = ["install"]
configure_options = [
    "--disable-static",
    "--docdir=/usr/share/doc/xz-5.8.3"
]

[[build.outputs]]
name = "xz"
description = "XZ-format compression utilities"
license = "GPL-2.0-or-later"
dependencies = [
    "xz-libs >= 5.8.3"
]
provides = [
    "xz"
]
install_files = [
    "usr/bin/**",
    "usr/share/doc/**",
    "usr/share/locale/**",
    "usr/share/man/man1/**",
]
optional_excludes = [
    "usr/share/doc/**",
    "usr/share/locale/**",
]

[[build.outputs]]
name = "xz-libs"
description = "liblzma shared runtime library"
license = "0BSD AND LGPL-2.1-or-later AND GPL-2.0-or-later"
dependencies = []
provides = [
    "xz-libs",
    "so:liblzma.so.5"
]
install_files = [
    "usr/lib/*.so.*",
]

[[build.outputs]]
name = "xz-dev"
description = "liblzma headers, pkg-config and linker symlink"
license = "0BSD AND LGPL-2.1-or-later"
dependencies = [
    "xz-libs >= 5.8.3"
]
provides = [
    "xz-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
