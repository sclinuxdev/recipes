schema_version = 2

[package]
name = "mpdecimal"
version = "4.0.1"
release = "1"
description = "libmpdec/libmpdec++ shared runtime libraries"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"
dependencies = [
    "gcc-libs >= 15.3.0"
]
provides = [
    "mpdecimal",
    "so:libmpdec.so.4",
    "so:libmpdec++.so.4"
]

[upstream]
url = "https://www.bytereef.org/software/mpdecimal/releases/"
version_regex = 'mpdecimal-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.1.tar.gz"
sha256 = "96d33abb4bb0070c7be0fed4246cd38416188325f820468214471938545b1ac8"

[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
