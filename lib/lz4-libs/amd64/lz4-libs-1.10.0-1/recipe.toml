schema_version = 2

[package]
name = "lz4-libs"
version = "1.10.0"
release = "1"
description = "liblz4 shared runtime library"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"
dependencies = [
]
provides = [
    "lz4-libs",
    "so:liblz4.so.1"
]

[upstream]
url = "https://github.com/lz4/lz4/tags"
version_regex = 'v(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

[build]
system = "make"
payload = "allowlist"
install_files = [
    "usr/lib/*.so.*",
]
source_subdir = "lib"
build_targets = ["all"]
install_targets = ["install"]
