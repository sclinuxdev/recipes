schema_version = 2

[package]
name = "attr"
version = "2.6.0"
release = "1"
description = "Extended attribute tools (getfattr, setfattr)"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "attr-libs >= 2.6.0"
]
provides = [
    "attr"
]

[upstream]
url = "https://download.savannah.gnu.org/releases/attr/"
version_regex = 'attr-([0-9][0-9.]*)\.tar'

[source]
url = "https://download-mirror.savannah.gnu.org/releases/attr/attr-2.6.0.tar.xz"
sha256 = "6c8a2148a7b85043b68492bce43316b0e2e214fc4e628c7ede078e76e216330b"

[build]
system = "autotools"
payload = "allowlist"
install_files = ["**"]
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--sysconfdir=/etc",
    "--docdir=/usr/share/doc/attr-2.6.0",
]
