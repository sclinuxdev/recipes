schema_version = 1

[package]
name = "popt"
version = "1.19"
release = 1
epoch = 0
description = "Command line option parsing library"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
]

provides = [
    "popt",
    "popt-libs",
    "so:libpopt.so.0",
]

[source]
url = "https://ftp.osuosl.org/pub/rpm/popt/releases/popt-1.x/popt-1.19.tar.gz"
sha256 = "c25a4838fc8e4c1c8aacb8bd620edb3084a3d63bf8987fdad3ca2758c63240f9"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--disable-static --disable-nls"

[build.payload]
default = "remaining"

[[subpackages]]
name = "popt-dev"
description = "popt development headers and pkgconfig files"
license = "MIT"
dependencies = [
    "popt >= 1.19-1",
]
provides = ["popt-dev"]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
]
