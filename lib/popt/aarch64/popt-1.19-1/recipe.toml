# popt -- 命令行选项解析库。
#
# 从 sclinux 的 Stage1 迁入。Stage1 是自举树，不拆 -dev；这里按本树惯例分成
# 运行库与开发文件两个包。efibootmgr 与 gptfdisk 都链接它。

schema_version = 1

[package]
name = "popt"
version = "1.19"
release = "1"
description = "Command-line option parser library"
license = "MIT"
channel = "system"
arch = "aarch64"

[source]
url = "https://ftp.osuosl.org/pub/rpm/popt/releases/popt-1.x/popt-1.19.tar.gz"
sha256 = "c25a4838fc8e4c1c8aacb8bd620edb3084a3d63bf8987fdad3ca2758c63240f9"

dependencies = [
]

build_dependencies = [
    "glibc-dev >= 2.44"
]

provides = [
    "popt",
    "so:libpopt.so.0"
]

prepare = []

build = [
    "./configure --prefix=/usr --libdir=/usr/lib --disable-static",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/share $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib/cmake 2>/dev/null || true",
    "find $DESTDIR/usr/lib -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib \\( -type l -o -type f \\) -name '*.so' ! -name '*.so.*' -delete 2>/dev/null || true"
]
