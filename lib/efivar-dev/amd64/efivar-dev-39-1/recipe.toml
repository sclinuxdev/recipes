schema_version = 2

[package]
name = "efivar-dev"
version = "39"
release = "1"
description = "efivar headers, pkg-config and linker symlinks"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "efivar-libs >= 39"
]

build_dependencies = [
    "glibc-dev >= 2.44"
]

provides = [
    "efivar-dev"
]

[upstream]
url = "https://github.com/rhboot/efivar/tags"
version_regex = '^(\d+)/'

[source]
url = "https://github.com/rhboot/efivar/archive/refs/tags/39.tar.gz"
sha256 = "c9edd15f2eeeea63232f3e669a48e992c7be9aff57ee22672ac31f5eca1609a6"

[build]
system = "make"
payload = "allowlist"
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
build_targets = ["all"]
install_targets = ["install"]

[build.variables]
ERRORS = ""
ENABLE_DOCS = "0"
