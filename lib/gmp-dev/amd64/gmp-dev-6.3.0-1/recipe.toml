schema_version = 2

[package]
name = "gmp-dev"
version = "6.3.0"
release = "1"
description = "GNU MP headers, pkg-config and linker symlink"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "gmp >= 6.3.0"
]
provides = [
    "gmp-dev"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gmp/"
version_regex = 'gmp-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--enable-cxx",
    "--disable-static",
]
