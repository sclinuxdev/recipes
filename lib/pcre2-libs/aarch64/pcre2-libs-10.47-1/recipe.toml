schema_version = 1

[package]
name = "pcre2-libs"
version = "10.47"
release = "1"
description = "libpcre2-8/16/32 and libpcre2-posix runtime libraries"
license = "BSD-3-Clause"
channel = "system"
arch = "aarch64"

[source]
url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2"
sha256 = "47fe8c99461250d42f89e6e8fdaeba9da057855d06eb7fc08d9ca03fd08d7bc7"

# No zlib/bzip2 here: compressed-input support lives in pcre2grep only, and
# this build disables both pcre2grep and pcre2test. The libraries themselves
# are dependency-free.
dependencies = []

build_dependencies = []

provides = [
    "pcre2-libs",
    "so:libpcre2-8.so.0",
    "so:libpcre2-16.so.0",
    "so:libpcre2-32.so.0",
    "so:libpcre2-posix.so.3"
]

prepare = []

build = [
    "./configure --prefix=/usr --enable-pcre2-16 --enable-pcre2-32 --enable-jit --disable-static --disable-pcre2grep --disable-pcre2test",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib/cmake 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 \\( -type l -o -type f \\) -name '*.so' ! -name '*.so.*' -delete 2>/dev/null || true"
]
