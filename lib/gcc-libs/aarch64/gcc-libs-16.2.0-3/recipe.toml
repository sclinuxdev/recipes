schema_version = 1

[package]
name = "gcc-libs"
version = "16.2.0"
release = "3"
description = "GCC runtime libraries (libstdc++, libgcc_s, libatomic, libgomp)"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
channel = "system"
arch = "aarch64"

dependencies = []

build_dependencies = [
    "gcc >= 16.0",
    "gmp-dev >= 6.3.0",
    "mpfr-dev >= 4.2.2",
    "mpc-dev >= 1.4.1",
    "isl-dev >= 0.27",
    "zstd-dev >= 1.5.7",
    "zlib-dev >= 1.3.2"
]

provides = [
    "gcc-libs",
    "so:libstdc++.so.6",
    "so:libgcc_s.so.1",
    "so:libatomic.so.1",
    "so:libgomp.so.1"
]

[build]
cc = "gcc"
cxx = "g++"
prepare = [
    "rm -rf build && mkdir -p build"
]

build = [
    "cd build && CPPFLAGS=-I/usr/include LDFLAGS=-L/usr/lib ../configure --prefix=/opt/channels/gcc/16 --enable-languages=c,c++ --enable-default-pie --enable-default-ssp --disable-multilib --disable-bootstrap --disable-fixincludes --disable-nls --with-system-zlib --with-isl=/usr",
    "cd build && make all-gcc all-target-libgcc all-target-libstdc++-v3 all-target-libatomic all-target-libgomp"
]

install = [
    "cd build && make install-target-libgcc install-target-libstdc++-v3 install-target-libatomic install-target-libgomp DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/lib",
    "cp -a $DESTDIR/opt/channels/gcc/16/lib64/libstdc++.so* $DESTDIR/opt/channels/gcc/16/lib64/libgcc_s.so* $DESTDIR/usr/lib/",
    "cp -a $DESTDIR/opt/channels/gcc/16/lib64/libatomic.so* $DESTDIR/opt/channels/gcc/16/lib64/libgomp.so* $DESTDIR/usr/lib/",
    "rm -f $DESTDIR/usr/lib/libstdc++.so $DESTDIR/usr/lib/libgcc_s.so $DESTDIR/usr/lib/libatomic.so $DESTDIR/usr/lib/libgomp.so $DESTDIR/usr/lib/libstdc++.so.*-gdb.py",
    "rm -rf $DESTDIR/opt",
    "test -e $DESTDIR/usr/lib/libstdc++.so.6 && test -e $DESTDIR/usr/lib/libgcc_s.so.1 || { echo 'ERROR: GCC runtime payload incomplete' >&2; exit 1; }",
    "test ! -e $DESTDIR/usr/lib/libstdc++.so && test ! -e $DESTDIR/usr/lib/libgcc_s.so && test ! -e $DESTDIR/usr/lib/libatomic.so && test ! -e $DESTDIR/usr/lib/libgomp.so && test -z \"$(find $DESTDIR/usr/lib -maxdepth 1 -name 'libstdc++.so.*-gdb.py' -print -quit)\" || { echo 'ERROR: development files leaked into gcc-libs' >&2; exit 1; }"
]

[source]
url = "https://mirrors.kernel.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
