schema_version = 2

[package]
name = "gcc-libs"
version = "16.2.0"
release = "1"
description = "GCC runtime libraries (libstdc++, libgcc_s, libatomic, libgomp)"
license = "GPL-3.0-or-later WITH GCC-exception-3.1"
channel = "system"
arch = "amd64"
dependencies = []
build_dependencies = [
    "gcc >= 16.0",
    "gmp-dev >= 6.3.0",
    "mpfr-dev >= 4.2.2",
    "mpc-dev >= 1.4.1",
    "isl-dev >= 0.27",
    "zstd-dev >= 1.5.7",
    "zlib-dev >= 1.3.2"
]
provides = [
    "gcc-libs",
    "so:libstdc++.so.6",
    "so:libgcc_s.so.1",
    "so:libatomic.so.1"
]

[upstream]
url = "https://ftp.gnu.org/gnu/gcc/"
version_regex = 'gcc-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"

# core system software: pinned to gcc (v2 package default)
[build]
system = "autotools"
payload = "allowlist"
install_files = [
    "usr/lib64/*.so*",
]
configure_options = [
    "--enable-languages=c,c++",
    "--enable-default-pie",
    "--enable-default-ssp",
    "--disable-multilib",
    "--disable-bootstrap",
    "--disable-fixincludes",
    "--disable-nls",
    "--disable-libgomp",
    "--disable-libssp",
    "--disable-libquadmath",
    "--disable-libstdcxx-pch",
    "--with-gxx-include-dir=/usr/include/c++/16.2.0",
    "--with-build-sysroot=/",
    "--with-sysroot=/",
    "--with-system-zlib",
    "--with-isl=/usr",
    "CC_FOR_TARGET=/opt/channels/gcc/16/bin/gcc",
    "CXX_FOR_TARGET=/opt/channels/gcc/16/bin/g++",
    "GCC_FOR_TARGET=/opt/channels/gcc/16/bin/gcc",
    "CFLAGS_FOR_TARGET=-O2 -march=x86-64-v3",
    "CXXFLAGS_FOR_TARGET=-O2 -march=x86-64-v3",
    "LDFLAGS_FOR_TARGET=-Wl,--as-needed -fuse-ld=bfd",
    "lt_cv_shlibpath_overrides_runpath=no",
]
build_targets = [
    "all-target-libgcc",
    "all-target-libstdc++-v3",
    "all-target-libatomic",
]
install_targets = [
    "install-target-libgcc",
    "install-target-libstdc++-v3",
    "install-target-libatomic",
]

[build.toolchain.compiler]
family = "gcc"
package = "gcc"
minimum_version = "15.1"

[build.toolchain.linker]
family = "ld"
package = "binutils"
minimum_version = "2.40"
