schema_version = 2

[package]
name = "bzip2-libs"
version = "1.0.8"
release = "1"
description = "libbz2 shared runtime library"
license = "bzip2-1.0.6"
channel = "system"
arch = "amd64"
dependencies = []
provides = [
    "bzip2-libs",
    "so:libbz2.so.1",
    "so:libbz2.so.1.0"
]

[upstream]
url = "https://sourceware.org/pub/bzip2/"
version_regex = 'bzip2-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"

[build]
system = "make"
payload = "allowlist"
install_files = [
    "usr/lib/libbz2.so.1.0.8",
    "usr/lib/libbz2.so.1.0",
]
build_targets = ["-f", "Makefile-libbz2_so"]
install_targets = ["install"]
install_copies = [
    { from = "libbz2.so.1.0.8", to = "usr/lib/libbz2.so.1.0.8" },
]
install_symlinks = [
    { path = "usr/lib/libbz2.so.1.0", target = "libbz2.so.1.0.8" },
]
