schema_version = 2

[package]
name = "tomlplusplus-dev"
version = "3.4.0"
release = "1"
description = "toml++ headers, pkg-config and linker symlink"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "tomlplusplus >= 3.4.0"
]
provides = [
    "tomlplusplus-dev"
]

[upstream]
url = "https://github.com/marzer/tomlplusplus/tags"
version_regex = 'v?([0-9][0-9.]*)'

[source]
url = "https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz"
sha256 = "8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155"

[build]
system = "cmake"
configure_options = [
    "-DTOML_SHARED_LIB=ON"
]
