schema_version = 2

[package]
name = "tomlplusplus-dev"
version = "3.4.0"
release = "1"
description = "toml++ header-only C++ library and CMake package"
license = "MIT"
channel = "system"
arch = "amd64"
provides = [
    "tomlplusplus-dev"
]

[upstream]
url = "https://github.com/marzer/tomlplusplus/tags"
version_regex = 'v?([0-9][0-9.]*)'

[source]
url = "https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz"
sha256 = "8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155"

[build]
system = "cmake"
payload = "allowlist"
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
