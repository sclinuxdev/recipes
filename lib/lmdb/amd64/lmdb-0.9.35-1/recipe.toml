schema_version = 2

[package]
name = "lmdb"
version = "0.9.35"
release = "1"
description = "LMDB runtime library and tools (mdb_stat, mdb_copy, mdb_dump, mdb_load)"
license = "OpenLDAP"
channel = "system"
arch = "amd64"
dependencies = [
]
provides = [
    "lmdb",
    "so:liblmdb.so"
]

[upstream]
url = "https://github.com/LMDB/lmdb/tags"
version_regex = 'LMDB_([0-9.]+)'

[source]
url = "https://github.com/LMDB/lmdb/archive/refs/tags/LMDB_0.9.35.tar.gz"
sha256 = "18b021fd589d30cc08860a9550a30ae51637117451385e9581616da751326632"

[build]
system = "make"
payload = "allowlist"
install_files = ["**"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
source_subdir = "libraries/liblmdb"
build_targets = ["all"]
install_targets = ["install"]
