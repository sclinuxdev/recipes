schema_version = 2

[package]
name = "libarchive-dev"
version = "3.8.9"
release = "1"
description = "libarchive headers, pkg-config and linker symlink"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"
dependencies = [
    "libarchive-libs >= 3.8.9",
]
build_dependencies = [
    "pkgconf >= 3.0.5"
]
provides = [
    "libarchive-dev"
]

[upstream]
url = "https://github.com/libarchive/libarchive/tags"
version_regex = 'v([0-9][0-9.]*)'

[source]
url = "https://github.com/libarchive/libarchive/releases/download/v3.8.9/libarchive-3.8.9.tar.xz"
sha256 = "888c934f9d95648ecb9163dc8e23ab80a476ecb81a8f1154704a227b5b676dde"

[build]
system = "autotools"
payload = "allowlist"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--without-xml2",
    "--with-expat",
    "--without-cng",
    "--with-openssl",
    "--with-zlib",
    "--with-bz2lib",
    "--with-lzma",
    "--with-zstd"
]
