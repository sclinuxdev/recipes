schema_version = 2

[package]
name = "attr-libs"
version = "2.6.0"
release = "1"
description = "libattr shared runtime library"
license = "LGPL-2.1-or-later"
channel = "system"
arch = "amd64"
dependencies = []
provides = [
    "attr-libs",
    "so:libattr.so.1"
]

[upstream]
url = "https://download.savannah.gnu.org/releases/attr/"
version_regex = 'attr-([0-9][0-9.]*)\.tar'

[source]
url = "https://download-mirror.savannah.gnu.org/releases/attr/attr-2.6.0.tar.xz"
sha256 = "6c8a2148a7b85043b68492bce43316b0e2e214fc4e628c7ede078e76e216330b"

[build]
system = "autotools"
configure_options = [
    "--disable-static",
    "--sysconfdir=/etc",
]
