schema_version = 2

[package]
name = "mpc"
version = "1.4.1"
release = "1"
description = "MPC runtime library"
license = "LGPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "gmp >= 6.3.0",
    "mpfr >= 4.2.2"
]

provides = [
    "mpc",
    "so:libmpc.so.3"
]

[upstream]
url = "https://ftp.gnu.org/gnu/mpc/"
version_regex = 'mpc-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/mpc/mpc-1.4.1.tar.xz"
sha256 = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"

[build]
system = "autotools"
payload = "allowlist"
install_files = ["**"]
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static"
]
