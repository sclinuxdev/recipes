schema_version = 2

[package]
name = "acl"
version = "2.4.0"
release = "1"
description = "Access Control List tools (getfacl, setfacl)"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "acl-libs >= 2.4.0",
    "attr-libs >= 2.6.0"
]
provides = [
    "acl"
]

[upstream]
url = "https://download.savannah.gnu.org/releases/acl/"
version_regex = 'acl-([0-9][0-9.]*)\.tar'

[source]
url = "https://download-mirror.savannah.gnu.org/releases/acl/acl-2.4.0.tar.xz"
sha256 = "e661131456d2708a01c614a0f400e11d7d1bfaeb6f3e74b75bb980b72f0161a3"

[build]
system = "autotools"
configure_options = [
    "--disable-static",
    "--sysconfdir=/etc",
    "--docdir=/usr/share/doc/acl-2.4.0"
]
