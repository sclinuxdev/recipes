schema_version = 1

[package]
name = "mpfr-dev"
version = "4.2.2"
release = "1"
description = "MPFR headers, pkg-config and linker symlink"
license = "LGPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/mpfr/mpfr-4.2.2.tar.xz"
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"

dependencies = [
    "mpfr >= 4.2.2",
    "gmp-dev >= 6.3.0"
]

provides = [
    "mpfr-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --enable-thread-safe",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
