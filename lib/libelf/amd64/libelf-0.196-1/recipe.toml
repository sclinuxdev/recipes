schema_version = 2

[package]
name = "libelf"
version = "0.196"
release = "1"
description = "libelf shared runtime library (from elfutils)"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "zlib >= 1.3.2",
    "xz-libs >= 5.8.3",
    "zstd-libs >= 1.5.7",
    "bzip2-libs >= 1.0.8"
]
build_dependencies = [
    "zlib-dev >= 1.3.2",
    "xz-dev >= 5.8.3",
    "zstd-dev >= 1.5.7",
    "bzip2-dev >= 1.0.8",
    "pkgconf >= 3.0.5"
]
provides = [
    "libelf",
    "so:libelf.so.1"
]

[upstream]
url = "https://sourceware.org/elfutils/ftp/"
version_regex = '([0-9]+\.[0-9]+)/'

[source]
url = "https://sourceware.org/elfutils/ftp/0.196/elfutils-0.196.tar.bz2"
sha256 = "fd5cc6b77ad6773cac93cb3f415f9318ac3b3455eecf801f6b4a742c4f6c7209"

[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-debuginfod",
    "--enable-libdebuginfod=dummy",
    "--disable-static",
]
