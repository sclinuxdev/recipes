schema_version = 1

[package]
name = "libelf"
version = "0.196"
release = "2"
description = "libelf shared runtime library (from elfutils)"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
channel = "system"
arch = "aarch64"

[source]
url = "https://sourceware.org/elfutils/ftp/0.196/elfutils-0.196.tar.bz2"
sha256 = "fd5cc6b77ad6773cac93cb3f415f9318ac3b3455eecf801f6b4a742c4f6c7209"

dependencies = [
    "zlib >= 1.3.2",
    "xz-libs >= 5.8.3",
    "zstd-libs >= 1.5.7",
    "bzip2-libs >= 1.0.8"
]

build_dependencies = [
    "zlib-dev >= 1.3.2",
    "xz-dev >= 5.8.3",
    "zstd-dev >= 1.5.7",
    "bzip2-dev >= 1.0.8",
    "pkgconf >= 3.0.5"
]

provides = [
    "libelf",
    "so:libelf.so.1"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy --disable-static",
    "make -C lib",
    "make -C libelf"
]

install = [
    "make -C libelf install DESTDIR=$DESTDIR",
    # Upstream installs the real object as libelf-0.196.so plus symlinks
    # libelf.so.1 -> real and dev-symlink libelf.so -> .so.1. The old
    # boilerplate cleanup `( -type l -o -type f ) -name '*.so'
    # ! -name '*.so.*' -delete` matched the REAL FILE's name too (it ends in
    # ".so" and contains no second dot) and deleted it, shipping a dangling
    # .so.1 -- the empty-shell bug. Drop only dev *symlinks* now.
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var $DESTDIR/usr/lib/pkgconfig $DESTDIR/usr/lib/cmake 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f \\( -name '*.a' -o -name '*.la' \\) -delete 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type l -name '*.so' -delete 2>/dev/null || true",
    "[ -f $DESTDIR/usr/lib/libelf-0.196.so ] && [ -L $DESTDIR/usr/lib/libelf.so.1 ] && [ ! -e $DESTDIR/usr/lib/libelf.so ] || { echo 'ERROR: libelf payload incomplete' >&2; exit 1; }"
]
