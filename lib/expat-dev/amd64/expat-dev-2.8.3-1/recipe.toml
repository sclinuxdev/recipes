schema_version = 2

[package]
name = "expat-dev"
version = "2.8.3"
release = "1"
description = "libexpat headers, pkg-config and linker symlink"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "expat-libs >= 2.8.3"
]
provides = [
    "expat-dev"
]

[upstream]
url = "https://github.com/libexpat/libexpat/tags"
version_regex = 'R_([0-9]+_[0-9]+_[0-9]+)'

[source]
url = "https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.xz"
sha256 = "f6256df90c906773d344da084402b7d3e4f22ed41b1a59c989098a83d3ea0c85"

[build]
system = "autotools"
configure_options = [
    "--disable-static"
]
