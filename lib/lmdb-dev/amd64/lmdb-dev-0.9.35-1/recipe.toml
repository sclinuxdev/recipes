schema_version = 2

[package]
name = "lmdb-dev"
version = "0.9.35"
release = "1"
description = "LMDB headers, pkg-config and linker symlink"
license = "OpenLDAP"
channel = "system"
arch = "amd64"
dependencies = [
    "lmdb >= 0.9.35"
]
provides = [
    "lmdb-dev"
]

[upstream]
url = "https://github.com/LMDB/lmdb/tags"
version_regex = 'LMDB_(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/LMDB/lmdb/archive/refs/tags/LMDB_0.9.35.tar.gz"
sha256 = "18b021fd589d30cc08860a9550a30ae51637117451385e9581616da751326632"

[build]
system = "make"
payload = "allowlist"
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
source_subdir = "libraries/liblmdb"
build_targets = ["all"]
install_targets = ["install"]
