schema_version = 1

[package]
name = "lmdb-dev"
version = "0.9.35"
release = "1"
description = "LMDB headers, pkg-config and linker symlink"
license = "OpenLDAP"
channel = "system"

[source]
url = "https://github.com/LMDB/lmdb/archive/refs/tags/LMDB_0.9.35.tar.gz"
sha256 = "18b021fd589d30cc08860a9550a30ae51637117451385e9581616da751326632"

dependencies = [
    "lmdb >= 0.9.35"
]

provides = [
    "lmdb-dev"
]

prepare = []

build = [
    "cd libraries/liblmdb && make -j$(nproc)"
]

install = [
    "mkdir -p $DESTDIR/usr/include $DESTDIR/usr/lib/pkgconfig",
    "cd libraries/liblmdb && make prefix=/usr install DESTDIR=$DESTDIR",
    "ln -sfn liblmdb.so.0 $DESTDIR/usr/lib/liblmdb.so",
    "printf 'prefix=/usr\\nexec_prefix=${prefix}\\nlibdir=${exec_prefix}/lib\\nincludedir=${prefix}/include\\n\\nName: lmdb\\nDescription: Lightning Memory-Mapped Database\\nVersion: 0.9.35\\nLibs: -L${libdir} -llmdb\\nCflags: -I${includedir}\\n' > $DESTDIR/usr/lib/pkgconfig/lmdb.pc",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
