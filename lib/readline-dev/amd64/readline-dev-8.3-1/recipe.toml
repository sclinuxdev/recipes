schema_version = 2

[package]
name = "readline-dev"
version = "8.3"
release = "1"
description = "GNU Readline headers, pkg-config and linker symlink"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "readline >= 8.3",
]
provides = [
    "readline-dev"
]

[upstream]
url = "https://ftp.gnu.org/gnu/readline/"
version_regex = 'readline-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
system = "autotools"
configure_options = [
    "--disable-static",
    "--with-curses"
]
