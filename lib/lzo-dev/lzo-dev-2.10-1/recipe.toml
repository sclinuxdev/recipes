schema_version = 1

[package]
name = "lzo-dev"
version = "2.10"
release = "1"
description = "LZO headers, pkg-config and linker symlink"
license = "GPL-2.0-or-later"
channel = "system"

[source]
url = "https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz"
sha256 = "c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072"

dependencies = [
    "lzo >= 2.10"
]

provides = [
    "lzo-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --enable-shared --disable-static",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
