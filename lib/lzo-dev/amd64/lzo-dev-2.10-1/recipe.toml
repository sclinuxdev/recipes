schema_version = 2

[package]
name = "lzo-dev"
version = "2.10"
release = "1"
description = "LZO headers, pkg-config and linker symlink"
license = "GPL-2.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "lzo >= 2.10"
]
provides = [
    "lzo-dev"
]

[upstream]
url = "https://www.oberhumer.com/opensource/lzo/download/"
version_regex = 'lzo-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz"
sha256 = "c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--enable-shared",
    "--disable-static",
]
