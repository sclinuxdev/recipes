schema_version = 2

[package]
name = "tomlplusplus"
version = "3.4.0"
release = "1"
description = "toml++ compiled shared runtime library"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "gcc-libs >= 15.3.0"
]
provides = [
    "tomlplusplus",
    "so:libtomlplusplus.so.3"
]

[upstream]
url = "https://github.com/marzer/tomlplusplus/tags"
version_regex = 'v(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/marzer/tomlplusplus/archive/refs/tags/v3.4.0.tar.gz"
sha256 = "8517f65938a4faae9ccf8ebb36631a38c1cadfb5efa85d9a72e15b9e97d25155"

# v1 was a raw g++ one-liner; the upstream tree's canonical frontend is cmake.
[build]
system = "cmake"
