schema_version = 2

[package]
name = "mpfr"
version = "4.2.2"
release = "1"
description = "MPFR runtime library"
license = "LGPL-3.0-or-later"
channel = "system"
arch = "amd64"
dependencies = [
    "gmp >= 6.3.0"
]
provides = [
    "mpfr",
    "so:libmpfr.so.6"
]

[upstream]
url = "https://ftp.gnu.org/gnu/mpfr/"
version_regex = 'mpfr-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/mpfr/mpfr-4.2.2.tar.xz"
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"

[build]
system = "autotools"
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
    "--enable-thread-safe"
]
