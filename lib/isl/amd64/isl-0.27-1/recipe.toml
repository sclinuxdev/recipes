schema_version = 2

[package]
name = "isl"
version = "0.27"
release = "1"
description = "Integer Set Library runtime (GCC Graphite)"
license = "MIT"
channel = "system"
arch = "amd64"
dependencies = [
    "gmp >= 6.3.0"
]
provides = [
    "isl",
    "so:libisl.so.23"
]

[upstream]
url = "https://libisl.sourceforge.io/"
version_regex = 'isl-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://libisl.sourceforge.io/isl-0.27.tar.xz"
sha256 = "6d8babb59e7b672e8cb7870e874f3f7b813b6e00e6af3f8b04f7579965643d5c"

[build]
system = "autotools"
payload = "allowlist"
install_files = ["**"]
install_targets = ["install"]
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
]
