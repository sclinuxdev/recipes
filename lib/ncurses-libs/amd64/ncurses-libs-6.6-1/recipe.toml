schema_version = 2

[package]
name = "ncurses-libs"
version = "6.6"
release = "1"
description = "ncurses widechar shared runtime libraries"
license = "MIT"
channel = "system"
arch = "amd64"

dependencies = []

provides = [
    "ncurses-libs",
    "so:libncursesw.so.6",
    "so:libncurses.so.6",
    "so:libtinfo.so.6",
    "so:libtinfow.so.6",
    "so:libformw.so.6",
    "so:libmenuw.so.6",
    "so:libpanelw.so.6"
]

[upstream]
url = "https://invisible-island.net/archives/ncurses/"
version_regex = 'ncurses-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://invisible-island.net/archives/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/lib/*.so.*",
]
configure_options = [
    "--mandir=/usr/share/man",
    "--with-shared",
    "--without-debug",
    "--without-ada",
    "--enable-widec",
    "--enable-pc-files",
    "--with-pkg-config-libdir=/usr/lib/pkgconfig",
    "--with-progs",
    "--without-tests",
    "--without-manpages"
]
