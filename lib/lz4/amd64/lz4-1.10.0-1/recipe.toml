schema_version = 2

[package]
name = "lz4"
version = "1.10.0"
release = "1"
description = "lz4 extremely fast compression tool"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"
dependencies = [
    "lz4-libs >= 1.10.0"
]

provides = [
    "lz4"
]

[upstream]
url = "https://github.com/lz4/lz4/tags"
version_regex = 'v?([0-9][0-9.]*)'

[source]
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

[build]
system = "make"
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
build_targets = ["all"]
install_targets = ["install"]
