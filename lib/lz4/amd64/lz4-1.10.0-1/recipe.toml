schema_version = 2

[package]
name = "lz4"
version = "1.10.0"
release = "1"
description = "lz4 extremely fast compression tool"
license = "BSD-2-Clause"
channel = "system"
arch = "amd64"
dependencies = [
    "lz4-libs >= 1.10.0"
]
provides = [
    "lz4"
]

[upstream]
url = "https://github.com/lz4/lz4/tags"
version_regex = 'v?([0-9][0-9.]*)'

[source]
url = "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz"
sha256 = "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

[build]
system = "make"
payload = "outputs"
build_targets = ["all"]
install_targets = ["install"]

[[build.outputs]]
name = "lz4"
description = "lz4 extremely fast compression tool"
license = "BSD-2-Clause"
dependencies = [
    "lz4-libs >= 1.10.0"
]
provides = [
    "lz4"
]
install_files = [
    "usr/bin/**",
    "usr/share/man/man1/**",
    "usr/share/doc/**",
]
optional_excludes = [
    "usr/share/doc/**",
]

[[build.outputs]]
name = "lz4-libs"
description = "liblz4 shared runtime library"
license = "BSD-2-Clause"
dependencies = []
provides = [
    "lz4-libs",
    "so:liblz4.so.1"
]
install_files = [
    "usr/lib/*.so.*",
]

[[build.outputs]]
name = "lz4-dev"
description = "liblz4 headers, pkg-config and linker symlink"
license = "BSD-2-Clause"
dependencies = [
    "lz4-libs >= 1.10.0"
]
provides = [
    "lz4-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
