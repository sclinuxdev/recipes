schema_version = 2

[package]
name = "sqlite-dev"
version = "3.53.4"
release = "1"
description = "SQLite headers, pkg-config and linker symlink"
license = "blessing"
channel = "system"
arch = "amd64"

[source]
url = "https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"

dependencies = [
    "sqlite-libs >= 3.53.4"
]

provides = [
    "sqlite-dev"
]

[upstream]
url = "https://www.sqlite.org/download.html"
version_regex = 'sqlite-autoconf-(\d{7})\.tar'

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
install_excludes = [
    "usr/lib/*.so.*",
]
configure_options = [
    "--disable-static",
    "--enable-fts5",
]
