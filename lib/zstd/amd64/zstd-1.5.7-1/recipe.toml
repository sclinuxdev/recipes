schema_version = 1

[package]
name = "zstd"
version = "1.5.7"
release = 1
epoch = 0
description = "Zstandard fast real-time compression algorithm command line tools"
license = "BSD-3-Clause OR GPL-2.0-only"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "zstd-libs >= 1.5.7-1",
]

provides = ["zstd"]

[source]
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"

[build]
inherit = ["meson"]

[build.args]
meson_args = "-Dbin_programs=true -Dzlib=enabled -Dlzma=enabled -Dlz4=disabled"

[build.payload]
default = "remaining"

[[subpackages]]
name = "zstd-libs"
description = "Zstandard runtime shared library (libzstd.so.*)"
license = "BSD-3-Clause OR GPL-2.0-only"
dependencies = [
    "virtual/libc",
]
provides = ["zstd-libs", "so:libzstd.so.1"]

[subpackages.payload]
files = [
    "usr/lib/*.so.*",
]

[[subpackages]]
name = "zstd-dev"
description = "Zstandard headers, pkgconfig and linker symbols"
license = "BSD-3-Clause OR GPL-2.0-only"
dependencies = [
    "zstd-libs >= 1.5.7-1",
]
provides = ["zstd-dev"]

[subpackages.payload]
files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
]

[features.lzma]
default = true
dependencies = ["xz-libs >= 5.8.3-1"]
build_dependencies = ["xz-dev >= 5.8.3-1"]

[features.zlib]
default = true
dependencies = ["zlib-libs >= 1.3.2-1"]
build_dependencies = ["zlib-dev >= 1.3.2-1"]
