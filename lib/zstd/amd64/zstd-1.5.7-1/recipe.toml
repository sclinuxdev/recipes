schema_version = 2

[package]
name = "zstd"
version = "1.5.7"
release = "1"
description = "Zstandard compression tool"
license = "BSD-3-Clause OR GPL-2.0-only"
channel = "system"
arch = "amd64"
dependencies = [
    "zstd-libs >= 1.5.7"
]
provides = [
    "zstd"
]

[upstream]
url = "https://github.com/facebook/zstd/tags"
version_regex = 'v(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256 = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"

[build]
system = "make"
payload = "outputs"
build_targets = ["all"]
install_targets = ["install"]

[[build.outputs]]
name = "zstd"
description = "Zstandard compression tool"
license = "BSD-3-Clause OR GPL-2.0-only"
dependencies = [
    "zstd-libs >= 1.5.7"
]
provides = [
    "zstd"
]
install_files = [
    "usr/bin/**",
    "usr/share/man/man1/**",
    "usr/share/doc/**",
]
optional_excludes = [
    "usr/share/doc/**",
]

[[build.outputs]]
name = "zstd-libs"
description = "libzstd shared runtime library"
license = "BSD-3-Clause OR GPL-2.0-only"
dependencies = []
provides = [
    "zstd-libs",
    "so:libzstd.so.1"
]
install_files = [
    "usr/lib/*.so.*",
]

[[build.outputs]]
name = "zstd-dev"
description = "libzstd headers, pkg-config and linker symlink"
license = "BSD-3-Clause OR GPL-2.0-only"
dependencies = [
    "zstd-libs >= 1.5.7"
]
provides = [
    "zstd-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
