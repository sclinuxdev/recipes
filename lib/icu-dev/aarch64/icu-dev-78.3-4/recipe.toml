# ICU headers, pkg-config files and linker symlinks.

schema_version = 1

[package]
name = "icu-dev"
version = "78.3"
release = "4"
description = "Development files for ICU"
license = "ICU"
channel = "system"
arch = "aarch64"

[source]
url = "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz"
sha256 = "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0"

dependencies = [
    "icu-libs = 78.3-4"
]

build_dependencies = [
    "gcc >= 15",
    "glibc-dev >= 2.44",
    "python >= 3.14.7"
]

provides = [
    "icu-dev"
]

prepare = []

build = [
    "cd source && ./configure --prefix=/usr --bindir=/usr/bin --sbindir=/usr/bin --libdir=/usr/lib --sysconfdir=/etc --disable-samples --disable-tests --enable-static=no",
    "cd source && make"
]

install = [
    "cd source && make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/share/man",
    "find $DESTDIR/usr/lib -maxdepth 1 -name 'lib*.so.*' -delete",
    "find $DESTDIR -name '*.la' -delete",
    "rm -rf $DESTDIR/usr/share/icu",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type l -name '*.so.*' -delete 2>/dev/null || true",
    "! find $DESTDIR/usr -type l -name '*.so.*' 2>/dev/null | grep -q . || { echo 'ERROR: leftover versioned soname links in dev split' >&2; exit 1; }",
    "[ -f $DESTDIR/usr/include/unicode/uversion.h ] && [ -f $DESTDIR/usr/lib/icu/Makefile.inc ] && [ -L $DESTDIR/usr/lib/libicuuc.so ] || { echo 'ERROR: icu-dev payload incomplete' >&2; exit 1; }",
    "[ ! -e $DESTDIR/usr/share/icu ] || { echo 'ERROR: icu-dev still ships share/icu' >&2; exit 1; }",
]
