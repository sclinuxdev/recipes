schema_version = 2

[package]
name = "bzip2"
version = "1.0.8"
release = "1"
description = "bzip2/bunzip2/bzcat compression tools"
license = "bzip2-1.0.6"
channel = "system"
arch = "amd64"
dependencies = [
    "bzip2-libs >= 1.0.8"
]
provides = [
    "bzip2"
]

[upstream]
url = "https://sourceware.org/pub/bzip2/"
version_regex = 'bzip2-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"

[build]
system = "make"
install_excludes = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/*.so.*",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
build_targets = ["all"]
install_targets = ["install"]
