schema_version = 2

[package]
name = "bzip2"
version = "1.0.8"
release = "1"
description = "bzip2/bunzip2/bzcat compression tools"
license = "bzip2-1.0.6"
channel = "system"
arch = "amd64"
dependencies = [
    "bzip2-libs >= 1.0.8"
]
provides = [
    "bzip2"
]

[upstream]
url = "https://sourceware.org/pub/bzip2/"
version_regex = 'bzip2-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"

[build]
system = "make"
payload = "outputs"
build_targets = ["all"]
install_targets = ["install"]

[[build.outputs]]
name = "bzip2"
description = "bzip2/bunzip2/bzcat compression tools"
license = "bzip2-1.0.6"
dependencies = [
    "bzip2-libs >= 1.0.8"
]
provides = [
    "bzip2"
]
install_files = [
    "usr/bin/**",
    "usr/share/man/man1/**",
    "usr/share/doc/**",
]
optional_excludes = [
    "usr/share/doc/**",
]

[[build.outputs]]
name = "bzip2-libs"
description = "libbz2 shared runtime library"
license = "bzip2-1.0.6"
dependencies = []
provides = [
    "bzip2-libs",
    "so:libbz2.so.1",
    "so:libbz2.so.1.0"
]
install_files = [
    "usr/lib/*.so.*",
]
optional_excludes = [
    "usr/lib/*.so.*",
]

[[build.outputs]]
name = "bzip2-dev"
description = "bzip2 development headers and static libraries"
license = "bzip2-1.0.6"
dependencies = [
    "bzip2-libs >= 1.0.8"
]
provides = [
    "bzip2-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/share/man/man3/**",
]
optional_excludes = [
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/share/man/man3/**",
]
