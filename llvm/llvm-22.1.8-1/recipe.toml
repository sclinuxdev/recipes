schema_version = 1

[package]
name = "llvm"
version = "22.1.8"
release = "1"
description = "LLVM core: libLLVM shared library, tools and development headers (toolchain/llvm:22)"
license = "Apache-2.0 WITH LLVM-exception"
channel = "toolchain/llvm:22"

[source]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz"
sha256 = "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"

dependencies = [
    "gcc-libs >= 15.3.0",
    "zlib >= 1.3.2",
    "zstd-libs >= 1.5.7"
]

build_dependencies = [
    "cmake >= 4.4.2",
    "ninja >= 1.13.2",
    "python >= 3.14.7",
    "zlib-dev >= 1.3.2",
    "zstd-dev >= 1.5.7"
]

provides = [
    "llvm"
]

prepare = [
    "rm -rf build && mkdir -p build"
]

build = [
    "cmake -G Ninja -S llvm -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/channels/llvm/22 -DCMAKE_INSTALL_RPATH='$ORIGIN/../lib' -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON -DLLVM_ENABLE_ZLIB=ON -DLLVM_ENABLE_ZSTD=ON -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_OPTIMIZED_TABLEGEN=ON -DLLVM_APPEND_VC_REV=OFF -DLLVM_ENABLE_RTTI=ON && ninja -C build"
]

install = [
    "DESTDIR=\"$DESTDIR\" ninja -C build install"
]
