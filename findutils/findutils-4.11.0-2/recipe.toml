schema_version = 1

[package]
name = "findutils"
version = "4.11.0"
release = "2"
description = "GNU find and xargs"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/findutils/findutils-4.11.0.tar.xz"
sha256 = "bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd"

dependencies = [
    "glibc >= 2.44",
]

build_dependencies = []

provides = [
    "findutils"
]

prepare = []

build = [
    "./configure --prefix=/usr --localstatedir=/var/lib/locate --disable-nls",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
