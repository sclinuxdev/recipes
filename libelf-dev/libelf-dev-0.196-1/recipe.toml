schema_version = 1

[package]
name = "libelf-dev"
version = "0.196"
release = "1"
description = "libelf headers, pkg-config and linker symlink"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
channel = "system"

[source]
url = "https://sourceware.org/elfutils/ftp/0.196/elfutils-0.196.tar.bz2"
sha256 = "fd5cc6b77ad6773cac93cb3f415f9318ac3b3455eecf801f6b4a742c4f6c7209"

dependencies = [
    "libelf >= 0.196",
]

build_dependencies = [
    "zlib-dev >= 1.3.2",
    "pkgconf >= 3.0.5"
]

provides = [
    "libelf-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy --disable-static",
    "make -C lib -j$(nproc)",
    "make -C libelf -j$(nproc)"
]

install = [
    "make -C libelf install DESTDIR=$DESTDIR",
    "mkdir -p $DESTDIR/usr/lib/pkgconfig",
    "install -vm644 config/libelf.pc $DESTDIR/usr/lib/pkgconfig/",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
