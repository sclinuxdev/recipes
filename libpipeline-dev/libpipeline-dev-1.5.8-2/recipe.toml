schema_version = 1

[package]
name = "libpipeline-dev"
version = "1.5.8"
release = "2"
description = "libpipeline headers, pkg-config and linker symlink"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://deb.debian.org/debian/pool/main/libp/libpipeline/libpipeline_1.5.8.orig.tar.gz"
sha256 = "1b1203ca152ccd63983c3f2112f7fe6fa5afd453218ede5153d1b31e11bb8405"

dependencies = [
    "libpipeline >= 1.5.8"
]

provides = [
    "libpipeline-dev"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/bin $DESTDIR/usr/sbin $DESTDIR/usr/share $DESTDIR/etc $DESTDIR/var 2>/dev/null || true",
    "find $DESTDIR/usr/lib $DESTDIR/usr/lib64 -type f -name '*.so.*' -delete 2>/dev/null || true"
]
