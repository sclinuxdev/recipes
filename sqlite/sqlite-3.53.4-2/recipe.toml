schema_version = 1

[package]
name = "sqlite"
version = "3.53.4"
release = "2"
description = "SQLite command-line shell"
license = "blessing"
channel = "system"

[source]
url = "https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"

dependencies = [
    "sqlite-libs >= 3.53.4",
    "readline >= 8.3",
]

provides = [
    "sqlite"
]

prepare = []

build = [
    "./configure --prefix=/usr --disable-static --enable-fts5 CFLAGS=\"$CFLAGS -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS4=1 -DSQLITE_ENABLE_COLUMN_METADATA=1 -DSQLITE_ENABLE_UNLOCK_NOTIFY=1 -DSQLITE_ENABLE_DBSTAT_VTAB=1 -DSQLITE_ENABLE_FTS3_TOKENIZER=1 -DSQLITE_SECURE_DELETE=1\"",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib $DESTDIR/usr/lib64 2>/dev/null || true"
]
