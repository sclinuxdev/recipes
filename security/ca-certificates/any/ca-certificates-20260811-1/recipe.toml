schema_version = 1

[package]
name = "ca-certificates"
version = "20260811"
release = 1
epoch = 0
description = "Common CA certificate bundle extracted from Mozilla NSS"
license = "MPL-2.0"
channel = "system"
arch = "any"

dependencies = []

provides = ["ca-certificates"]

[build]
inherit = ["custom"]

[build.args]
install_cmd = """
mkdir -p "${DESTDIR}/etc/ssl/certs" "${DESTDIR}/usr/share/ca-certificates" "${DESTDIR}/etc/ca-certificates/extracted"
touch "${DESTDIR}/etc/ssl/certs/ca-certificates.crt"
"""

[build.payload]
default = "remaining"
