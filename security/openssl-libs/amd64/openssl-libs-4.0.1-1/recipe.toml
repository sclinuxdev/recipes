schema_version = 2

[package]
name = "openssl-libs"
version = "4.0.1"
release = "1"
description = "libssl/libcrypto shared runtime libraries"
license = "Apache-2.0"
channel = "system"
arch = "amd64"

dependencies = [
    "zlib >= 1.3.2"
]
build_dependencies = [
    "zlib-dev >= 1.3.2"
]
provides = [
    "openssl-libs",
    "so:libssl.so.4",
    "so:libcrypto.so.4",
    "so:libssl.so.3",
    "so:libcrypto.so.3"
]

[source]
url = "https://www.openssl.org/source/openssl-4.0.1.tar.gz"
sha256 = "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"

[upstream]
url = "https://www.openssl.org/source/"
version_regex = 'openssl-([0-9][0-9.]*)\.tar'

[build]
system = "make"
payload = "allowlist"
build_targets = ["all"]
install_targets = ["install"]
install_files = [
    "usr/lib/libssl.so.*",
    "usr/lib/libcrypto.so.*",
]

install_symlinks = [
    { path = "usr/lib/libssl.so.3", target = "libssl.so.4" },
    { path = "usr/lib/libcrypto.so.3", target = "libcrypto.so.4" },
]

[build.variables]
INSTALL_LIBS = ""
MANSUFFIX = "ssl"

[[build.steps]]
name = "configure"
phase = "pre-build"
cwd = "source"
command = "./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic no-apps enable-deprecated enable-tls1-method enable-tls1_1-method"
