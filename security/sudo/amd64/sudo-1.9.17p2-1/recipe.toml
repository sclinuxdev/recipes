schema_version = 2

[package]
name = "sudo"
version = "1.9.17p2"
release = "1"
description = "Give certain users the ability to run some commands as root"
license = "ISC"
channel = "system"
arch = "amd64"
dependencies = [
    "zlib >= 1.3.2",
    "libxcrypt >= 4.5.2"
]
build_dependencies = [
    "glibc-dev >= 2.44",
    "zlib-dev >= 1.3.2",
    "libxcrypt-dev >= 4.5.2"
]
provides = [
    "sudo"
]

[upstream]
url = "https://www.sudo.ws/dist/"
version_regex = 'sudo-([0-9.p]+)\.tar'

[source]
url = "https://www.sudo.ws/dist/sudo-1.9.17p2.tar.gz"
sha256 = "4a38a1ab3adb1199257edc2a7c4a2bd714665eb605b04368843b06dada2cfcfb"

[build]
system = "autotools"
configure_options = [
    "--bindir=/usr/bin",
    "--sbindir=/usr/bin",
    "--libexecdir=/usr/lib",
    "--sysconfdir=/etc",
    "--with-rundir=/run/sudo",
    "--with-vardir=/var/lib/sudo",
    "--with-logfac=auth",
    "--with-secure-path='/usr/local/bin:/usr/bin'",
    "--without-pam",
    "--disable-static",
]
