schema_version = 1

[package]
name = "sudo"
version = "1.9.17p2"
release = 1
epoch = 0
description = "Authority delegation tool allowing designated users to run commands as root"
license = "ISC AND BSD-3-Clause AND BSD-2-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libxcrypt-libs >= 4.5.2-1",
    "zlib-libs >= 1.3.2-1",
]

provides = ["sudo"]

[source]
url = "https://www.sudo.ws/dist/sudo-1.9.17p2.tar.gz"
sha256 = "4a38a1ab3adb1199257edc2a7c4a2bd714665eb605b04368843b06dada2cfcfb"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--libexecdir=/usr/lib/sudo --with-rundir=/run/sudo --with-vardir=/var/db/sudo --with-logpath=/var/log/sudo.log --without-pam --enable-zlib=system"

[build.payload]
default = "remaining"
