schema_version = 2

[package]
name = "openssl"
version = "4.0.1"
release = "1"
description = "OpenSSL CLI tools and /etc/ssl configuration"
license = "Apache-2.0"
channel = "system"
arch = "amd64"
dependencies = [
    "openssl-libs >= 4.0.1"
]
build_dependencies = [
    "zlib-dev >= 1.3.2"
]
provides = [
    "openssl"
]

[upstream]
url = "https://www.openssl.org/source/"
version_regex = 'openssl-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://www.openssl.org/source/openssl-4.0.1.tar.gz"
sha256 = "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"

[build]
system = "make"
payload = "outputs"
build_targets = ["all"]
install_targets = ["install"]

[build.variables]
INSTALL_LIBS = ""
MANSUFFIX = "ssl"

[[build.outputs]]
name = "openssl"
description = "OpenSSL CLI tools and /etc/ssl configuration"
license = "Apache-2.0"
dependencies = [
    "openssl-libs >= 4.0.1"
]
provides = [
    "openssl"
]
install_files = [
    "etc/**",
    "usr/bin/**",
    "usr/share/doc/**",
    "usr/share/man/man1/**",
    "usr/share/man/man5/**",
    "usr/share/man/man7/**",
]
optional_excludes = [
    "usr/share/doc/**",
    "usr/share/man/man5/**",
    "usr/share/man/man7/**",
]

[[build.outputs]]
name = "openssl-libs"
description = "libssl/libcrypto shared runtime libraries"
license = "Apache-2.0"
dependencies = [
    "zlib >= 1.3.2"
]
provides = [
    "openssl-libs",
    "so:libssl.so.4",
    "so:libcrypto.so.4",
    "so:libssl.so.3",
    "so:libcrypto.so.3"
]
install_files = [
    "usr/lib/libssl.so.*",
    "usr/lib/libcrypto.so.*",
]
install_symlinks = [
    { path = "usr/lib/libssl.so.3", target = "libssl.so.4" },
    { path = "usr/lib/libcrypto.so.3", target = "libcrypto.so.4" },
]

[[build.outputs]]
name = "openssl-dev"
description = "OpenSSL headers, pkg-config and unversioned .so"
license = "Apache-2.0"
dependencies = [
    "openssl-libs >= 4.0.1"
]
provides = [
    "openssl-dev"
]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
optional_excludes = [
    "usr/lib/*.a",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
    "usr/share/man/man3/**",
]
