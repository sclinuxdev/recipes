schema_version = 2

[package]
name = "libseccomp-dev"
version = "2.6.0"
release = "1"
description = "libseccomp headers, pkg-config and linker symlink"
license = "LGPL-2.1-only"
channel = "system"
arch = "amd64"
dependencies = [
    "libseccomp >= 2.6.0"
]
build_dependencies = [
    "gperf >= 3.3"
]
provides = [
    "libseccomp-dev"
]

[upstream]
url = "https://github.com/seccomp/libseccomp/tags"
version_regex = 'v(\d+(?:\.\d+)+)'

[source]
url = "https://github.com/seccomp/libseccomp/releases/download/v2.6.0/libseccomp-2.6.0.tar.gz"
sha256 = "83b6085232d1588c379dc9b9cae47bb37407cf262e6e74993c61ba72d2a784dc"

[build]
system = "autotools"
install_targets = ["install"]
install_files = [
    "usr/include/**",
    "usr/lib/*.a",
    "usr/lib/*.so",
    "usr/lib/pkgconfig/**",
    "usr/lib/cmake/**",
    "usr/share/aclocal/**",
    "usr/share/pkgconfig/**",
]
configure_options = [
    "--disable-static",
]
