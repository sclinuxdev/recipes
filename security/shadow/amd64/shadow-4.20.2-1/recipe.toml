schema_version = 2

[package]
name = "shadow"
version = "4.20.2"
release = "1"
description = "Password and account management utilities"
license = "BSD-3-Clause"
channel = "system"
arch = "amd64"

dependencies = [
    "libxcrypt >= 4.5.2",
    "util-linux-libs >= 2.42.2",
    "acl-libs >= 2.4.0",
    "attr-libs >= 2.6.0"
]

build_dependencies = [
    "libxcrypt-dev >= 4.5.2",
    "util-linux-dev >= 2.42.2",
    "acl-dev >= 2.4.0",
    "attr-dev >= 2.6.0"
]

provides = [
    "shadow"
]

[upstream]
url = "https://github.com/shadow-maint/shadow/tags"
version_regex = '(\d+(?:\.[0-9]+)+)'

[source]
url = "https://github.com/shadow-maint/shadow/releases/download/4.20.2/shadow-4.20.2.tar.gz"
sha256 = "e5016b40541ee6fa02ea3d409547cef6e7eea9b31f0e3482e4874f87c1d0c7c5"

[build]
system = "autotools"
install_targets = ["install"]
configure_options = [
    "--sysconfdir=/etc",
    "--disable-static",
    "--with-bcrypt",
    "--with-yesycrypt",
    "--without-libbsd",
    "--disable-logind",
    "--with-group-name-max-length=32"
]
