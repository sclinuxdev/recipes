schema_version = 2

[package]
name = "openssl-dev"
version = "4.0.1"
release = "1"
description = "OpenSSL headers, pkg-config and unversioned .so"
license = "Apache-2.0"
channel = "system"
arch = "amd64"
dependencies = [
    "openssl-libs >= 4.0.1"
]
build_dependencies = [
    "zlib-dev >= 1.3.2"
]
provides = [
    "openssl-dev"
]

[upstream]
url = "https://www.openssl.org/source/"
version_regex = 'openssl-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://www.openssl.org/source/openssl-4.0.1.tar.gz"
sha256 = "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"

[build]
system = "make"
build_targets = ["all"]
install_targets = ["install"]

[build.variables]
INSTALL_LIBS = ""
MANSUFFIX = "ssl"
