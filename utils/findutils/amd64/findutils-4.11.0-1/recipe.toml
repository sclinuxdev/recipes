schema_version = 1

[package]
name = "findutils"
version = "4.11.0"
release = 1
epoch = 0
description = "GNU utilities for finding files in directory trees (find, xargs, locate)"
license = "GPL-3.0-or-later"
channel = "system"
arch = "amd64"

dependencies = [
    "virtual/libc",
    "libseccomp-libs >= 2.6.0-1",
]

provides = ["findutils"]

[source]
url = "https://ftp.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz"
sha256 = "bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd"

[build]
inherit = ["autotools"]

[build.args]
configure_args = "--without-selinux --disable-nls"

[build.payload]
default = "remaining"
