schema_version = 2

[package]
name = "tar"
version = "1.35"
release = "1"
arch = "amd64"
description = "GNU tar archiving utility"
license = "GPL-3.0-or-later"
channel = "system"

dependencies = []

build_dependencies = []

provides = [
    "tar"
]

[upstream]
url = "https://ftp.gnu.org/gnu/tar/"
version_regex = 'tar-([0-9][0-9.]*)\.tar'

[source]
url = "https://mirrors.kernel.org/gnu/tar/tar-1.35.tar.xz"
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"

[build]
system = "autotools"
payload = "all"
install_targets = ["install"]
configure_options = [
    "--without-posix-acls",
    "--disable-nls"
]
