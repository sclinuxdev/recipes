schema_version = 1

[package]
name = "tar"
version = "1.35"
release = "1"
description = "GNU tar archiving utility"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/tar/tar-1.35.tar.xz"
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"

dependencies = [
]

build_dependencies = []

provides = [
    "tar"
]

prepare = []

build = [
    "FORCE_UNSAFE_CONFIGURE=1 ./configure --prefix=/usr --without-posix-acls --disable-nls",
    "make"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
