schema_version = 2

[package]
name = "file-libs"
version = "5.48"
release = "1"
arch = "amd64"
description = "libmagic shared runtime library"
license = "BSD-2-Clause"
channel = "system"
dependencies = [
    "zlib >= 1.3.2",
    "bzip2-libs >= 1.0.8",
    "xz-libs >= 5.8.3"
]
build_dependencies = [
    "zlib-dev >= 1.3.2",
    "bzip2-dev >= 1.0.8",
    "xz-dev >= 5.8.3"
]
provides = [
    "file-libs",
    "so:libmagic.so.1"
]

[upstream]
url = "https://astron.com/pub/file/"
version_regex = 'file-([0-9]+\.[0-9.]+)\.tar'

[source]
url = "https://astron.com/pub/file/file-5.48.tar.gz"
sha256 = "ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283"

[build]
system = "autotools"
configure_options = [
    "--disable-static",
]
