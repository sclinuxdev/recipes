# busybox -- single-binary userland.
#
# New package. mkinitcpio's `base` hook hard-fails without busybox, which is
# why the deployed system had to fall back to the `systemd` hook. Packaging it
# restores the choice.
#
# Built static: the whole point of the copy in an initramfs is that it works
# before any shared library is reachable.

schema_version = 1

[package]
name = "busybox"
version = "1.38.0"
release = "2"
arch = "aarch64"
description = "Single-binary implementation of common UNIX utilities"
license = "GPL-2.0-only"
channel = "system"

[source]
url = "https://busybox.net/downloads/busybox-1.38.0.tar.bz2"
sha256 = "34f9ea6ff8636f2c9241153b9114eefa9e65674a45318ae1ef95bb5f31c53bb2"

dependencies = []

build_dependencies = [
    "glibc-dev >= 2.44",
    "perl >= 5.44.0"
]

# Deliberately no `provides` for the applets. busybox is a fallback, not the
# system's coreutils/sed/grep -- claiming those names would let the solver
# satisfy a real dependency with the stripped-down applet.
provides = [
    "busybox"
]

prepare = [
    "make defconfig",
    "sed -i 's|^# CONFIG_STATIC is not set|CONFIG_STATIC=y|' .config",
    "sed -i 's|^CONFIG_STATIC=n|CONFIG_STATIC=y|' .config",
    # Applets that need a shared-library-only interface or conflict with the
    # real packages when installed into /usr/bin.
    "sed -i 's|^CONFIG_INSTALL_APPLET_SYMLINKS=y|# CONFIG_INSTALL_APPLET_SYMLINKS is not set|' .config",
    "sed -i 's|^CONFIG_INSTALL_APPLET_HARDLINKS=y|# CONFIG_INSTALL_APPLET_HARDLINKS is not set|' .config",
    "sed -i 's|^# CONFIG_INSTALL_APPLET_DONT is not set|CONFIG_INSTALL_APPLET_DONT=y|' .config",
    "sed -i 's|^CONFIG_TC=y|# CONFIG_TC is not set|' .config",
    "yes '' | make oldconfig >/dev/null"
]

build = [
    "make"
]

# 用户路径与 mkinitcpio 约定的输入路径都安装真实静态二进制。后者如果是软链接，
# base hook 把它写成 initramfs 的 /bin/busybox 时会生成指向自身的循环链接。
install = [
    "mkdir -p $DESTDIR/usr/bin $DESTDIR/usr/lib/initcpio",
    "install -m755 busybox $DESTDIR/usr/bin/busybox",
    "install -m755 busybox $DESTDIR/usr/lib/initcpio/busybox"
]
