schema_version = 2

[package]
name = "fastfetch"
version = "2.67.1"
release = "1"
arch = "amd64"
description = "Fast, highly customizable system information tool"
license = "MIT"
channel = "system"

dependencies = [
    "zlib >= 1.3.2",
    "sqlite-libs >= 3.53.4"
]

build_dependencies = [
    "cmake >= 4.4.2",
    "pkgconf >= 3.0.5",
    "zlib-dev >= 1.3.2",
    "sqlite-dev >= 3.53.4"
]

provides = [
    "fastfetch"
]

[upstream]
url = "https://github.com/fastfetch-cli/fastfetch/tags"
version_regex = '(\d+(?:\.[0-9]+)+)'

[source]
url = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.67.1.tar.gz"
sha256 = "52489550d1fdeac8bde8b3442064e3bc78d28fda752a171dc46a6cd97454f237"

[build]
system = "cmake"
configure_options = [
    "-DBUILD_TESTS=OFF"
]
