schema_version = 1

[package]
name = "tcl"
version = "8.6.18"
release = "2"
description = "Tcl interpreter (tclsh)"
license = "TCL"
channel = "system"

[source]
url = "https://downloads.sourceforge.net/project/tcl/Tcl/8.6.18/tcl8.6.18-src.tar.gz"
sha256 = "14f9af32b1767ff718477a8f974ad03c34341097e6b43f4ce54644ee974e268e"

dependencies = [
    "tcl-libs >= 8.6.18"
]

provides = [
    "tcl"
]

prepare = []

build = [
    "cd unix && ./configure --prefix=/usr --mandir=/usr/share/man",
    "cd unix && make -j$(nproc)"
]

install = [
    "cd unix && make install DESTDIR=$DESTDIR",
    "ln -sfv tclsh8.6 $DESTDIR/usr/bin/tclsh",
    "rm -rf $DESTDIR/usr/include $DESTDIR/usr/lib $DESTDIR/usr/lib64 2>/dev/null || true"
]
