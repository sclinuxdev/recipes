schema_version = 1

# The named seed stages establish the external bootstrap boundary for the
# compiler, libc, make, pkgconf, and Python. Runtime data is built before libc,
# then every later stage consumes only artifacts in this local pool. Keeping
# those seed vertices explicit makes the self-hosting provider edges acyclic.

[[stages]]
name = "seed-kernel-headers"
recipes = [
    "system/linux-api-headers/amd64/linux-api-headers-7.1.11-1/recipe.toml",
]

