schema_version = 1

[package]
name = "patch"
version = "2.8"
release = "2"
description = "Apply a diff file to an original"
license = "GPL-3.0-or-later"
channel = "system"

[source]
url = "https://mirrors.kernel.org/gnu/patch/patch-2.8.tar.xz"
sha256 = "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"

dependencies = [
    "glibc >= 2.44",
]

build_dependencies = []

provides = [
    "patch"
]

prepare = []

build = [
    "./configure --prefix=/usr",
    "make -j$(nproc)"
]

install = [
    "make install DESTDIR=$DESTDIR"
]
