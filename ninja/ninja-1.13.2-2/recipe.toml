schema_version = 1

[package]
name = "ninja"
version = "1.13.2"
release = "2"
description = "Small build system with a focus on speed"
license = "Apache-2.0"
channel = "system"

[source]
url = "https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"

dependencies = [
    "gcc-libs >= 15.3.0"
]

build_dependencies = [
    "python >= 3.14.7"
]

provides = [
    "ninja"
]

prepare = []

build = [
    "python3 configure.py --bootstrap --verbose"
]

install = [
    "install -vDm755 ninja $DESTDIR/usr/bin/ninja",
    "install -vDm644 misc/bash-completion $DESTDIR/usr/share/bash-completion/completions/ninja 2>/dev/null || true",
    "install -vDm644 misc/zsh-completion $DESTDIR/usr/share/zsh/site-functions/_ninja 2>/dev/null || true"
]
