schema_version = 1

[package]
name = "mkinitcpio"
version = "41.1"
release = "2"
description = "Modular initramfs image creation utility"
license = "GPL-2.0-only"
channel = "system"

[source]
url = "https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v41.1/mkinitcpio-v41.1.tar.gz"
sha256 = "202ffca349ceb6b62513cc65a67d6fc0c0c15cacc72710ce5228b444cf1317e6"

dependencies = [
    "bash >= 5.3.15",
    "kmod >= 34.2",
    "coreutils >= 9.11",
    "util-linux >= 2.42.2",
    "findutils >= 4.11.0",
    "grep >= 3.12",
    "gawk >= 5.4.1",
    "sed >= 4.10",
    "zstd >= 1.5.7",
    "libarchive >= 3.8.9",
    "systemd >= 261.2",
    "systemd-libs >= 261.2",
    "systemd-udev >= 261.2"
]

build_dependencies = [
    "meson >= 1.12.0",
    "ninja >= 1.13.2",
    "pkgconf >= 3.0.5"
]

provides = [
    "mkinitcpio",
    "virtual/initramfs-generator"
]

prepare = []

build = [
    "meson setup build --prefix=/usr --sysconfdir=/etc -Ddocs=false",
    "ninja -C build"
]

install = [
    "DESTDIR=$DESTDIR ninja -C build install"
]
